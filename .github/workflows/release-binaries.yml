name: release-binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, linux-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Publish ${{ matrix.rid }}
        run: >
          dotnet publish src/QualityGuard.Cli -c Release -r ${{ matrix.rid }}
          --self-contained -p:PublishSingleFile=true -o dist/${{ matrix.rid }}
      - name: Zip
        run: |
          cd dist/${{ matrix.rid }}
          ext=""; [ "${{ matrix.rid }}" = "win-x64" ] && ext=".exe"
          mv QualityGuard.Cli$ext qualityguard$ext
          zip ../qualityguard-${{ github.event.release.tag_name }}-${{ matrix.rid }}.zip qualityguard$ext
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} dist/qualityguard-*.zip --clobber
