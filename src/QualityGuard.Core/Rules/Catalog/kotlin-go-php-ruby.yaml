# Kotlin, Go, PHP and Ruby batch.

- key: QG-KT-SEC-0033
  name: Coroutines should not swallow cancellation
  languages: [kt]
  category: SEC
  severity: major
  effort: 20min
  tags: [coroutines, exception]
  message: Catching every throwable also catches cancellation and keeps the work running.
  summary: A coroutine body catches Throwable or Exception without rethrowing cancellation.
  why: |
    Cancellation is delivered as an exception; swallowing it means the coroutine keeps running after its
    scope was closed, holding resources and writing to objects that are already gone. Shutdown then hangs
    or corrupts state.
  fix: |
    Catch the specific exceptions you can handle, and rethrow CancellationException — or use the helper
    that runs the block only when the coroutine is still active.
  detect:
    - line: "catch\\s*\\(\\s*\\w+\\s*:\\s*(Throwable|Exception)\\s*\\)"
      requires: [suspend, launch, async]
      absent: [CancellationException]

- key: QG-KT-SEC-0034
  name: Android components should not export themselves implicitly
  languages: [kt, java]
  category: SEC
  severity: critical
  effort: 20min
  cwe: [926]
  tags: [android]
  message: An exported component with an intent filter is reachable by any application.
  summary: A component is declared exported without a permission.
  why: |
    Any application on the device can start it and pass whatever extras it likes, so the component
    becomes an entry point that never authenticates its caller. Deep links reach it from the browser too.
  fix: |
    Keep the component unexported unless it must be reachable, and protect the ones that must be with a
    signature-level permission plus validation of every extra.
  detect:
    - line: "android:exported\\s*=\\s*\"true\""
      absent: [android:permission]

- key: QG-KT-BUG-0009
  name: Nullable receivers should not be forced in chains
  languages: [kt]
  category: BUG
  severity: major
  effort: 15min
  tags: [null-safety]
  message: This chain throws as soon as one link is null.
  summary: A call chain mixes safe calls with a not-null assertion.
  why: |
    The safe call says the value may be absent and the assertion says it is not; only one of them can be
    right. The result is a crash that the type system was already warning about.
  fix: |
    Keep the chain safe end to end and provide a default with the elvis operator, or check once at the
    top and work with a non-nullable local afterwards.
  detect:
    - line: "\\?\\.[\\w.]*!!"

- key: QG-KT-SML-0020
  name: Data classes should not expose mutable collections
  languages: [kt]
  category: SML
  severity: major
  effort: 15min
  tags: [immutability]
  message: A mutable collection in a data class breaks the equality and hashing it promises.
  summary: A data class property holds a mutable list, set or map.
  why: |
    The generated equals and hashCode read the collection, so mutating it after the object was put in a
    set or used as a map key makes the entry unreachable. Copies also share the same instance.
  fix: |
    Declare the property with the read-only interface and pass a defensive copy in the constructor, or
    use an immutable collection type.
  detect:
    - line: "data\\s+class\\s+\\w+[^)]*:\\s*Mutable(List|Set|Map)<"

- key: QG-GO-SEC-0014
  name: File permissions should not be world-writable
  languages: [go]
  category: SEC
  severity: critical
  effort: 15min
  cwe: [732]
  tags: [permissions]
  message: These permissions let any account on the host modify the file.
  summary: A file or directory is created with permissions open to everyone.
  why: |
    Another process — including one running as an unprivileged service that was compromised — can
    replace the content. For scripts, configuration or key material that is a direct path to executing
    someone else's code with this program's privileges.
  fix: |
    Use restrictive permissions such as 0600 for files and 0700 for directories, and rely on group
    membership when sharing is genuinely required.
  detect:
    - line: "0o?(6|7)(6|7)(6|7)\\b"
    - invocation: [Chmod, MkdirAll, WriteFile]
      argLiterals: ["0777", "0666"]

- key: QG-GO-SEC-0015
  name: Servers should set timeouts
  languages: [go]
  category: SEC
  severity: major
  effort: 15min
  cwe: [400]
  owasp: [A6]
  tags: [dos, http]
  message: A server without timeouts can be held open by slow clients.
  summary: An HTTP server is started without read and write timeouts.
  why: |
    Default timeouts are unlimited, so a client that opens a connection and sends one byte per minute
    keeps a goroutine and a file descriptor for as long as it wants. A few thousand such connections take
    the service down without any traffic.
  fix: |
    Construct the server explicitly with read, write and idle timeouts sized for the slowest legitimate
    client, and put a reverse proxy in front for extra protection.
  detect:
    - invocation: [ListenAndServe, ListenAndServeTLS]
      receiver: [http]
      absent: [ReadTimeout]

- key: QG-GO-BUG-0003
  name: Loop variables should not be captured by goroutines
  languages: [go]
  category: BUG
  severity: critical
  effort: 15min
  tags: [concurrency]
  message: Every goroutine started here may observe the same loop variable.
  summary: A goroutine started inside a loop closes over the loop variable.
  why: |
    On older language versions the variable is reused across iterations, so the goroutines race to read
    it and most of them see the final value. The result depends on scheduling, which makes it look
    intermittent rather than wrong.
  fix: |
    Pass the value as an argument to the goroutine, or shadow it with a local copy inside the loop body.
  bad: |
    for _, item := range items {
        go process(item)
    }
  good: |
    for _, item := range items {
        item := item
        go process(item)
    }
  detect:
    - line: "go\\s+func\\s*\\(\\s*\\)\\s*\\{"
      requires: ["for "]

- key: QG-GO-SML-0007
  name: Contexts should be passed, not stored
  languages: [go]
  category: SML
  severity: major
  effort: 20min
  tags: [design]
  message: A context kept in a struct outlives the call it belongs to.
  summary: A context is stored as a struct field instead of being passed as the first parameter.
  why: |
    The context carries the deadline and cancellation of one call; keeping it in a struct means later
    calls inherit a deadline that has nothing to do with them, or one that has already expired.
  fix: |
    Pass the context as the first parameter of each method and let the caller decide its lifetime.
  detect:
    - line: "^\\s*\\w+\\s+context\\.Context\\s*$"
      requires: ["struct {"]

- key: QG-PP-SEC-0029
  name: Sessions should be regenerated at login
  languages: [php]
  category: SEC
  severity: critical
  effort: 20min
  cwe: [384]
  owasp: [A2]
  tags: [session]
  message: The session identifier does not change when the privilege level does.
  summary: Authentication succeeds without regenerating the session identifier.
  why: |
    An attacker who can set the visitor's session id before login — through a link or an injected cookie
    — keeps a valid session after the victim authenticates. The application cannot tell the two apart.
  fix: |
    Regenerate the identifier immediately after a successful login and after any privilege change, and
    discard the old session data.
  detect:
    - line: "\\$_SESSION\\s*\\[\\s*[\"'](user|auth|logged)"
      absent: [session_regenerate_id]

- key: QG-PP-SEC-0030
  name: Includes should not be built from request data
  languages: [php]
  category: SEC
  severity: blocker
  effort: 25min
  cwe: [98]
  owasp: [A3]
  tags: [file-inclusion]
  message: The included path comes from the request, which allows executing arbitrary files.
  summary: An include or require receives a value derived from user input.
  why: |
    The interpreter executes whatever file the path resolves to, so an attacker who controls part of it
    runs code that is already on the server — an upload, a log file, a session file — with the privileges
    of the application.
  fix: |
    Map a small set of accepted identifiers to fixed file names and include only those. Never concatenate
    a request value into the path.
  detect:
    - line: "(include|require)(_once)?\\s*[\\( ]\\s*[^;]*\\$_(GET|POST|REQUEST|COOKIE)"

- key: QG-PP-SML-0010
  name: Comparisons should be strict
  languages: [php]
  category: SML
  severity: major
  effort: 10min
  tags: [suspicious]
  message: Loose comparison converts the operands before comparing them.
  summary: The loose equality operator is used.
  why: |
    The conversion rules make surprising pairs equal — a numeric string and a number, an empty string
    and zero — which turns a comparison intended as an identity check into an accidental match. Hash
    comparisons written this way have been exploited in practice.
  fix: |
    Use the strict operators, and convert the operands explicitly when a cross-type comparison is really
    intended. Compare secrets with the constant-time helper.
  detect:
    - line: "[^=!<>]\\s(==|!=)\\s[^=]"

- key: QG-RB-SEC-0013
  name: Mass assignment should be restricted
  languages: [rb]
  category: SEC
  severity: critical
  effort: 20min
  cwe: [915]
  owasp: [A5]
  tags: [rails, mass-assignment]
  message: Passing the whole parameter hash lets a request set any attribute.
  summary: A model is created or updated directly from unfiltered request parameters.
  why: |
    Every column becomes writable from the outside, including the ones the form never shows — role,
    account balance, owner. A single extra field in the request is enough to escalate privileges.
  fix: |
    Permit exactly the attributes the action accepts with strong parameters, and keep sensitive columns
    out of that list.
  detect:
    - line: "(new|create|update|update_attributes)\\s*\\(\\s*params\\s*\\[?"
      absent: [permit]

- key: QG-RB-SEC-0014
  name: Rendered templates should not come from parameters
  languages: [rb]
  category: SEC
  severity: critical
  effort: 25min
  cwe: [22]
  owasp: [A1]
  tags: [rails]
  message: The rendered path comes from the request, which can expose arbitrary files.
  summary: A render or redirect target is taken from request parameters.
  why: |
    The framework resolves the value as a template or a URL, so an attacker chooses which file is
    rendered — including files outside the view directory — or where the user is sent afterwards.
  fix: |
    Map accepted values to fixed templates or routes, and use the path helpers instead of building the
    target from input.
  detect:
    - line: "render\\s+params\\[|redirect_to\\s+params\\["

- key: QG-RB-SML-0007
  name: Rescue clauses should name the exception
  languages: [rb]
  category: SML
  severity: major
  effort: 10min
  tags: [exception]
  message: A bare rescue catches everything, including signals and exits.
  summary: A rescue clause is written without an exception class.
  why: |
    The default is StandardError, but a bare rescue in a begin block also hides programming errors such
    as a misspelled method, and the process keeps running in a state nobody designed for.
  fix: |
    Rescue the specific errors the operation raises, log the rest with context, and let unexpected
    exceptions reach the top-level handler.
  detect:
    - line: "^\\s*rescue\\s*$"
