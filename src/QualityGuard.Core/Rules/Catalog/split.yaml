- key: QG-CS-SML-0502
  name: Types should not accumulate too many members
  languages: [cs, vb]
  category: SML
  severity: major
  effort: 45min
  tags: [design]
  summary: A type declares more methods and fields than one responsibility needs.
  why: |
    A type this size is doing several jobs, so every change touches it and every reader has to work out
    which part is relevant. Its tests grow in the same way, which makes them slow and fragile.
  fix: |
    Split along the responsibilities the type has accumulated — the fields that always travel together
    usually indicate where the seam is — and let the original delegate to the new types.

