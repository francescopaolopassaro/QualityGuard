- key: QG-CS-BUG-0159
  name: Cleanup blocks should not change the control flow
  languages: [cs, vb]
  category: BUG
  severity: blocker
  effort: 20min
  tags: [exception]
  summary: A finally block contains a return, break, continue or throw.
  why: |
    The jump replaces whatever was in flight, including an exception on its way to the caller. The
    failure disappears and the method reports success, which is the hardest kind of defect to trace.
  fix: |
    Keep cleanup blocks for cleanup. Move the value or the decision into the protected block, or rethrow
    after the cleanup has run.

