- key: QG-CS-CNV-0012
  name: Trailing commas should not be used
  languages: [cs, vb]
  category: CNV
  severity: minor
  effort: 2min
  tags: [convention]
  summary: A comma is followed directly by a closing bracket or brace.
  why: |
    Support for trailing commas differs between language versions and tools, so the same file can parse
    in one place and fail in another. Where it is accepted it also hides an accidentally deleted element.
  fix: |
    Remove the comma before the closing delimiter.

