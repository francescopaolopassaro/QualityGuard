- key: QG-CS-SML-0527
  name: Type names should be unique across the code base
  languages: [cs, vb]
  category: SML
  severity: minor
  effort: 20min
  tags: [naming]
  summary: Two files declare a type with the same name.
  why: |
    Imports and stack traces stop being unambiguous: a reader has to check which one is meant, and an
    accidental import of the wrong one compiles until the shapes diverge.
  fix: |
    Rename one of them after what makes it different, or merge them if they represent the same concept.

