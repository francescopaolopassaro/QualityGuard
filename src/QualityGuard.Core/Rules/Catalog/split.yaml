- key: QG-CS-PRF-0008
  name: Strings should not be built by concatenation inside a loop
  languages: [cs, vb]
  category: PRF
  severity: major
  effort: 15min
  tags: [performance]
  summary: A loop appends to a string with concatenation, allocating a new string on every iteration.
  why: |
    Strings are immutable in most languages, so each append copies everything accumulated so far. The
    cost grows with the square of the number of iterations: unnoticeable for ten items, dominant for a
    few thousand.
  fix: |
    Accumulate the pieces in a string builder, or collect them in a list and join once after the loop.
  bad: |
    var report = "";
    foreach (var row in rows) report += row + "\n";
  good: |
    var report = new StringBuilder();
    foreach (var row in rows) report.Append(row).Append('\n');

