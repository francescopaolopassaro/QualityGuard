- key: QG-CS-BUG-0160
  name: Locks should be taken on a private object
  languages: [cs, vb]
  category: BUG
  severity: critical
  effort: 20min
  tags: [concurrency]
  summary: A lock is taken on the instance itself, on a type, or on a string.
  why: |
    Anything reachable from outside can be locked by other code, so two components that know nothing
    about each other end up serialising, or deadlocking. Interned strings and type objects are shared
    for the whole process, which makes it worse.
  fix: |
    Lock a private object created for that purpose, keep the critical section short, and never call out
    to unknown code while holding it.

