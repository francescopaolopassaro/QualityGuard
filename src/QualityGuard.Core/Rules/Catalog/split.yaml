- key: QG-CS-BUG-0165
  name: Loops should be able to run more than once
  languages: [cs, vb]
  category: BUG
  severity: major
  effort: 10min
  tags: [suspicious, control-flow]
  summary: The body of the loop always breaks or returns, so it runs a single time.
  why: |
    The code reads as a repetition but behaves as a single step. Whoever wrote it expected the jump to
    happen only in one case, so the loop silently processes the first element and drops the rest — a
    defect that is invisible in tests written with one-element inputs.
  fix: |
    Decide which of the two the code means. If a single step is correct, remove the loop and keep the
    body. If the repetition is correct, move the jump under the condition that is supposed to end it.

