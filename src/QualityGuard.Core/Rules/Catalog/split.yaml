- key: QG-CS-BUG-0153
  name: A variable should not be assigned to itself
  languages: [cs, vb]
  category: BUG
  severity: major
  effort: 5min
  tags: [suspicious]
  summary: The same name appears on both sides of a plain assignment, so nothing changes.
  why: |
    The statement has no effect at all, which means the value the author wanted to store is not being
    stored. Typical causes are a shadowed parameter that should have been assigned to a field, or a
    near-identical name picked by autocompletion.
  fix: |
    Point one side at the right target: qualify the field, or use the parameter or local that holds the
    new value. If the statement is genuinely useless, delete it.
  bad: |
    this.name = name;
    price = price;      // intended: this.price = price
  good: |
    this.name = name;
    this.price = price;

