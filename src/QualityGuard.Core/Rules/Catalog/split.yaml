- key: QG-CS-BUG-0154
  name: Both operands of an operator should not be identical
  languages: [cs, vb]
  category: BUG
  severity: major
  effort: 10min
  tags: [suspicious, logic]
  summary: The left and right sides of a comparison or arithmetic operator are the same expression.
  why: |
    Comparing a value with itself gives a constant, subtracting it gives zero, and dividing gives one —
    none of which is ever the point of writing the expression out. The second operand is almost always a
    copy-paste that should have named a different variable, index or field.
  fix: |
    Replace one operand with the value that belongs there. When the goal really is a constant, write the
    constant so the intent is visible.
  bad: |
    if (start <= start) { ... }
  good: |
    if (start <= end) { ... }

