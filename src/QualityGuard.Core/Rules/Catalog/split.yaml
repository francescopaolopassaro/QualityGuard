    a check that reads like a safety net while protecting nothing.
  fix: |
    Restore the real condition, or remove the branch and keep only the code path that actually applies.
    Temporary switches belong in configuration, not in a hardcoded literal.
  bad: |
    if (isEnabled || true) { deleteAll(); }
  good: |
    if (isEnabled) { deleteAll(); }

