- key: QG-CS-BUG-0173
  name: A value assigned to a local should be read before the local goes away
  languages: [cs, vb]
  category: BUG
  severity: major
  effort: 10min
  tags: [suspicious, no-effect]
  summary: A local or a parameter is incremented in a return statement, so the new value is lost.
  why: |
    The postfix form yields the value from before the change, and the variable itself disappears with
    the call, so the increment affects nothing at all. The line reads as if the caller received the
    incremented value, which is the opposite of what happens.
  fix: |
    Return the value you mean — the incremented one, computed before the return — and drop the operator
    from the return statement so the code says what it does.

