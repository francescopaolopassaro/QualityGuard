- key: QG-CS-CNV-0013
  name: Tabs should not be used for indentation
  languages: [cs, vb]
  category: CNV
  severity: minor
  effort: 5min
  tags: [convention, readability]
  summary: The line contains a tab character.
  why: |
    A tab is rendered with a different width by every editor, so mixed indentation makes alignment
    depend on who opens the file. Diffs then show whitespace-only changes that hide the real edit.
  fix: |
    Replace tabs with spaces and set the editor or formatter to do it automatically.

