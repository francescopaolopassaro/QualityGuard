  summary: The loop condition is always true and the body contains no break, return or throw.
  why: |
    Nothing in the body can end the iteration, so the thread stays inside forever. When it happens on a
    request path the request never answers and the connection stays open; when it happens at start-up
    the process appears to hang with no error to explain it.
  fix: |
    Add the exit that ends the work — a break on the terminating condition, a return of the result, or
    an error when the loop cannot make progress — or replace the condition with one that can fail.

