- key: QG-CS-CNV-0014
  name: Lines should not be too long
  languages: [cs, vb]
  category: CNV
  severity: major
  effort: 10min
  tags: [convention, readability]
  summary: The line is longer than the configured limit.
  why: |
    Long lines force horizontal scrolling and make side-by-side review impractical, which is where most
    defects are caught. They are usually a symptom too: several operations chained into one expression.
  fix: |
    Break the line at a logical boundary, or extract part of the expression into a named local.

