- key: QG-CS-SML-0504
  name: Nested blocks of code should not be left empty
  languages: [cs, vb]
  category: SML
  severity: major
  effort: 10min
  tags: [suspicious]
  summary: A block delimits no statements at all.
  why: |
    An empty block usually means a case was recognised and then not handled — an ignored exception, a
    branch someone emptied while debugging. The code reads as if the situation is covered when it is not.
  fix: |
    Fill the block with the handling it needs, or remove it. For a deliberately ignored case, add a
    comment that states the reason.

