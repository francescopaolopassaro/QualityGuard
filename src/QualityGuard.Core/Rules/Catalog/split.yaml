- key: QG-CS-SML-0517
  name: Boolean values should not be compared with literals
  languages: [cs, vb]
  category: SML
  severity: minor
  effort: 5min
  tags: [readability]
  summary: A boolean expression is compared with true or false.
  why: |
    The comparison restates what the value already says, so the reader spends a moment checking whether
    it is an equality or an inequality. It is also one keystroke away from an assignment, which would
    change the meaning without changing the shape.
  fix: |
    Use the expression directly, negating it when the false case is the interesting one.
  bad: |
    if (isReady == true) { ... }
  good: |
    if (isReady) { ... }

