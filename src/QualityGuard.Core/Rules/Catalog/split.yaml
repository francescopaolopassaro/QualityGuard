- key: QG-CS-SML-0523
  name: Jumps that change nothing should be removed
  languages: [cs, vb]
  category: SML
  severity: minor
  effort: 5min
  tags: [readability]
  summary: A return ends a function, or a continue ends a loop body, where control leaves anyway.
  why: |
    The statement suggests something is being skipped when nothing is, so a reader stops to work out
    which case it handles and finds none.
  fix: |
    Delete the statement, and keep jumps only where they exit early from the middle of a block.

