- key: QG-CS-SML-0529
  name: Types should declare something
  languages: [cs, vb]
  category: SML
  severity: minor
  effort: 15min
  tags: [design]
  summary: A type is declared with an empty body and no base type.
  why: |
    An empty type carries no behaviour and no data, so it is either a placeholder that was never filled
    or a leftover. Either way it appears in imports and documentation as if it meant something.
  fix: |
    Give it members, or delete it. A marker type is legitimate: say so with a comment when it is one.

