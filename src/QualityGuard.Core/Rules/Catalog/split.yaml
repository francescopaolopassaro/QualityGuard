- key: QG-CS-BUG-0180
  name: An assertion should not compare a value with itself
  languages: [cs, vb]
  category: BUG
  severity: critical
  effort: 10min
  tags: [tests, suspicious]
  summary: Both sides of the assertion are the same expression.
  why: |
    The assertion holds whatever the code under test does, so the test reports green even when the
    behaviour it covers is completely broken. It is the worst kind of failure to notice, because the
    suite says the case is covered.
  fix: |
    Put the value produced by the code on one side and the value you expect on the other, then check
    that the test fails when the behaviour is changed on purpose.

