- key: QG-CS-BUG-0168
  name: The result of a pure call should be used
  languages: [cs, vb]
  category: BUG
  severity: major
  effort: 5min
  tags: [suspicious, no-effect]
  summary: A call that only computes a value is used as a statement, so the value is dropped.
  why: |
    These methods return a new value and leave the receiver untouched. Written as a statement the line
    computes something and throws it away, which reads as if the object had been modified. The mistake
    survives review because the line looks like an operation.
  fix: |
    Assign the result to the variable it belongs to, or pass it on. If nothing needs the value, delete
    the line rather than leaving a call that suggests an effect it does not have.

