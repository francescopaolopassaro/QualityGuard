- key: QG-CS-SML-0522
  name: Private functions should be called
  languages: [cs, vb]
  category: SML
  severity: minor
  effort: 10min
  tags: [dead-code]
  summary: A private function is declared but nothing in the file calls or references it.
  why: |
    The function still has to be read, compiled and maintained while contributing nothing, and it often
    survives from a path that was removed, which makes the file describe behaviour that no longer
    exists.
  fix: |
    Delete it, or wire the call that was supposed to use it. Version control keeps the history.

