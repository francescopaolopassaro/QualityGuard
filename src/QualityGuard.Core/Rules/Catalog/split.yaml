- key: QG-CS-SML-0520
  name: Thrown exceptions should say what went wrong
  languages: [cs, vb]
  category: SML
  severity: major
  effort: 15min
  tags: [exception]
  summary: Code throws a base exception type rather than one that names the failure.
  why: |
    A caller cannot tell this failure from any other, so the only way to handle it is a broad catch that
    also swallows unrelated problems. The type carries no information for logs or for recovery.
  fix: |
    Throw a specific standard exception, or a small custom type that names the condition and carries the
    context the caller needs.

