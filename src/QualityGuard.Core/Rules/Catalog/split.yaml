- key: QG-CS-SML-0531
  name: Members that ignore instance state should be static
  languages: [cs, vb]
  category: SML
  severity: minor
  effort: 10min
  tags: [design]
  summary: A method never reads any instance member, yet requires an object to be called.
  why: |
    Callers have to construct or hold an instance for no reason, and readers cannot tell from the
    signature that the result depends only on the arguments. Testing it also means building an object
    that contributes nothing.
  fix: |
    Make the member static, or use the instance state it was supposed to read.

