- key: QG-CS-BUG-0181
  name: The expected value should come first in an assertion
  languages: [cs, vb]
  category: BUG
  severity: major
  effort: 5min
  tags: [tests, readability]
  summary: The constant sits in the argument the framework reads as the actual value.
  why: |
    The assertion still passes and fails at the right times, but the failure message names the two
    values the wrong way round: it reports the expectation as what the code produced. Whoever reads
    the failure starts by looking for a defect in the wrong place.
  fix: |
    Swap the arguments so the expected value comes first, the way the framework documents it.

