- key: QG-CS-SML-0536
  name: An assertion should check one thing
  languages: [cs, vb]
  category: SML
  severity: minor
  effort: 10min
  tags: [tests, readability]
  summary: A boolean assertion is given two conditions joined by a logical and.
  why: |
    When the assertion fails, the report says only that the whole expression was false. Finding out
    which half broke means running the test again by hand, which is exactly the work the test was
    supposed to save.
  fix: |
    Write one assertion per condition, so the failure points at the part that broke.

