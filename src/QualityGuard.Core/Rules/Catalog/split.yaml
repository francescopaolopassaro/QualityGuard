- key: QG-CS-BUG-0157
  name: Tests should verify something
  languages: [cs, vb]
  category: BUG
  severity: major
  effort: 15min
  tags: [tests]
  summary: A test method runs code but makes no assertion.
  why: |
    A test that cannot fail reports success forever while covering nothing, and its presence removes the
    incentive to write the real one. The suite stays green while the behaviour it claims to protect is
    free to change.
  fix: |
    Assert the outcome the test exists for, and confirm the assertion fails when the behaviour is broken
    before trusting it again.

