- key: QG-CS-SML-0528
  name: Overrides should add something
  languages: [cs, vb]
  category: SML
  severity: minor
  effort: 10min
  tags: [design]
  summary: An override only forwards to the base implementation.
  why: |
    The member changes nothing while suggesting that it does, so every reader has to check the body to
    find out. It also blocks the base class from changing its own behaviour for this type.
  fix: |
    Remove the override, or give it the behaviour it was added for.

