- key: QG-CS-SML-0538
  name: A test class should contain at least one test
  languages: [cs, vb]
  category: SML
  severity: major
  effort: 20min
  tags: [tests]
  summary: A class named as a test declares methods, but none of them is a test.
  why: |
    The suite reports green while nothing in this file is exercised. The name promises coverage that
    does not exist, so the gap stays invisible in every review and every coverage discussion.
  fix: |
    Add the missing test, or rename the class to say what it really is — a fixture, a helper or a
    builder — so nobody counts it as coverage.

