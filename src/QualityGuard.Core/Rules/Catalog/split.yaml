- key: QG-CS-SML-0503
  name: Track uses of TODO and FIXME tags
  languages: [cs, vb]
  category: SML
  severity: info
  effort: 5min
  tags: [maintainability]
  summary: A comment marks work that was left unfinished.
  why: |
    A TODO records a decision that was postponed. Left in the code it becomes invisible: nobody knows
    whether it is still relevant, who owns it, or whether the missing work is now a defect.
  fix: |
    Do the work, or move it to the issue tracker and reference the ticket in the comment so the deadline
    lives somewhere that gets reviewed.

