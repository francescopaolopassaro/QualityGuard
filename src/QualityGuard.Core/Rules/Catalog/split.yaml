- key: QG-CS-BUG-0161
  name: Members should not hide a base member by accident
  languages: [cs, vb]
  category: BUG
  severity: major
  effort: 20min
  tags: [inheritance]
  summary: A member reuses the name of one declared by a base type, without saying it is intentional.
  why: |
    Which implementation runs then depends on the static type of the reference, so the same object
    behaves differently through a base-typed variable. Nothing in the code says the two are related.
  fix: |
    Mark the member as an override when it replaces the base behaviour, or rename it when it is a
    different operation that happens to share a word.

