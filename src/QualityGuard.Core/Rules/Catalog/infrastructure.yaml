# Descriptions for the infrastructure rules implemented in Rules/Languages/InfrastructureRules.cs.
# The detection reads the file as a tree of blocks (Analysis/ConfigTree.cs), so these rules see the
# relationship between a setting and the resource that owns it, not just the keyword.

- key: QG-TF-SEC-0063
  name: Stored data should be encrypted at rest
  languages: [tf]
  category: SEC
  severity: critical
  effort: 20min
  cwe: [311]
  tags: [infrastructure, encryption]
  summary: A storage resource is declared without encryption at rest.
  why: |
    The data survives the machine it was written on: snapshots are copied, volumes are detached,
    backups travel, disks are decommissioned. Encryption at rest is the only control that still applies
    once the storage leaves the context it was created in, and it costs nothing to turn on at creation
    while it means rebuilding the resource afterwards.
  fix: |
    Enable encryption on the resource and point it at a key the organisation controls, so access can be
    revoked without touching the data.

- key: QG-TF-SEC-0064
  name: A resource should not be reachable from the whole internet
  languages: [tf]
  asvs: [V2]
  category: SEC
  severity: critical
  effort: 20min
  cwe: [284]
  tags: [infrastructure, network]
  summary: A rule opens the resource to every address, or marks it publicly accessible.
  why: |
    An open range is not "temporarily convenient": it is permanent until someone notices, and the
    address space is scanned continuously. Whatever authentication sits behind it becomes the only
    control left, and the first weakness in it is reachable from everywhere.
  fix: |
    List the networks that need the access, or put the resource behind a gateway that authenticates the
    caller. Where a public endpoint is genuinely required, say so next to the rule.

- key: QG-TF-SEC-0065
  name: Transport security should require a current TLS version
  languages: [tf]
  asvs: [V9]
  category: SEC
  severity: major
  effort: 10min
  cwe: [327]
  tags: [infrastructure, encryption]
  summary: An endpoint accepts a TLS version with known weaknesses.
  why: |
    A client that offers the old version will be served over it, so the weakest protocol the endpoint
    accepts is the one that matters. The attacks against these versions are implemented in tools anyone
    can download.
  fix: |
    Require TLS 1.2 as a minimum, and check that the clients you control already negotiate it before
    raising the floor.

- key: QG-TF-SEC-0066
  name: Audit logging should stay enabled
  languages: [tf]
  category: SEC
  severity: major
  effort: 15min
  tags: [infrastructure, logging]
  summary: Logging is explicitly switched off on a resource.
  why: |
    Without records there is no way to answer the only question that matters after an incident: what
    was reached, by whom, and when. The gap is invisible until it is needed, and by then the events are
    gone for good.
  fix: |
    Turn logging on and send the records to a destination the resource itself cannot modify, so they
    survive whatever happens to it.

- key: QG-TF-SEC-0067
  name: A policy should not grant every action to everyone
  languages: [tf]
  category: SEC
  severity: critical
  effort: 30min
  cwe: [732]
  tags: [infrastructure, permissions]
  summary: A policy uses a wildcard for its actions, resources or principals.
  why: |
    The wildcard is usually written to get something working and never narrowed afterwards. It turns
    every credential the policy applies to into a key for the whole account, so a single leaked token
    is no longer a contained incident.
  fix: |
    List the actions and the resources the role really uses — the access logs of the first week give
    you exactly that list — and keep the wildcard out of the principal.

- key: QG-K8-SEC-0023
  name: A role should not grant every permission
  languages: [k8]
  category: SEC
  severity: critical
  effort: 30min
  cwe: [732]
  tags: [infrastructure, permissions]
  summary: A role or cluster role uses a wildcard for its resources, verbs or API groups.
  why: |
    Anything that obtains the bound service account inherits the whole cluster: reading every secret,
    creating pods on any node, editing the objects that define the security posture itself. A wildcard
    in a role is therefore not a scoping detail, it is the scope.
  fix: |
    Name the resources and the verbs the workload uses. Start from what it does today and add to the
    list when something legitimately fails.

- key: QG-K8-SML-0003
  name: Workload has no liveness or readiness probes
  status: superseded
  superseded_by: QG-K8-SEC-0006
  languages: [k8]
  category: SML
  severity: minor
  effort: 15min
  tags: [kubernetes]
  message: Define liveness and readiness probes for the container.
  summary: A container is declared without health probes.
  why: |
    Probes are good practice, and no reference catalogue carries the rule — theirs cover the limits a
    container must declare, not its health checks. Ours fired once per container, thirteen times per
    thousand lines on a repository of deployment examples, which buries the findings that are defects.
  fix: |
    Where a team wants probes enforced, an admission policy is the place that can actually refuse a
    deployment without them.

- key: QG-K8-CNV-0001
  name: Workload has no app label
  status: superseded
  superseded_by: QG-K8-SEC-0006
  languages: [k8]
  category: CNV
  severity: minor
  effort: 10min
  tags: [kubernetes]
  message: Add an app label that identifies the workload.
  summary: A workload is declared without an app label.
  why: |
    Labelling conventions differ between clusters and no reference catalogue carries this rule. It
    reported once per workload on every example manifest.
  fix: |
    Agree the labels in the cluster's own conventions.

- key: QG-K8-SEC-0005
  name: Container has no security context
  status: superseded
  superseded_by: QG-K8-SEC-0006
  languages: [k8]
  category: SEC
  severity: major
  effort: 20min
  tags: [kubernetes]
  message: Define a securityContext for containers.
  summary: A container is declared without a security context.
  why: |
    The reference catalogues name the specific settings that matter — a privileged container, a
    writable root filesystem, a mounted service account token — and each of those is a finding a
    reader can act on. Asking for a security context in general fired on every container and told
    nobody what to put in it.
  fix: |
    The specific rules on privilege, on the root filesystem and on token mounting cover this ground
    and say what to change.

# Template security rules implemented in Rules/Languages/CloudFormationSecurityRules.cs. They read
# the template as a tree of declared resources, so a property is judged under the resource type that
# gives it meaning rather than wherever the word appears.

- key: QG-CF-SEC-0019
  name: An object store should block public access on every path
  languages: [cf]
  asvs: [V4]
  category: SEC
  severity: blocker
  effort: 15min
  cwe: [732]
  tags: [infrastructure, permissions]
  summary: A bucket declares its public access block but leaves one of the four guards off or absent.
  why: |
    Each guard closes a different way of making the bucket public — an access list on the bucket, one
    on an object, a policy attached later. A guard that is missing defaults to permissive, so the
    template reads as though access were settled here when it is not.
  fix: |
    Declare all four settings and set them to true, so nothing added afterwards can open the bucket.

- key: QG-CF-SEC-0031
  name: An endpoint that changes data should require authentication
  languages: [cf]
  category: SEC
  severity: critical
  effort: 30min
  cwe: [284]
  tags: [infrastructure, authentication]
  summary: An API method that writes, or that carries an administrative name, accepts unauthenticated calls.
  why: |
    Whoever finds the address can invoke it as often as they like, and the access log has nobody to
    attribute the call to. Endpoints meant to be public — sign-in, health, token exchange — are a
    deliberate exception; a method that changes state is not.
  fix: |
    Attach an authorizer, or require the platform's own request signature, and keep the open
    endpoints to the ones that have to be reachable before anyone is authenticated.

- key: QG-CF-SEC-0032
  name: A database should keep backups long enough to recover from
  languages: [cf]
  category: SEC
  severity: major
  effort: 10min
  cwe: [693]
  tags: [infrastructure, availability]
  summary: A managed database keeps fewer than seven days of backups, or does not say and keeps one.
  why: |
    Data loss is usually discovered well after it happens — a bad migration, a deletion nobody
    questioned, a job that ran twice. A window this short means the last good copy is already gone by
    the time anybody asks for it.
  fix: |
    Set a retention period of at least a week, and longer where the data would be expensive to
    reconstruct.

- key: QG-K8-SEC-0006
  name: A pod should not share a namespace with the host
  status: superseded
  superseded_by: QG-K8-SEC-0015
  languages: [k8]
  asvs: [V14]
  category: SEC
  severity: critical
  effort: 15min
  tags: [kubernetes, isolation]
  message: Remove the host namespace setting from this pod.
  summary: A pod is placed in the process, network or inter-process namespace of its node.
  why: |
    The check was written twice: this one and QG-K8-SEC-0015 read the same three fields of the same
    pod specification and reported the same line under two identifiers, which makes a report look
    twice as long as the problem is.
  fix: |
    QG-K8-SEC-0015 covers this ground and names which of the three namespaces is shared.

- key: QG-K8-SEC-0007
  name: Container is granted powerful capabilities
  status: superseded
  superseded_by: QG-K8-SEC-0011
  languages: [k8]
  category: SEC
  severity: major
  effort: 20min
  tags: [kubernetes, permissions]
  message: Drop all capabilities and add back only the ones the process calls.
  summary: A container adds Linux capabilities that let it act on the node.
  why: |
    It reported the same line as QG-K8-SEC-0011 and judged only a fixed list of the most dangerous
    capabilities, so a container adding several of them was reported once per capability while a
    container adding an unusual one was not reported at all.
  fix: |
    QG-K8-SEC-0011 reports the whole added set once, whichever capabilities it contains.

- key: QG-TF-SEC-0004
  name: Storage bucket has versioning disabled
  status: superseded
  superseded_by: QG-TF-SEC-0058
  languages: [tf]
  category: SEC
  severity: major
  effort: 20min
  tags: [infrastructure, availability]
  message: Enable versioning on the storage bucket.
  summary: A bucket is declared without versioning.
  why: |
    It read the file as lines rather than as blocks: any versioning keyword anywhere in the file
    silenced it for every bucket, and a file with several buckets was reported once, at whichever
    bucket happened to be last. It also ignored a retention policy, which solves the same problem.
  fix: |
    QG-TF-SEC-0058 judges each bucket inside its own block and stays silent where a retention policy
    already prevents an object from being replaced.
