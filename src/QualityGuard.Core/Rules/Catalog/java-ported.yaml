  effort: 15min
  tags: [sml, ported]
  message: This code is harder to read or change than the behaviour requires.
  summary: The code works but is harder to read or change than the behaviour requires.
  why: |
    The intent is buried, duplicated, or spread across places that must stay in sync, so every future
    change costs more than it should and carries a risk that has nothing to do with the change itself.
  fix: |
    Remove what is not used, name what is unclear, and keep one piece of behaviour in one place so the
    next change touches a single spot.
  detect:
    - invocation: [getSystemService]
      receiver: [Context]

- key: QG-JV-SML-0560
  name: Tests should assert something
  languages: [java]
  category: SML
  severity: minor
  effort: 5min
  tags: [tests, ported]
  message: This test cannot fail, so it verifies nothing.
  summary: A test does not assert, is disabled, or cannot fail.
  why: |
    A test that cannot fail reports success forever while covering nothing, and the suite keeps its green
    status. That is worse than having no test at all, because it removes the incentive to write one.
  fix: |
    Assert the behaviour the test exists for, re-enable it, and make sure it fails when the behaviour is
    broken before trusting it again.
  detect:
    - invocation: [assertThat, assertThatObject, describedAs, overridingErrorMessage, withFailMessage]
      receiver: [Assertions, AssertionsForClassTypes, AssertionsForInterfaceTypes]

