- key: QG-RB-BUG-0008
  name: A collection should not be passed to its own method
  languages: [rb]
  category: BUG
  severity: major
  effort: 10min
  tags: [suspicious, collections]
  summary: The receiver of the call and its only argument are the same collection.
  why: |
    The call cannot do anything useful: adding a collection to itself either does nothing or grows
    without end, removing it empties it, and testing it against itself always answers the same way. It
    is almost always a name that was not updated when the second collection was introduced.
  fix: |
    Pass the other collection. If there genuinely is only one, delete the call — it is not doing what
    the surrounding code expects.

