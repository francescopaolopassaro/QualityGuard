- key: QG-RB-SML-0031
  name: A lazy quantifier before a fixed terminator should be a negated class
  languages: [rb]
  category: SML
  severity: minor
  effort: 10min
  tags: [regex, performance]
  summary: A lazy repetition of a wide atom is followed by the one character that ends it.
  why: |
    The engine gives up a character at a time and retries the terminator after each one, which is the
    slowest way to reach it. On a long line that is quadratic work for a match a single pass would
    find.
  fix: |
    Repeat a class that excludes the terminator, and make it possessive where the flavour allows it.
  bad: |
    preg_match('/<.+?>/', $input);
  good: |
    preg_match('/<[^>]++>/', $input);

