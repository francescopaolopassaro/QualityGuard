- key: QG-RB-BUG-0039
  name: Resources should be released on every path
  languages: [rb]
  category: BUG
  severity: critical
  effort: 20min
  tags: [resource-leak]
  summary: A stream, connection or client is created without a scope that closes it.
  why: |
    An exception thrown before the close call leaves the handle open, and the descriptor or connection
    stays allocated until the process ends. Under load the pool empties and unrelated requests start
    failing.
  fix: |
    Declare the resource in a using or try-with-resources block so it closes on every path, including
    the exceptional ones.

