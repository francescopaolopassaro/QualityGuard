- key: QG-RB-SML-0053
  name: Catch clauses should name the failures they handle
  languages: [rb]
  category: SML
  severity: major
  effort: 15min
  tags: [exception]
  summary: A handler catches the base exception type instead of the failures the code can recover from.
  why: |
    The handler receives everything, including the programming errors that should surface loudly during
    testing. They get logged as if they were expected conditions, and the program keeps running in a
    state nobody designed for.
  fix: |
    Catch the specific exceptions the operation produces. Keep one broad handler at the process boundary
    that logs and rethrows, so nothing is absorbed silently deeper in the call stack.

