- key: QG-RB-BUG-0022
  name: A pattern should not contain a raw control character
  languages: [rb]
  category: BUG
  severity: major
  effort: 10min
  tags: [regex, readability]
  summary: A control character is written literally inside the pattern.
  why: |
    The character is invisible in review, disappears through copy and paste, and is rewritten by some
    editors. The pattern then behaves differently from the one everybody read, with nothing in the
    diff to explain it.
  fix: |
    Write the escape sequence — \t, \n, \r, \x1b — so the character is visible and survives editing.

