- key: QG-RB-SML-0035
  name: Control structures should not be nested too deeply
  languages: [rb]
  category: SML
  severity: major
  effort: 20min
  tags: [design, complexity]
  summary: A block sits deeper in the nesting chain than the configured limit allows.
  why: |
    Every extra level adds a condition the reader has to keep true while reading everything inside it.
    Past a few levels the indentation itself becomes the hardest part of the function, and edits made in
    the wrong branch are easy to miss in review.
  fix: |
    Invert the guards and return early, combine conditions that always appear together, or move the
    innermost level into a function whose name explains what that branch is for.
  bad: |
    if (a) { if (b) { if (c) { if (d) { work(); } } } }
  good: |
    if (!a || !b) return;
    if (c && d) work();

