- key: QG-RB-SML-0036
  name: Multi-way branches should handle the unexpected value
  languages: [rb]
  category: SML
  severity: major
  effort: 10min
  tags: [design, suspicious]
  summary: A switch or match construct lists cases but has no default branch.
  why: |
    Without a default, a value the author did not foresee simply falls through and the code continues as
    if nothing happened. That includes values added later to an enum or returned by a newer version of an
    API, which is exactly when a silent no-op is hardest to diagnose.
  fix: |
    Add the default branch and make it explicit: handle the value, or fail loudly with an error that
    names it. An empty default with a comment is still better than none, because it records the decision.
  bad: |
    switch (kind) { case A: handleA(); break; case B: handleB(); break; }
  good: |
    switch (kind) {
      case A: handleA(); break;
      case B: handleB(); break;
      default: throw new IllegalStateException("unhandled kind: " + kind);
    }

