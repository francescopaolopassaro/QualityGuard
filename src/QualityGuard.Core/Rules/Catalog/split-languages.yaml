- key: QG-RB-BUG-0021
  name: A back reference should point at a group that exists
  languages: [rb]
  category: BUG
  severity: critical
  effort: 10min
  tags: [regex, suspicious]
  summary: The pattern refers to a capturing group it does not declare.
  why: |
    Depending on the engine the reference either never matches or is reinterpreted as an octal escape,
    so the pattern quietly stops doing what it says. It is the usual consequence of adding or removing
    a group without renumbering the references.
  fix: |
    Point the reference at the right group, or switch to named groups so a renumbering cannot break
    the pattern again.

