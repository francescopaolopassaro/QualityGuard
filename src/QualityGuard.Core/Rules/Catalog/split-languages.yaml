- key: QG-RB-BUG-0018
  name: An alternation should not contain an empty branch
  languages: [rb]
  category: BUG
  severity: major
  effort: 10min
  tags: [regex, suspicious]
  summary: One branch of an alternation matches the empty string.
  why: |
    An empty branch always succeeds, so the group matches nothing at all and the other branches never
    get to decide anything. Every input passes the part of the pattern that was supposed to constrain
    it, which turns a validation into a formality.
  fix: |
    Remove the stray separator, or write what the empty branch should match. When the part really is
    optional, mark it with '?' so the intent is explicit.

