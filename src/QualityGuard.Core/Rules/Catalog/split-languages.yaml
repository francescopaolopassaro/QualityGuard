- key: QG-RB-BUG-0023
  name: A repeated group should not match the empty string
  languages: [rb]
  category: BUG
  severity: major
  effort: 15min
  tags: [regex, suspicious]
  summary: A quantifier is applied to a group that can succeed without reading anything.
  why: |
    The repetition can run without consuming input, so it adds nothing to what the pattern matches.
    Some engines loop on it instead of finishing, and the ones that do not still spend the work.
    Almost always the group was meant to require something.
  fix: |
    Make the group match at least one character, or drop the quantifier.
  bad: |
    preg_match('/(x*)*/', $input);
  good: |
    preg_match('/(x+)*/', $input);

