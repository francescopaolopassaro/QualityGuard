- key: QG-RB-SML-0025
  name: A type named like an exception should be one
  languages: [rb]
  category: SML
  severity: major
  effort: 15min
  tags: [exceptions, naming]
  summary: A class whose name ends in Exception does not derive from an exception type.
  why: |
    Callers read the name and write a catch for it; the compiler then refuses, or worse, the type is
    used as a plain value and the error it represents travels through the code unnoticed.
  fix: |
    Derive the type from the exception base of the platform, or rename it to something that does not
    promise it can be thrown and caught.

