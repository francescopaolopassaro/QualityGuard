- key: QG-RB-BUG-0030
  name: Branches of a conditional should not have the same body
  languages: [rb]
  category: BUG
  severity: major
  effort: 10min
  tags: [suspicious, logic]
  summary: Two branches of the same conditional execute an identical block.
  why: |
    If both outcomes do the same thing, the condition has no influence on behaviour: it only costs a
    reader the effort of checking whether the two blocks really are identical. The usual cause is a
    branch that was duplicated and never adapted.
  fix: |
    Give the branch the behaviour it was supposed to have, or drop the condition and keep one block.
  bad: |
    if (isAdmin) { grant(user); } else { grant(user); }
  good: |
    grant(user);

