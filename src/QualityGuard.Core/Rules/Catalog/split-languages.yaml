- key: QG-RB-BUG-0040
  name: Values of unrelated types should not be compared
  languages: [rb]
  category: BUG
  severity: major
  effort: 15min
  tags: [suspicious, types]
  summary: An equality test compares two expressions whose declared types cannot match.
  why: |
    The comparison is constant: it always answers the same way regardless of the data, so the branch it
    guards is dead. It usually comes from comparing a value with the wrong field after a refactoring.
  fix: |
    Compare the values that belong together, converting explicitly when a cross-type comparison is
    really intended.

