- key: QG-RB-SML-0037
  name: String literals should not be duplicated
  languages: [rb]
  category: SML
  severity: minor
  effort: 10min
  tags: [maintainability]
  summary: The same string literal appears several times in one file.
  why: |
    Repeated literals have to be changed together, and nothing links them: the day one occurrence is
    updated, the others keep the old value. Keys, header names and messages are the usual victims,
    because a typo in one copy produces a bug that looks like a runtime accident.
  fix: |
    Declare the value once as a constant with a name that says what it means, and reference the constant
    everywhere else.

