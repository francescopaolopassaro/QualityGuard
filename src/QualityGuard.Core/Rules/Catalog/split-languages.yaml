- key: QG-RB-SML-0032
  name: Functions should not take too many parameters
  languages: [rb]
  category: SML
  severity: major
  effort: 20min
  tags: [design]
  summary: The function signature declares more parameters than a caller can reasonably keep straight.
  why: |
    Long parameter lists are hard to call correctly: adjacent arguments of the same type can be swapped
    without any error, and every new requirement tends to add one more parameter. The length is usually a
    hint that the function is doing several things at once.
  fix: |
    Group the parameters that always travel together into a small type or options object, and split the
    function if the extra parameters only apply to part of its work.
  bad: |
    void createUser(string first, string last, string street, string city, string zip, string country, string phone, string email)
  good: |
    void createUser(Name name, Address address, ContactDetails contact)

