- key: QG-RB-BUG-0025
  name: Statements after a jump are never executed
  languages: [rb]
  category: BUG
  severity: major
  effort: 5min
  tags: [dead-code, suspicious]
  summary: A statement follows a return, break, continue or throw in the same block, so it can never run.
  why: |
    Control leaves the block at the jump, so everything written after it is dead weight the compiler or
    interpreter may not even warn about. Dead code is rarely harmless: it is usually a leftover from a
    refactoring, or a sign that the jump was added one line too early and real work is now being skipped.
  fix: |
    Decide which of the two you meant. If the following statements still matter, move them before the
    jump or make the jump conditional. If they do not, delete them so the block says what it does.
  bad: |
    return total;
    audit.log("computed", total);   // never runs
  good: |
    audit.log("computed", total);
    return total;

