- key: QG-RB-BUG-0032
  name: Regular expressions should be syntactically valid
  languages: [rb]
  category: BUG
  severity: blocker
  effort: 15min
  tags: [regex, suspicious]
  summary: A regex literal passed to a matching function does not compile.
  why: |
    An invalid pattern is only rejected when the expression is first built, which happens on the code
    path that uses it — often an error path or a rarely exercised branch. The program then fails with a
    parsing error instead of doing the validation the pattern was written for.
  fix: |
    Fix the escaping or the unbalanced group. Where the pattern lives in a string with its own escape
    rules, prefer a verbatim or raw literal so the backslashes reach the regex engine unchanged.
  bad: |
    Regex.IsMatch(input, "^[a-z+$");
  good: |
    Regex.IsMatch(input, @"^[a-z]+$");

