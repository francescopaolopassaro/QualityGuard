  why: |
    A very long function has more local state, more branches and more reasons to change than one unit of
    behaviour should have. Reviewing it means holding all of it in mind, and testing it usually means
    going through the public entry point instead of the step that is actually interesting.
  fix: |
    Extract the sections that have a name — validation, loading, formatting — into their own functions,
    and keep the original as the sequence of those steps.

