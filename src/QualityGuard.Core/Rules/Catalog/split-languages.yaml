- key: QG-RB-SML-0026
  name: A local should not be declared only to be returned on the next line
  languages: [rb]
  category: SML
  severity: minor
  effort: 5min
  tags: [readability]
  summary: A variable is assigned and immediately handed back.
  why: |
    The extra name adds a step for the reader and nothing for the program. It is normally what is left
    of a debugging session, when a value was extracted to be inspected and never put back.
  fix: |
    Return the expression directly. Keep the variable only when its name explains something the
    expression does not.

