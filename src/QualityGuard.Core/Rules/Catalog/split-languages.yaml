- key: QG-DART-SML-0046
  name: Diagnostics should not go through the trace API
  languages: [dart]
  category: SML
  severity: minor
  effort: 15min
  tags: [logging]
  message: Trace output bypasses the logging pipeline.
  summary: Output is written through the trace helpers.
  why: |
    Trace writes have no level and no structure, and they reach whichever listeners happen to be
    configured — often none in production. The information is therefore either lost or impossible to
    filter.
  fix: |
    Use the injected logger with an appropriate level so the output is routed, filtered and enriched like
    the rest of the diagnostics.

- key: QG-KT-SML-0129
  name: Functions should not be too hard to follow
  languages: [kt]
  category: SML
  severity: critical
  effort: 30min
  tags: [design, complexity]
  summary: Nesting-aware complexity of the function exceeds the configured limit.
  why: |
    The score counts each branch, loop and catch, and charges more for the ones buried inside others,
    because that is what makes code expensive to read. A high score means understanding any single line
    requires reconstructing the conditions that lead to it.
  fix: |
    Reduce the depth first: return early on the error cases, replace a nested chain with a lookup or a
    guard clause, and move an inner block into a named function. Splitting one deep function into two
    shallow ones lowers the score much faster than shortening lines.

