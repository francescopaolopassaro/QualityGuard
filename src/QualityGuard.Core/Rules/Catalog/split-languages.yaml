- key: QG-RB-CNV-0002
  name: One statement per line
  languages: [rb]
  category: CNV
  severity: minor
  effort: 5min
  tags: [convention, readability]
  summary: Two or more statements share a single source line.
  why: |
    Packed lines hide statements: a debugger stops on the whole line, a diff shows one change where two
    happened, and a reader scanning the left edge of the file misses the second statement entirely.
  fix: |
    Put each statement on its own line and let the formatter handle the layout.

