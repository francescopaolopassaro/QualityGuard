- key: QG-RB-SML-0030
  name: Repeated spaces in a pattern should be written as a count
  languages: [rb]
  category: SML
  severity: minor
  effort: 5min
  tags: [regex, readability]
  summary: The pattern contains several consecutive spaces.
  why: |
    Nobody counts spaces correctly while reading, and editors and merge tools alter them without
    anyone noticing. A pattern whose meaning depends on how many spaces survived a copy is a pattern
    that will break on a change unrelated to it.
  fix: |
    State the number explicitly with a quantifier, as in ' {3}', so the intent is visible and stable.

