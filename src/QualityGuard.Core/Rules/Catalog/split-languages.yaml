- key: QG-CSS-SML-0069
  name: Fields set only during construction should be read-only
  languages: [css]
  category: SML
  severity: minor
  effort: 10min
  tags: [immutability]
  summary: A private field is assigned in the constructor and never changed afterwards.
  why: |
    Nothing prevents a later change, so every reader has to scan the whole type to know whether the value
    is stable. Making it read-only turns that reasoning into a compiler guarantee and makes the object
    safe to share between threads.
  fix: |
    Add the read-only or final modifier. If a later assignment is genuinely needed, keep the field mutable
    and say in the code why the value changes.

