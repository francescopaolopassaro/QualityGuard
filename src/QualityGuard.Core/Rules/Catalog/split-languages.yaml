- key: QG-RB-BUG-0010
  name: Unary operators should not be repeated
  languages: [rb]
  category: BUG
  severity: major
  effort: 5min
  tags: [suspicious, readability]
  summary: The same unary operator is applied twice to the same operand.
  why: |
    Two negations cancel out, and so do two minus signs: the operand is used exactly as it was. Either a
    keystroke was duplicated, or the double form was used as a shortcut for a conversion, which hides
    the real intent behind an operator that officially does nothing.
  fix: |
    Remove the pair. When the intent was to convert a value to a boolean or a number, use the explicit
    conversion of the language so the next reader does not have to infer it.

