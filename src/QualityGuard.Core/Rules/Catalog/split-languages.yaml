- key: QG-RB-BUG-0027
  name: Conditions should not always evaluate to the same result
  languages: [rb]
  category: BUG
  severity: major
  effort: 10min
  tags: [suspicious, logic]
  summary: The condition contains a boolean literal that fixes its outcome regardless of the data.
  why: |
    A branch whose test cannot change is not a decision: either the guarded code always runs or it never
    does. This normally survives from debugging ("force this path for a moment") and then ships, leaving
    a check that reads like a safety net while protecting nothing.
  fix: |
    Restore the real condition, or remove the branch and keep only the code path that actually applies.
    Temporary switches belong in configuration, not in a hardcoded literal.
  bad: |
    if (isEnabled || true) { deleteAll(); }
  good: |
    if (isEnabled) { deleteAll(); }

