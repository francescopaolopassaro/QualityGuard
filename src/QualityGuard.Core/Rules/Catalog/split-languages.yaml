- key: QG-RB-SML-0058
  name: Commented-out code should be deleted
  languages: [rb]
  category: SML
  severity: major
  effort: 5min
  tags: [dead-code]
  summary: A comment contains code rather than an explanation.
  why: |
    Nobody can tell whether the code is a reminder, a rollback or a leftover, so it stays forever and
    slowly drifts away from the surrounding logic. It also hides the comments that do explain something.
  fix: |
    Delete it. Version control already keeps every previous version, and a branch is a better place for
    an experiment.

