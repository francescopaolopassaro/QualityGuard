- key: QG-RB-BUG-0020
  name: A quantifier should not be applied to an already repeating group
  languages: [rb]
  category: BUG
  severity: critical
  effort: 20min
  cwe: [1333]
  tags: [regex, performance, denial-of-service]
  summary: A repeating group is itself repeated, so the same text can be split in many ways.
  why: |
    On input that almost matches, the engine tries every way of dividing the text between the two
    levels of repetition, and the number of ways grows exponentially with the length of the input. A
    few dozen characters are enough to occupy a thread for minutes, which is a denial of service that
    an attacker can trigger with one request.
  fix: |
    Keep a single level of repetition — usually by making the inner element non-repeating — or use a
    possessive quantifier or an atomic group where the flavour supports it, so the engine cannot
    backtrack into the group.

