- key: QG-RB-SML-0060
  name: Non-public members should be reachable
  languages: [rb]
  category: SML
  severity: minor
  effort: 10min
  tags: [dead-code]
  summary: A private or internal function is never called anywhere in the scanned code.
  why: |
    Because the visibility keeps it inside the code base, nothing outside can call it either, so it is
    dead weight that still has to be maintained and still shows up in searches.
  fix: |
    Remove it, or restore the call that used to reach it. If it exists only for tests, make that explicit.

