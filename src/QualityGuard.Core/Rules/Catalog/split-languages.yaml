  name: Thrown exceptions should say what went wrong
  languages: [json]
  category: SML
  severity: major
  effort: 15min
  tags: [exception]
  summary: Code throws a base exception type rather than one that names the failure.
  why: |
    A caller cannot tell this failure from any other, so the only way to handle it is a broad catch that
    also swallows unrelated problems. The type carries no information for logs or for recovery.
  fix: |
    Throw a specific standard exception, or a small custom type that names the condition and carries the
    context the caller needs.

- key: QG-RB-BUG-0034
  name: Rethrowing should preserve the original trace
  languages: [rb]
  category: BUG
  severity: major
  effort: 10min
  tags: [exception, diagnostics]
  summary: A catch block throws the caught exception object again.
  why: |
    Throwing the variable restarts the trace at that line, so the frames showing where the failure
    actually happened are gone. The log then points at the handler instead of the cause.
  fix: |
    Use a bare throw to keep the original trace, or wrap the exception in a new one passing it as the
    inner exception when context has to be added.

