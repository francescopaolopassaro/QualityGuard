- key: QG-RB-SML-0048
  name: Caught exceptions should not be ignored
  languages: [rb]
  category: SML
  severity: major
  effort: 10min
  tags: [exception]
  summary: A catch block has no statements and no comment explaining the decision.
  why: |
    Swallowing a failure leaves the program running in a state nobody planned for, with no record that
    anything went wrong. The symptom appears later somewhere unrelated, and the log gives no clue where
    to start looking.
  fix: |
    Handle the case, or log it with enough context to identify the operation and rethrow. When the
    failure really is expected and harmless, keep the empty block but write down the reason.

