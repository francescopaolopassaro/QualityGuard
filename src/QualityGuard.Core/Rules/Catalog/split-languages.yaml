  name: Function bodies should not be empty
  languages: [html]
  category: SML
  severity: major
  effort: 5min
  tags: [suspicious]
  summary: A function is declared with no statements in its body.
  why: |
    Callers assume something happens. An empty body silently satisfies an interface or an override while
    doing nothing, and the missing behaviour only shows up as a value that never changes or an event that
    never arrives.
  fix: |
    Implement the body, throw a "not implemented" error while the work is pending, or — if doing nothing
    is deliberate — leave a comment stating why, so the next reader does not treat it as a gap.

