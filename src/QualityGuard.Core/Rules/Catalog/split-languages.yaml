- key: QG-RB-BUG-0026
  name: A condition should not be repeated in the same branch chain
  languages: [rb]
  category: BUG
  severity: major
  effort: 10min
  tags: [suspicious, logic]
  summary: Two branches of the same if/else-if chain test exactly the same condition.
  why: |
    The first matching branch wins, so the second copy is unreachable no matter what the data looks like.
    In practice one of the two conditions was meant to be different, which means a case the code claims
    to handle is silently falling through to the wrong branch.
  fix: |
    Compare the duplicated conditions and correct the one that is wrong. If both were really meant to be
    identical, merge the two bodies into a single branch.
  bad: |
    if (status == Status.Open) { open(); }
    else if (status == Status.Open) { escalate(); }   // dead branch
  good: |
    if (status == Status.Open) { open(); }
    else if (status == Status.Blocked) { escalate(); }

