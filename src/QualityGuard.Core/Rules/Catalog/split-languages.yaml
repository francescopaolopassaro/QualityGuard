- key: QG-RB-SML-0051
  name: Conditional expressions should not be nested
  languages: [rb]
  category: SML
  severity: major
  effort: 15min
  tags: [readability, complexity]
  summary: A conditional expression contains another conditional expression.
  why: |
    Which branch produces which value stops being visible: the association depends on precedence rather
    than on layout, and reviewers routinely read the cases in the wrong order. Adding one more case means
    rebuilding the whole expression.
  fix: |
    Use the statement form, a switch expression, or a lookup, so each case sits on its own line with its
    own condition.

