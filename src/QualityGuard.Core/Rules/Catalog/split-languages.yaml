- key: QG-RB-SML-0066
  name: Shared state should not be mutable
  languages: [rb]
  category: SML
  severity: major
  effort: 20min
  tags: [design, concurrency]
  summary: A non-private static field can be replaced by any caller.
  why: |
    Static state is shared by the whole process, so anything can change it at any time from any thread.
    Behaviour then depends on execution order, and tests interfere with each other through it.
  fix: |
    Make the field read-only, or move the value into a scoped service that is injected where it is needed.

