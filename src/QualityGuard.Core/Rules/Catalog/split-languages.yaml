- key: QG-RB-BUG-0038
  name: Equality and hashing should be overridden together
  languages: [rb]
  category: BUG
  severity: critical
  effort: 15min
  tags: [equality]
  summary: A type overrides one half of the equality contract only.
  why: |
    Hash-based collections locate an item by hash first and compare it afterwards. When the two
    definitions disagree, two objects that are equal land in different buckets and a lookup fails for an
    item that is demonstrably in the collection.
  fix: |
    Override both from the same fields, and keep those fields immutable so the hash cannot change while
    the object is stored.

