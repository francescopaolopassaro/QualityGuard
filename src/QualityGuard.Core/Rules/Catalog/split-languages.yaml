- key: QG-RB-SML-0055
  name: Disabled tests should not stay in the suite
  languages: [rb]
  category: SML
  severity: major
  effort: 15min
  tags: [tests]
  summary: A test is marked as ignored, skipped or pending.
  why: |
    A disabled test reports as green while checking nothing, and the longer it stays off the less anyone
    remembers why. The code it protected then changes freely.
  fix: |
    Fix the test and re-enable it, or delete it if the behaviour no longer exists. When it must stay off,
    reference the ticket that will bring it back.

