- key: QG-RB-BUG-0007
  name: Size comparisons should be able to fail
  languages: [rb]
  category: BUG
  severity: major
  effort: 5min
  tags: [suspicious, collections]
  summary: A count or a length is compared with a bound that it can never cross.
  why: |
    A size is never negative, so a test against zero or minus one has a fixed answer. The guard that was
    meant to protect the code protects nothing, and the branch behind it is either always taken or never
    taken — usually the check was copied from a search that returns -1 when it finds nothing.
  fix: |
    Compare with the bound you actually mean: emptiness with == 0, presence with > 0, and a search result
    with the index the search returns rather than the size of the collection.

