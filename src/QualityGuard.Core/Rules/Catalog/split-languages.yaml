- key: QG-KT-SML-0133
  name: Function parameters should be used
  languages: [kt]
  category: SML
  severity: major
  effort: 10min
  tags: [dead-code]
  summary: A parameter is declared but never read inside the function.
  why: |
    Callers are forced to compute and pass a value that changes nothing, which is misleading at every
    call site. Just as often the parameter is used in an earlier version of the logic and the body was
    changed without updating the signature — so the behaviour silently stopped depending on it.
  fix: |
    Remove the parameter and update the callers, or use it where the body was supposed to. When an
    interface or delegate forces the signature, name it with a leading underscore to record the intent.

