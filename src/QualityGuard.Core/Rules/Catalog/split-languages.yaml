- key: QG-RB-BUG-0011
  name: Shift distances should be inside the width of the value
  languages: [rb]
  category: BUG
  severity: major
  effort: 10min
  tags: [suspicious, arithmetic]
  summary: A shift moves the value by zero bits, or by more bits than the type has.
  why: |
    A shift by zero is a no-op that looks like a calculation. A shift wider than the type does not give
    zero as one would expect: most languages take the distance modulo the width, so the result is the
    value shifted by a small amount — a number that looks plausible and is wrong.
  fix: |
    Use the distance the calculation needs, and widen the value first when the shift really has to move
    it further than its current type allows.

