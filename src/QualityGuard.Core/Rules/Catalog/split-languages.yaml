- key: QG-RB-SML-0059
  name: Inheritance chains should stay shallow
  languages: [rb]
  category: SML
  severity: major
  effort: 45min
  tags: [design]
  summary: A type sits deeper in its hierarchy than the configured limit.
  why: |
    Understanding one method means opening every ancestor, and a change in the middle of the chain
    alters behaviour in classes nobody looked at. Testing a leaf type also means constructing everything
    above it.
  fix: |
    Prefer composition: hold the collaborator instead of inheriting from it, and keep inheritance for a
    genuine specialisation of one concept.

