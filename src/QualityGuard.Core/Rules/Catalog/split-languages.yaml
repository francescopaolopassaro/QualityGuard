- key: QG-RB-SML-0068
  name: A comparison inside a boolean assertion should use the dedicated assertion
  languages: [rb]
  category: SML
  severity: minor
  effort: 5min
  tags: [tests, readability]
  summary: An equality or null comparison is wrapped in an assert-true style call.
  why: |
    The framework only sees a boolean, so the failure message is "expected true, got false" and both
    values are lost. The dedicated assertion prints what was expected and what was found, which is
    usually enough to understand the failure without opening the test.
  fix: |
    Use the equality or the null assertion of the framework and pass the two values to it.

