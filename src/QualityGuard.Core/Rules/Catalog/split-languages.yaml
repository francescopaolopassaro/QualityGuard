- key: QG-RB-SML-0050
  name: Numbers should be named when their meaning is not obvious
  languages: [rb]
  category: SML
  severity: minor
  effort: 10min
  tags: [readability]
  summary: A numeric literal other than the trivial ones is used inside an expression.
  why: |
    The number carries a meaning that lives only in the head of whoever wrote it — a limit, a timeout, a
    protocol constant. The next reader has to infer it, and the same value repeated elsewhere has to be
    changed in every place at once.
  fix: |
    Give the value a named constant that states what it means, and reference the constant from every
    place that needs it.

