- key: QG-K8-SML-0063
  name: A container should ask for the memory it needs
  languages: [k8]
  category: SML
  severity: major
  effort: 15min
  tags: [kubernetes, resources]
  message: This container declares no memory request.
  summary: A container is declared without a memory request.
  why: |
    The request is what the scheduler reserves before placing the pod. With none, it treats the
    container as needing nothing and puts it on a node that is already committed elsewhere — and when
    that node runs short, a pod that asked for nothing is the first thing evicted.
  fix: |
    Declare resources.requests.memory, using what the container actually uses at rest as the figure.

- key: QG-K8-SML-0064
  name: A container should ask for the processor time it needs
  languages: [k8]
  category: SML
  severity: major
  effort: 15min
  tags: [kubernetes, resources]
  message: This container declares no cpu request.
  summary: A container is declared without a cpu request.
  why: |
    Without a request the scheduler assumes the container needs no processor share, so it packs the
    node and the container is throttled the moment anything else on it becomes busy. The symptom is
    latency nobody can attribute.
  fix: |
    Declare resources.requests.cpu.

- key: QG-K8-SML-0065
  name: A container should have a ceiling on the storage it writes
  languages: [k8]
  category: SML
  severity: major
  effort: 15min
  tags: [kubernetes, resources]
  message: This container has memory and cpu limits but none for ephemeral storage.
  summary: A container declares limits without one for ephemeral storage.
  why: |
    A log that never rotates, or a cache with no bound, fills the node's disk. The node is then marked
    out of space and every pod on it is evicted — including ones that had nothing to do with the
    container that filled it.
  fix: |
    Declare resources.limits.ephemeral-storage alongside the limits already there.

- key: QG-K8-SML-0066
  name: A container should not set the same variable twice
  languages: [k8]
  category: SML
  severity: major
  effort: 10min
  tags: [kubernetes, suspicious]
  message: This environment variable is set more than once in the same container.
  summary: A container declares the same environment variable twice.
  why: |
    The runtime keeps one of the two and does not say which, so the value the process reads is not
    necessarily the one written last in the file. Two people edited the manifest and neither saw the
    other's entry.
  fix: |
    Keep the value that is meant to apply and delete the other.

- key: QG-K8-SEC-0024
  name: The container runtime socket should not be mounted into a pod
  languages: [k8]
  category: SEC
  severity: blocker
  effort: 30min
  cwe: [284, 250]
  owasp: [A5]
  tags: [kubernetes, privilege]
  message: This mounts the socket the container runtime listens on.
  summary: A pod mounts the Docker, containerd or CRI-O socket from the host.
  why: |
    Anything that can write to that socket can start a container of its own, choosing the image, the
    mounts and the privileges. That is root on the node, whatever this pod itself was permitted to
    do, and it escapes every boundary the cluster puts around the workload.
  fix: |
    Use the API the cluster offers for the task instead. Where a build genuinely needs a runtime, give
    it one inside the pod rather than the node's.

# Cluster security rules implemented in Rules/Languages/ClusterSecurityRules.cs. They read the pod
# specification and the role definitions as a tree, so a setting is judged inside the object that
# owns it and a manifest of another kind stays silent.

- key: QG-K8-SEC-0011
  name: A container should not be granted extra kernel capabilities
  languages: [k8]
  asvs: [V4]
  category: SEC
  severity: critical
  effort: 15min
  cwe: [250]
  tags: [container, permissions]
  summary: A container adds Linux capabilities to the set the runtime gives it.
  why: |
    Each capability lifts one of the restrictions that separate a container from the node it runs on:
    binding low ports, changing ownership, loading modules, reading another process. Whatever the
    container is later made to execute inherits them, and nothing at runtime asks whether it needed
    them.
  fix: |
    Drop the capability and give the workload the narrower mechanism that solves the actual problem —
    a port above the reserved range, a volume with the right ownership, a sidecar with its own rights.

- key: QG-K8-SEC-0015
  name: A container should not share the namespaces of its host
  languages: [k8]
  category: SEC
  severity: critical
  effort: 15min
  cwe: [653]
  tags: [container, isolation]
  summary: A pod is placed in the process, network or inter-process namespace of its node.
  why: |
    The pod then sees and can reach what every other workload on that node is doing — their
    processes, their local sockets, their shared memory. The isolation the whole cluster is built on
    stops at this one line, and it stops for every container in the pod.
  fix: |
    Remove the setting and expose what the pod actually needs: a service for the network, a volume
    for the data, a dedicated agent for what has to run on the node.

- key: QG-K8-SEC-0016
  name: A workload should not expose a remote administration port
  languages: [k8]
  category: SEC
  severity: major
  effort: 15min
  cwe: [284]
  tags: [container, network]
  summary: A container or a service publishes a port used for remote shell or desktop access.
  why: |
    Reaching a container that way skips everything the application in front of it verifies, and the
    credentials such a service accepts are usually the ones baked into the image — shared, unrotated
    and identical in every replica.
  fix: |
    Remove the port and use the cluster's own mechanism to run a command inside a pod, which is
    authenticated and recorded.

- key: QG-K8-SEC-0020
  name: A role should not allow running commands inside pods
  languages: [k8]
  category: SEC
  severity: critical
  effort: 30min
  cwe: [284]
  tags: [container, permissions]
  summary: A role grants the permission to create an exec session on a pod.
  why: |
    That permission is a shell inside a running container. The holder reads the files, the mounted
    secrets and the service account token of a workload it does not own, and acts with that
    workload's identity — so the audit trail names the wrong party.
  fix: |
    Take the permission out of the roles that applications and pipelines use, and grant it separately,
    to the people who need to debug, in the namespaces where they do it.
