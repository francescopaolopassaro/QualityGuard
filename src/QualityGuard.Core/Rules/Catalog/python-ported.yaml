- key: QG-PY-SEC-0118
  name: Custom cryptographic algorithms should use current cryptographic parameters
  languages: [py]
  category: SEC
  severity: critical
  effort: 1d
  tags: [crypto, ported]
  cwe: [327]
  message: This cryptographic choice no longer provides the protection it suggests.
  summary: A cryptographic primitive, mode or key size that is no longer considered safe is used.
  why: |
    Broken primitives keep producing output that looks correct, so nothing fails while the protection is
    already gone. Data encrypted today is often kept for years, which means an algorithm that is merely
    weak now will be readable later.
  fix: |
    Use the algorithms the platform recommends today — authenticated encryption, a modern hash, a key
    size at or above the current guidance — and keep the choice in one place so it can be raised.
  detect:
    - invocation: [BasePasswordHasher, hashers]
      receiver: [auth, hashers]

- key: QG-PY-SEC-0119
  name: XML signatures should be verified before use
  languages: [py]
  category: SEC
  severity: critical
  effort: 15min
  tags: [verification, ported]
  cwe: [347]
  message: This value is accepted without the check that proves it is legitimate.
  summary: A value or a peer is accepted without the check that proves it is legitimate.
  why: |
    Without verification the program trusts whatever it received, so an attacker who can supply or
    intercept the value decides what happens next. The code keeps working in normal conditions, which is
    why the missing check is rarely noticed before it is exploited.
  fix: |
    Perform the check with the platform API — signature, certificate chain, hostname or token validation
    — and reject the value when it fails, instead of logging and continuing.
  detect:
    - invocation: [HMAC_SHA224, HMAC_SHA256, HMAC_SHA384, HMAC_SHA512, SignatureConfiguration, XMLVerifier]
      receiver: [SignatureMethod, signxml]

- key: QG-PY-SML-0378
  name: Names of regular expressions named groups should be replaced by the recommended alternative
  languages: [py]
  category: SML
  status: planned
  severity: minor
  effort: 10min
  tags: [prefer_api, ported]
  message: The platform offers a clearer or safer construct for this.
  summary: A construct is used where the platform offers one that is clearer or safer.
  why: |
    The alternative exists because it removes a class of mistake — a conversion, an allocation, an edge
    case — that the current form leaves to the caller. Using the older form means every reader has to
    check that the edge case was handled.
  fix: |
    Switch to the recommended construct; the behaviour is the same in the normal case and defined in the
    cases the old form got wrong.
- key: QG-PY-BUG-0237
  name: Tests should assert something
  languages: [py]
  category: BUG
  status: planned
  severity: major
  effort: 5min
  tags: [tests, ported]
  message: This test cannot fail, so it verifies nothing.
  summary: A test does not assert, is disabled, or cannot fail.
  why: |
    A test that cannot fail reports success forever while covering nothing, and the suite keeps its green
    status. That is worse than having no test at all, because it removes the incentive to write one.
  fix: |
    Assert the behaviour the test exists for, re-enable it, and make sure it fails when the behaviour is
    broken before trusting it again.
