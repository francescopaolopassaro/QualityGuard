- key: QG-PY-SML-0380
  name: Deprecated code should be retired
  languages: [py]
  category: SML
  severity: minor
  effort: 5min
  tags: [deprecation, ported]
  message: This deprecated element still needs to be retired.
  summary: A deprecated member is declared, used, or marked without an alternative.
  why: |
    A deprecation is a promise to remove something; left unattended it becomes permanent, and callers
    keep appearing because the member still works. Without a documented replacement nobody can migrate
    even if they want to.
  fix: |
    Document the replacement next to the marker, migrate the callers, and delete the member in a planned
    release rather than leaving the warning in place.
  detect:
    - invocation: [yield_fixture]
      receiver: [pytest]

- key: QG-PY-BUG-0239
  name: Parametrize decorators should not be left empty
  languages: [py]
  category: BUG
  status: planned
  severity: major
  effort: 5min
  tags: [empty, ported]
  message: This construct is empty, so it does nothing.
  summary: A construct is declared with no content.
  why: |
    An empty body reads as if the case is handled while nothing happens, which is exactly how ignored
    errors and unimplemented branches survive review. It is also indistinguishable from an accidental
    deletion.
  fix: |
    Implement the behaviour, or remove the construct. When doing nothing is deliberate, say so in a
    comment so the next reader does not treat it as a gap.
