- key: QG-PY-SML-0353
  name: Router prefixes should be declared the way the language intends
  languages: [py]
  category: SML
  severity: minor
  effort: 2min
  tags: [declaration, ported]
  message: This declaration exposes more than it should.
  summary: A declaration uses modifiers, order or visibility that do not match its purpose.
  why: |
    Declarations are the contract other code relies on. A wider visibility than needed makes an internal
    detail part of the public surface, and unusual modifier combinations hide the intent from readers and
    tools alike.
  fix: |
    Declare the narrowest visibility that works, in the conventional modifier order, and mark as final or
    read-only whatever is not meant to change.
  detect:
    - invocation: [APIRouter, include_router]
      receiver: [APIRouter, FastAPI, routing]

- key: QG-PY-SEC-0101
  name: Encryption algorithms should use current cryptographic parameters
  languages: [py]
  category: SEC
  severity: critical
  effort: 20min
  tags: [crypto, ported]
  cwe: [327, 780]
  message: This cryptographic choice no longer provides the protection it suggests.
  summary: A cryptographic primitive, mode or key size that is no longer considered safe is used.
  why: |
    Broken primitives keep producing output that looks correct, so nothing fails while the protection is
    already gone. Data encrypted today is often kept for years, which means an algorithm that is merely
    weak now will be readable later.
  fix: |
    Use the algorithms the platform recommends today — authenticated encryption, a modern hash, a key
    size at or above the current guidance — and keep the choice in one place so it can be raised.
  detect:
    - invocation: [Cipher]
      receiver: [ciphers]

