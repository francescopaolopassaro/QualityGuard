- key: QG-PY-BUG-0206
  name: Membership tests should not be left empty
  languages: [py]
  category: BUG
  severity: major
  effort: 5min
  tags: [empty, ported]
  message: This construct is empty, so it does nothing.
  summary: A construct is declared with no content.
  why: |
    An empty body reads as if the case is handled while nothing happens, which is exactly how ignored
    errors and unimplemented branches survive review. It is also indistinguishable from an accidental
    deletion.
  fix: |
    Implement the behaviour, or remove the construct. When doing nothing is deliberate, say so in a
    comment so the next reader does not treat it as a gap.
  detect:
    - invocation: [frozenset, tuple]
      receiver: [builtins]

