# Descriptions for the Dockerfile rules implemented in Rules/Languages/DockerfileRules.cs.

- key: QG-DK-CNV-0002
  name: Instructions should be written in upper case
  languages: [dk]
  category: CNV
  severity: minor
  effort: 2min
  tags: [containers, readability]
  summary: A Dockerfile instruction is written in lower or mixed case.
  why: |
    The convention exists so a reader can separate the instruction from its arguments at a glance, and
    so the tools that read Dockerfiles line by line keep working. A file that mixes both forms costs a
    moment of doubt on every line.
  fix: |
    Write the instruction in upper case and leave the arguments as they are.

- key: QG-DK-BUG-0005
  name: WORKDIR should take an absolute path
  languages: [dk]
  category: BUG
  severity: major
  effort: 5min
  tags: [containers, suspicious]
  summary: A WORKDIR instruction is given a relative path.
  why: |
    A relative path is resolved against whatever WORKDIR ran before it, including the ones inherited
    from the base image. Change the base, or reorder two instructions, and the build lands somewhere
    else — usually without failing, which is what makes it expensive to find.
  fix: |
    Write the absolute path, so the instruction means the same thing wherever it runs.

- key: QG-DK-BUG-0006
  name: Only the last CMD or ENTRYPOINT of a stage takes effect
  languages: [dk]
  category: BUG
  severity: major
  effort: 10min
  tags: [containers, suspicious]
  summary: A stage declares CMD or ENTRYPOINT more than once.
  why: |
    Docker keeps the last one and drops the rest without a warning. The earlier instruction is dead,
    but it is still the one a reader finds first, so the file documents a behaviour the image does not
    have.
  fix: |
    Keep one CMD and one ENTRYPOINT per stage. When two commands are genuinely needed, put the second
    one in a script the entry point calls.

- key: QG-DK-SML-0017
  name: Local files should be copied with COPY
  languages: [dk]
  category: SML
  severity: minor
  effort: 5min
  tags: [containers]
  summary: ADD is used to copy a local file that COPY would copy.
  why: |
    ADD does three things: it copies, it downloads URLs and it unpacks archives. The extra behaviour is
    decided by the name of the source, so renaming a file can change what the instruction does. COPY
    only ever copies, which is what the line was meant to say.
  fix: |
    Use COPY for local files, and keep ADD for a remote source or an archive you deliberately want
    unpacked.

- key: QG-DK-SEC-0019
  name: The whole build context should not be copied into the image
  languages: [dk]
  asvs: [V8]
  category: SEC
  severity: major
  effort: 15min
  cwe: [200]
  tags: [containers, secrets]
  summary: COPY or ADD takes the entire build context as its source.
  why: |
    Whatever sits in the directory travels into the image: local configuration, private keys someone
    tested with, the .git history with every secret ever committed. The image is then published, and
    the layers keep the files even if a later instruction deletes them.
  fix: |
    Copy the paths the image needs. If the whole context really is the answer, keep a .dockerignore and
    review it as carefully as this file.

- key: QG-DK-BUG-0007
  name: A key and its value should not be separated from the equal sign
  languages: [dk]
  category: BUG
  severity: major
  effort: 5min
  tags: [containers, suspicious]
  summary: An ENV, ARG or LABEL instruction has a space around its equal sign.
  why: |
    The parser splits the instruction on spaces, so the key, the sign and the value become separate
    arguments: the variable ends up named differently or set to an empty string. The build succeeds and
    the container starts without the setting.
  fix: |
    Write key=value with no spaces around the sign, and quote the value when it contains one.

- key: QG-DK-SML-0018
  name: Consecutive RUN instructions should be merged
  languages: [dk]
  category: SML
  severity: minor
  effort: 10min
  tags: [containers, performance]
  summary: Three or more RUN instructions follow one another.
  why: |
    Each RUN creates a layer, and a layer keeps everything the previous one left behind: package
    caches, build tools, temporary files. Deleting them in a later instruction does not shrink the
    image, because the earlier layer still contains them.
  fix: |
    Merge the commands into one RUN joined by &&, and clean up inside the same instruction so nothing
    is captured in the layer.

- key: QG-DK-SML-0003
  name: Define a HEALTHCHECK for the container
  status: superseded
  superseded_by: QG-DK-SEC-0001
  languages: [dk]
  category: SML
  severity: minor
  effort: 10min
  tags: [docker]
  message: Define a HEALTHCHECK for the container.
  summary: A Dockerfile declares no health check.
  why: |
    The advice is sound, and it belongs to a separate linter whose results the reference merely reads
    — its own catalogue does not carry the rule. Ours fired on every image in a repository of
    examples, where the orchestrator declares the probe instead.
  fix: |
    Where a team wants it enforced, the linter that owns the rule is the place to configure it.

- key: QG-DK-SML-0005
  name: Set a WORKDIR for the container
  status: superseded
  superseded_by: QG-DK-SEC-0001
  languages: [dk]
  category: SML
  severity: minor
  effort: 10min
  tags: [docker]
  message: Set a WORKDIR for the container.
  summary: A Dockerfile sets no working directory.
  why: |
    The reference catalogue carries a rule about a WORKDIR given a relative path, which is a defect
    a reader can act on. Asking for a WORKDIR to exist at all comes from an external linter, and
    fired on every image that runs a single absolute command.
  fix: |
    The rule about relative paths covers the case that goes wrong.

# Image security rules implemented in Rules/Languages/DockerSecurityRules.cs. The ones about what
# ships read only the last stage of the file: everything a builder stage does is discarded when the
# build ends, so judging it would report settings that never reach anything that runs.

- key: QG-DK-SEC-0009
  name: A shipped image should not switch on debugging features
  languages: [dk]
  asvs: [V7]
  category: SEC
  severity: critical
  effort: 10min
  cwe: [489]
  tags: [container, configuration]
  summary: The final image sets a variable that puts the application in development or debug mode.
  why: |
    What that mode turns on is usually a page that prints the stack trace, the configuration and the
    failing query — to whoever caused the error. It also relaxes checks the framework performs in
    production, and none of it fails, so the image runs for months looking healthy.
  fix: |
    Set the variable in the local environment or in the development compose file, and leave the image
    with the production defaults.

- key: QG-DK-SEC-0011
  name: A build step should not run in the network of its host
  languages: [dk]
  asvs: [V8]
  category: SEC
  severity: major
  effort: 10min
  cwe: [653]
  tags: [container, network]
  summary: A build instruction asks for the network namespace of the build machine.
  why: |
    Whatever the step downloads and executes can then reach services that are only meant to be
    reachable from inside that machine — a metadata endpoint, an internal registry, an agent that
    trusts anything on localhost.
  fix: |
    Let the step use the default isolated network, and pass in what it needs as a build argument or a
    mounted secret.

- key: QG-DK-SEC-0012
  name: A mounted secret should not be readable by every user
  languages: [dk]
  asvs: [V8]
  category: SEC
  severity: critical
  effort: 10min
  cwe: [732]
  tags: [container, secrets]
  summary: A secret or agent socket is mounted with permissions that grant access to everyone.
  why: |
    Every account inside the build step can then read it, including anything a dependency runs during
    installation. A secret mounted this way is exposed to code the author of the Dockerfile never
    reviewed.
  fix: |
    Give the mount a mode that grants nothing to others, so only the account the step runs as can
    read it.

- key: QG-DK-SEC-0017
  name: A build step should not disable the builder sandbox
  languages: [dk]
  category: SEC
  severity: critical
  effort: 15min
  cwe: [250]
  tags: [container, permissions]
  summary: A build instruction is run with the sandbox switched off.
  why: |
    The command then holds the privileges of the machine that builds the image rather than those of a
    container, and every dependency it fetches inherits them. A build agent usually holds credentials
    for far more than the image being built.
  fix: |
    Remove the flag. Where a step genuinely needs one extra privilege, grant that privilege
    specifically instead of removing the sandbox.

- key: QG-DK-SEC-0018
  name: An executable copied into an image should stay owned by root
  languages: [dk]
  asvs: [V4]
  category: SEC
  severity: critical
  effort: 10min
  cwe: [732]
  tags: [container, permissions]
  summary: A program or a file in a system directory is copied under a non-root owner.
  why: |
    Anything running as that account can rewrite the file, so a process compromised once keeps its
    foothold across every restart — the image looks unchanged and the replacement code runs with
    whatever the container is allowed to do.
  fix: |
    Copy it as root and give the runtime user read and execute access only.
