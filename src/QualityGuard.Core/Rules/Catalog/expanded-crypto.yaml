- key: QG-JV-SEC-0070
  name: A predictable number is not a secret
  languages: [java]
  category: SEC
  severity: major
  effort: 15min
  cwe: [330, 338]
  owasp: [A2]
  tags: [cryptography, sast]
  message: This generator is predictable and must not produce anything that has to be unguessable.
  summary: A general-purpose random generator produces a security-sensitive value.
  why: |
    These generators are built for speed and even distribution, not secrecy. Their output follows from an
    internal state that an observer can reconstruct after seeing a handful of values — so a token, a
    password-reset link or a session identifier built this way can be worked out rather than guessed.
  fix: |
    Use the generator the platform provides for cryptography, which draws from the operating system's
    entropy pool and cannot be replayed from its output.
  detect:
    - member: [Math.random, ThreadLocalRandom.current]

