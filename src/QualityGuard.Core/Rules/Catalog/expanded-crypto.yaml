- key: QG-CS-SEC-0097
  name: A certificate nobody checks proves nothing
  languages: [cs]
  category: SEC
  severity: blocker
  effort: 30min
  cwe: [295, 297]
  owasp: [A2]
  tags: [transport, sast]
  message: Certificate validation is switched off, so any server can present itself as this one.
  summary: Certificate or host name validation is disabled.
  why: |
    The certificate is the only thing that ties an encrypted connection to the party you meant to reach.
    With the check removed, anyone positioned between the two ends can offer a certificate of their own,
    terminate the connection, read everything and pass it on. The traffic is still encrypted — just to
    the wrong party.
  fix: |
    Leave validation on. If the problem is a certificate the platform does not trust, add that specific
    certificate to the trust store rather than accepting every one.
  detect:
    - assignTo: [ServerCertificateValidationCallback, ServerCertificateCustomValidationCallback]

