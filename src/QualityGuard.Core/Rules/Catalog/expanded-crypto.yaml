
- key: QG-CS-SEC-0095
  name: A retired cipher protects nothing
  languages: [cs]
  category: SEC
  severity: critical
  effort: 30min
  cwe: [327, 326]
  owasp: [A2]
  tags: [cryptography, sast]
  message: This cipher is no longer considered safe and its output can be recovered.
  summary: An encryption algorithm that is no longer considered safe is used.
  why: |
    DES has a key small enough to search exhaustively, and RC4 leaks the shape of the plaintext in its
    first bytes. Data encrypted with either is readable by anyone who captures it and is willing to spend
    a modest amount of computing time — including traffic captured today and attacked years from now.
  fix: |
    Use AES with a key of at least 128 bits, in an authenticated mode such as GCM so that tampering is
    detected as well as prevented.
  detect:
    - creation: [DESCryptoServiceProvider, RC2CryptoServiceProvider, TripleDESCryptoServiceProvider]
    - member: [DES.Create, RC2.Create, TripleDES.Create]

