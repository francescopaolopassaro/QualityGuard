- key: QG-SEC-SEC-0033
  name: A Django credential should not be committed
  languages: []
  category: SEC
  severity: blocker
  effort: 30min
  cwe: [798]
  owasp: [A7]
  tags: [secret]
  message: This has the shape of a Django credential written into the source.
  summary: A string matches the published shape of a Django credential.
  why: |
    Providers issue credentials with a fixed prefix and length, which is what makes them recognisable
    — and what lets an automated scanner find one minutes after a repository becomes reachable. Once
    committed the value is in every clone, and it stays in the history after it is deleted.
  fix: |
    Treat the credential as compromised: rotate it first, then remove it, and read the replacement at
    run time from the platform's secret store.
  detect:
    - line: "\b(django-insecure-[a-z0-9!@#$%^&*(\-_=+)]{50})"
    - line: "\bSECRET_KEY(?:_FALLBACKS)?\s*=\s*['\\"]([^'\\"\r\n]+)"
    - line: "\bSECRET_KEY(?:_FALLBACKS)?\s*=\s*(?:os\.getenv|env(?:\.str)?)\(\s*['\\"][^'\\"\r\n]+['\\"]\s*,\s*(?:default\s*=\s*)?['\\"]([^'\\"\r\n]+)"
    - line: "\bSECRET_KEY(?:_FALLBACKS)?[ \t]*=[ \t]*([^\r\n]+)"

