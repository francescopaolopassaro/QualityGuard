- key: QG-SEC-SEC-0031
  name: A an artifact repository credential should not be committed
  languages: []
  category: SEC
  severity: blocker
  effort: 30min
  cwe: [798]
  owasp: [A7]
  tags: [secret]
  message: This has the shape of a an artifact repository credential written into the source.
  summary: A string matches the published shape of a an artifact repository credential.
  why: |
    Providers issue credentials with a fixed prefix and length, which is what makes them recognisable
    — and what lets an automated scanner find one minutes after a repository becomes reachable. Once
    committed the value is in every clone, and it stays in the history after it is deleted.
  fix: |
    Treat the credential as compromised: rotate it first, then remove it, and read the replacement at
    run time from the platform's secret store.
  detect:
    - line: "\b(AKCp\d[A-Za-z0-9_-]{68})\b"
    - line: "\b(cmVmdGtuO[A-Za-z0-9_-]{55})\b"
    - line: "\b(eyJ2ZXIiOiIyIiwidHlwIjoiSldUIiwiYWxnIjoiUlMyNTYiLCJraWQiOiJ[A-Za-z0-9_-]{30,}+\.[A-Za-z0-9_-]{100,}+\.[A-Za-z0-9_-]{100,}+)\b"

