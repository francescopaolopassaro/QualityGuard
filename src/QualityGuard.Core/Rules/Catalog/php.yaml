# PHP rules (PP): web entry points, sessions and type juggling.

- key: QG-PP-SEC-0029
  name: Sessions should be regenerated at login
  languages: [php]
  category: SEC
  severity: critical
  effort: 20min
  cwe: [384]
  owasp: [A2]
  tags: [session]
  message: The session identifier does not change when the privilege level does.
  summary: Authentication succeeds without regenerating the session identifier.
  why: |
    An attacker who can set the visitor's session id before login — through a link or an injected cookie
    — keeps a valid session after the victim authenticates. The application cannot tell the two apart.
  fix: |
    Regenerate the identifier immediately after a successful login and after any privilege change, and
    discard the old session data.
  detect:
    - line: "\\$_SESSION\\s*\\[\\s*[\"'](user|auth|logged)"
      absent: [session_regenerate_id]

- key: QG-PP-SEC-0030
  name: Includes should not be built from request data
  languages: [php]
  category: SEC
  severity: blocker
  effort: 25min
  cwe: [98]
  owasp: [A3]
  tags: [file-inclusion]
  message: The included path comes from the request, which allows executing arbitrary files.
  summary: An include or require receives a value derived from user input.
  why: |
    The interpreter executes whatever file the path resolves to, so an attacker who controls part of it
    runs code that is already on the server — an upload, a log file, a session file — with the privileges
    of the application.
  fix: |
    Map a small set of accepted identifiers to fixed file names and include only those. Never concatenate
    a request value into the path.
  detect:
    - line: "(include|require)(_once)?\\s*[\\( ]\\s*[^;]*\\$_(GET|POST|REQUEST|COOKIE)"

- key: QG-PP-SML-0010
  name: Comparisons should be strict
  languages: [php]
  category: SML
  severity: major
  effort: 10min
  tags: [suspicious]
  message: Loose comparison converts the operands before comparing them.
  summary: The loose equality operator is used.
  why: |
    The conversion rules make surprising pairs equal — a numeric string and a number, an empty string
    and zero — which turns a comparison intended as an identity check into an accidental match. Hash
    comparisons written this way have been exploited in practice.
  fix: |
    Use the strict operators, and convert the operands explicitly when a cross-type comparison is really
    intended. Compare secrets with the constant-time helper.
  detect:
    - line: "[^=!<>]\\s(==|!=)\\s[^=]"


- key: QG-PP-SEC-0031
  name: Uploaded files should be validated before they are stored
  languages: [php]
  category: SEC
  severity: blocker
  effort: 30min
  cwe: [434]
  owasp: [A1]
  tags: [upload]
  message: This upload is stored without checking its type, size or destination name.
  summary: An uploaded file is moved into place using the name supplied by the client.
  why: |
    The client chooses the name and the extension, so a file ending in a scripting extension inside a
    served directory is executed by the web server on the next request. That is remote code execution
    through a form.
  fix: |
    Generate the stored name yourself, validate the content type by inspecting the file rather than
    trusting the header, cap the size, and keep the upload directory outside the document root.
  detect:
    - invocation: [move_uploaded_file]

- key: QG-PP-SEC-0032
  name: Output should be escaped for the context it lands in
  languages: [php]
  category: SEC
  severity: critical
  effort: 20min
  cwe: [79]
  owasp: [A3]
  tags: [xss]
  message: This value is echoed without escaping.
  summary: A request value is printed directly into the response.
  why: |
    Anything printed unescaped becomes part of the markup, so a value containing a tag runs as script in
    the visitor's browser with their session attached.
  fix: |
    Escape on output with the HTML escaper and the right flags and charset, or use a template engine that
    escapes by default. Escape for the exact context — attribute, URL, script — not just for HTML.
  detect:
    - line: "echo\\s+[^;]*\\$_(GET|POST|REQUEST|COOKIE)"
    - line: "print\\s+[^;]*\\$_(GET|POST|REQUEST|COOKIE)"

- key: QG-PP-SEC-0033
  name: Passwords should be hashed with the password API
  languages: [php]
  category: SEC
  severity: blocker
  effort: 25min
  cwe: [916]
  owasp: [A2]
  tags: [password, crypto]
  message: This hashes a password with a general-purpose digest.
  summary: A password is hashed with md5, sha1 or a raw hash call.
  why: |
    General-purpose digests are built for speed, which is what an attacker with a leaked table needs:
    commodity hardware tries billions of candidates per second, so common passwords fall in minutes.
  fix: |
    Use the password hashing API, which selects a strong algorithm, generates the salt and stores the
    parameters, and verify with its companion function.
  bad: |
    $hash = md5($password);
  good: |
    $hash = password_hash($password, PASSWORD_DEFAULT);
  detect:
    - invocation: [md5, sha1, crypt]
      requires: [password, passwd, pwd]

- key: QG-PP-BUG-0002
  name: Array access should check that the key exists
  languages: [php]
  category: BUG
  severity: major
  effort: 10min
  tags: [suspicious]
  message: Reading a missing key raises a warning and yields null.
  summary: A superglobal entry is read without checking that it is present.
  why: |
    Missing keys produce a warning and a null value that then flows into the rest of the handler, so the
    request continues with empty data instead of failing cleanly. Warnings printed into the response also
    leak paths.
  fix: |
    Check with isset or the null-coalescing operator and supply a default, or validate the whole request
    through a filter before using any field.
  detect:
    - line: "\\$_(GET|POST|REQUEST|COOKIE)\\s*\\[[^\\]]+\\]"
      absent: [isset, "??", filter_input, empty]

- key: QG-PP-SML-0011
  name: Errors should not be silenced with the suppression operator
  languages: [php]
  category: SML
  severity: major
  effort: 15min
  tags: [error-handling]
  message: The suppression operator hides the failure instead of handling it.
  summary: An expression is prefixed with the error suppression operator.
  why: |
    The warning disappears but the failure does not: the call still returns false or null and the code
    continues with it. Debugging then starts from a symptom several layers away from the cause.
  fix: |
    Check the return value and handle the failure, or convert warnings into exceptions with an error
    handler so they cannot be ignored.
  detect:
    - line: "=\\s*@[a-zA-Z_]"
    - line: "^\\s*@[a-zA-Z_]\\w*\\s*\\("

- key: QG-PP-SML-0012
  name: Types should be declared on parameters and return values
  languages: [php]
  category: SML
  scope: main
  severity: minor
  effort: 15min
  tags: [types]
  message: This function declares no types, so mistakes surface only at run time.
  summary: A function is declared without parameter or return types.
  why: |
    Without declarations the engine accepts anything and converts silently, so a wrong argument travels
    deep into the call chain before producing a confusing error. Static analysis and editors also lose
    most of their usefulness.
  fix: |
    Declare parameter and return types, and enable strict types at the top of the file so conversions are
    rejected rather than guessed.
  detect:
    - line: "function\\s+\\w+\\s*\\(\\s*\\$\\w+(\\s*,\\s*\\$\\w+)*\\s*\\)\\s*\\{"

# Platform configuration rules implemented in Rules/Languages/PhpPlatformRules.cs. They read the
# constants of the platform's own configuration file and only that file: the same names appear in
# tests and deployment scripts where they mean nothing, and a rule about a missing constant would
# otherwise fire on every PHP file there is.

- key: QG-PP-SEC-0061
  name: Editing code from the administration interface should be disabled
  languages: [php]
  category: SEC
  severity: critical
  effort: 10min
  cwe: [94]
  tags: [platform, permissions]
  summary: The built-in file editor is left enabled in the platform configuration.
  why: |
    The editor writes to the site's own PHP files, which turns a content permission into running code
    on the server: one administrator account, or one stolen session belonging to one, is enough. The
    change also leaves no trace in the deployment history, because it never went through it.
  fix: |
    Set DISALLOW_FILE_EDIT to true — or DISALLOW_FILE_MODS, which covers every kind of change — and
    deploy code the way the rest of it is deployed.

- key: QG-PP-SEC-0062
  name: Automatic updates should not be switched off
  languages: [php]
  asvs: [V6]
  category: SEC
  severity: major
  effort: 10min
  cwe: [1104]
  tags: [platform, maintenance]
  summary: The platform configuration disables the updates it installs on its own.
  why: |
    Security fixes for a platform this widely deployed are published together with a description of
    what they fix. An installation that does not take them is attackable from that day by anyone who
    reads the release notes, and nothing about the site shows that it is behind.
  fix: |
    Leave the automatic updates on, or commit to a process that applies them by hand within days —
    and check that the process actually runs.

- key: QG-PP-SEC-0063
  name: Outgoing requests should be restricted to the hosts that are needed
  languages: [php]
  category: SEC
  severity: minor
  effort: 15min
  cwe: [918]
  tags: [platform, network]
  summary: The platform is left free to call any address on the internet.
  why: |
    Every installed plugin inherits that freedom. One that is compromised, or simply careless, sends
    the site's data out with nothing to notice it, and can be used to reach hosts only this server
    can see — an internal service, a metadata endpoint.
  fix: |
    Set WP_HTTP_BLOCK_EXTERNAL to true and list the hosts that are genuinely needed in
    WP_ACCESSIBLE_HOSTS.

- key: QG-PP-SEC-0064
  name: Database repair should not be reachable without logging in
  languages: [php]
  category: SEC
  severity: critical
  effort: 10min
  cwe: [284]
  tags: [platform, permissions]
  summary: The unauthenticated database repair page is switched on.
  why: |
    The page repairs and optimises the database for anyone who knows its address — it asks for no
    login by design, because it is meant to work when the site cannot log anybody in. It is meant to
    be on for the minutes a repair takes, and it is almost always left on.
  fix: |
    Remove the constant once the repair is finished.

- key: QG-PP-SEC-0065
  name: Unfiltered HTML in content should be disallowed
  languages: [php]
  category: SEC
  severity: major
  effort: 10min
  cwe: [79]
  tags: [platform, xss]
  summary: Users who can publish content are allowed to publish unfiltered HTML.
  why: |
    Unfiltered HTML includes script tags, so a single editor account — or a stolen session belonging
    to one — runs code in the browser of every visitor and of every administrator who opens the page,
    with their session.
  fix: |
    Set DISALLOW_UNFILTERED_HTML to true and let the platform sanitise what is posted.

- key: QG-PP-BUG-0134
  name: A catch should not duplicate a type already caught
  languages: [php]
  category: BUG
  severity: major
  effort: 5min
  message: A second catch repeats a type the same try already handles.
  summary: An unreachable catch clause repeats an earlier one.
  why: |
    The first matching catch takes the exception; control never reaches its duplicate, and whoever
    reads it assumes a distinction that does not exist.
  fix: |
    Delete the duplicate, or catch a genuinely different type.

- key: QG-PP-SML-0301
  name: Generic exceptions should not be thrown
  languages: [php]
  category: SML
  severity: minor
  effort: 10min
  message: Exception, RuntimeException or ErrorException is thrown directly.
  summary: A bare exception type says nothing about what failed.
  why: |
    Callers cannot catch for a reason: handling a bare Exception means handling everything, so real
    failures and expected ones become indistinguishable at every boundary.
  fix: |
    Throw a named domain exception - ConfigurationMissing, PaymentRejected - so recovery can be
    specific.

- key: QG-PP-SML-0303
  name: Reflection should not increase accessibility
  languages: [php]
  category: SML
  severity: minor
  effort: 15min
  message: setAccessible(true) opens a member past its visibility.
  summary: Accessibility is forced open with reflection.
  why: |
    Whatever invariant private and protected guard can now be broken from outside, and the next
    refactor of the owning class cannot see this call exists.
  fix: |
    Use the public API, or widen the member deliberately where it is declared.

- key: QG-PP-SML-0304
  name: for loop stop conditions should be invariant
  languages: [php]
  category: SML
  severity: minor
  effort: 10min
  message: No line of the loop ever changes what the stop condition reads.
  summary: A stop condition reads values nothing updates.
  why: |
    With the watched value fixed, the loop either runs once against a condition that was already
    false or spins forever - both are decided before the first iteration ends.
  fix: |
    Advance inside the body the value the condition compares, or compare against something the loop
    actually moves.
