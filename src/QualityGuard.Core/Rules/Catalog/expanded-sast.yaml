- key: QG-CS-SEC-0099
  name: An XML parser that resolves entities will fetch what the document asks for
  languages: [cs]
  category: SEC
  severity: blocker
  effort: 30min
  cwe: [611, 827]
  owasp: [A4]
  tags: [xml, sast]
  message: This parser resolves external entities, so a document can make it read local files or call out.
  summary: An XML parser is built without disabling external entities.
  why: |
    An XML document can declare an entity whose content is a file path or a URL. A parser that resolves
    entities will read that file, or make that request, and place the result in the parsed document — so
    a caller who supplies the XML can read files from the server or reach services that are only visible
    from inside the network.
  fix: |
    Turn off document type declarations on the parser. If the format genuinely needs them, disable
    external general and parameter entities specifically.
  detect:
    - assignTo: [DtdProcessing]
      contains: [DtdProcessing.Parse]

