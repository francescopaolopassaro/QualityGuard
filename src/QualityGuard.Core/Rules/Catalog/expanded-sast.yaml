
- key: QG-JV-SEC-0071
  name: Deserializing what a caller sent hands them the process
  languages: [java]
  asvs: [V6]
  category: SEC
  severity: blocker
  effort: 30min
  cwe: [502]
  owasp: [A8]
  tags: [deserialization, sast]
  message: This value comes from outside and is deserialized, which can construct objects the caller chooses.
  summary: Data that arrived from outside is deserialized.
  why: |
    These deserializers rebuild whatever type the payload names, running constructors and setters as they
    go. A caller who controls the payload therefore controls which types are built and what runs during
    construction — enough, with a common library present, to run a command of their choosing.
  fix: |
    Accept a known shape instead: parse into a type you name yourself, or use a format that carries data
    and not types. If the format must stay, restrict the types allowed to an explicit list.
  detect:
    - creation: [ObjectInputStream]
    - invocation: [readObject]
      argTainted: true

