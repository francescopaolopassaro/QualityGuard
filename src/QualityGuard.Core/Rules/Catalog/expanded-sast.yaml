- key: QG-JV-SEC-0072
  name: A file everyone can write is a file anyone can replace
  languages: [java]
  asvs: [V4]
  category: SEC
  severity: critical
  effort: 15min
  cwe: [732, 276]
  owasp: [A5]
  tags: [permissions, sast]
  message: These permissions let every account on the machine change the file.
  summary: A file or directory is created with permissions open to all users.
  why: |
    Any process on the host, whatever account it runs under, can rewrite the contents. If the file is a
    script, a configuration or a library that this program later reads, the program will do whatever the
    last writer decided.
  fix: |
    Grant the permissions the owner needs and stop there. Where a group genuinely shares the file, name
    that group rather than opening it to everybody.
  detect:
    - invocation: [setWritable, setReadable, setExecutable]
      argLiterals: [true]

