# Descriptions for the rules in Rules/Languages/CSharpGapRules.cs. Each of these was found by running
# the reference analyzer and this engine over the same production projects and reading what only the
# other one reported.

- key: QG-CS-CNV-0010
  name: A type name should be written in Pascal case
  languages: [cs]
  category: CNV
  severity: minor
  effort: 15min
  tags: [naming, readability]
  summary: A type name runs capitals together, starts lower-case, or separates words with underscores.
  why: |
    A reader picks a type name apart by its capitals. Three of them in a row read as one word, so
    'DocDocumentiWKFModelliFasi' takes a second look to parse where the acronym ends.
  fix: |
    Capitalise the first letter of each word and write an acronym longer than two letters as a word.

- key: QG-CS-SML-0478
  name: The empty identifier should be named
  languages: [cs]
  category: SML
  severity: minor
  effort: 5min
  tags: [readability]
  summary: The all-zero identifier is written out instead of using the constant for it.
  why: |
    A reader has to count the zeroes to be sure it is the empty one, and a typo in them produces a
    different identifier that still looks right.
  fix: |
    Use Guid.Empty.

- key: QG-CS-SML-0479
  name: A type nobody can inherit should say so
  languages: [cs]
  category: SML
  severity: minor
  effort: 5min
  tags: [design, performance]
  summary: A private nested class is not sealed.
  why: |
    Nothing outside the enclosing type can derive from it, so the door is open on paper only. Sealing
    says what is true, and lets the runtime call its methods without looking them up first.
  fix: |
    Mark the class sealed.

- key: QG-CS-SML-0480
  name: A type that adds nothing should not exist
  languages: [cs]
  category: SML
  severity: major
  effort: 15min
  tags: [design]
  summary: A type derives from another and declares no member of its own.
  why: |
    Every use of it could name the base instead, so it adds a name to learn and nothing else. Usually
    it was created for a difference that was never written, and the reader is left looking for one.
  fix: |
    Give the type the behaviour it was created for, or remove it and use the base.

- key: QG-CS-SML-0481
  name: An indexed collection should be read by index
  languages: [cs]
  category: SML
  severity: minor
  effort: 5min
  tags: [linq, performance, readability]
  summary: First or Last is called on a collection that can be indexed.
  why: |
    The operator sets up an enumerator to reach something the collection can hand over directly, and
    it says less: brackets state that the position is known.
  fix: |
    Use the indexer.

- key: QG-CS-SML-0482
  name: Overloads of one method should be written together
  languages: [cs]
  category: SML
  severity: minor
  effort: 10min
  tags: [readability]
  summary: Two overloads of the same method are separated by other members.
  why: |
    A reader comparing them scrolls between the two, and a change made to one is easy to miss on the
    other — which is how two overloads of the same operation come to behave differently.
  fix: |
    Move the overloads next to each other.

- key: QG-CS-SML-0483
  name: The host should be run asynchronously
  languages: [cs]
  category: SML
  severity: major
  effort: 5min
  tags: [async]
  summary: The application host is started with a blocking call.
  why: |
    The thread that started the application waits there until shutdown instead of being handed back.
    Every host offers the awaitable form, and the entry point can await it.
  fix: |
    Await the asynchronous form.

- key: QG-CS-SML-0484
  name: An action should state the type it returns
  languages: [cs]
  category: SML
  severity: minor
  effort: 15min
  tags: [aspnet, api]
  summary: A routed action returns an untyped result while answering with a value.
  why: |
    Nothing states what the endpoint produces — not the compiler, not the generated documentation,
    not the client. A change to the shape of the answer then breaks callers silently.
  fix: |
    Return ActionResult<T> with the type the action really produces.

- key: QG-CS-SML-0485
  name: A field used in one method should be a local
  languages: [cs]
  category: SML
  severity: minor
  effort: 10min
  tags: [design]
  summary: A private field is written before it is read, inside a single method.
  why: |
    Nothing outside that method needs the value, and because it is a field the next call starts with
    whatever the previous one left. A local says the lifetime out loud and cannot be seen elsewhere.
  fix: |
    Declare it where it is used.

- key: QG-CS-SML-0486
  name: A private member nothing reads should be removed
  languages: [cs]
  category: SML
  severity: major
  effort: 10min
  tags: [dead-code]
  summary: A private field or property is never read anywhere in its type.
  why: |
    It is private, so nothing outside can read it either. The declaration and whatever fills it are
    work the program does for nothing, and a reader has to decide what it was for.
  fix: |
    Remove it, or use it.

- key: QG-CS-SML-0487
  name: A loop that only selects should say so
  languages: [cs]
  category: SML
  severity: minor
  effort: 10min
  tags: [linq, readability]
  summary: The whole body of a foreach is a single condition.
  why: |
    What the loop says is "the ones that match", written as a walk plus a test. A filter says it in a
    line, and the reader does not have to hold the iteration in mind to see the intent.
  fix: |
    Use a filter, and iterate the result if something still has to happen for each element.

- key: QG-CS-SML-0488
  name: A disposable type should follow the pattern
  languages: [cs]
  category: SML
  severity: major
  effort: 20min
  tags: [design, resources]
  summary: A type that can be derived from releases resources without offering the pattern.
  why: |
    A derived type has nowhere to release what it adds: the base decides when disposal happens and
    gives it no way to take part. The resource then survives the object that owned it.
  fix: |
    Seal the type if nothing should derive from it, or add the protected virtual Dispose(bool) that
    a derived type can override.

- key: QG-CS-SML-0489
  name: A branch that returns what it was given changes nothing
  languages: [cs]
  category: SML
  severity: minor
  effort: 10min
  tags: [suspicious]
  summary: Every arm of a multi-way expression produces the value it is switching on.
  why: |
    The whole expression is the value it started with, so the branches decide nothing. Usually one of
    them was meant to produce something else and the change was never finished.
  fix: |
    Give the branch the value it was written for, or remove the switch.

- key: QG-CS-SML-0490
  name: A branch that answers with its own label decides nothing
  languages: [cs]
  category: SML
  severity: minor
  effort: 10min
  tags: [suspicious]
  summary: Every arm of a switch produces the value it just matched.
  why: |
    The expression hands back what it was given, so the branches decide nothing. Usually one arm was
    meant to produce something else and the change was never finished.
  fix: |
    Give the arm the value it was written for, or remove the switch.

- key: QG-CS-SML-0491
  name: A static field should be initialised where it is declared
  languages: [cs]
  category: SML
  severity: minor
  effort: 10min
  tags: [performance]
  summary: A static constructor does nothing but assign fields.
  why: |
    Its presence makes the type initialise lazily, and the runtime then checks before every access
    whether that has happened. Fields given their values inline avoid the check entirely.
  fix: |
    Move each assignment to the declaration and delete the static constructor.

- key: QG-CS-SML-0492
  name: A failure should be logged once
  languages: [cs]
  category: SML
  severity: major
  effort: 10min
  tags: [logging, exceptions]
  summary: A catch block writes the exception to the log and throws it on.
  why: |
    Whoever catches it next logs it again, so one incident appears several times with a different
    stack each time, and the reader of the log cannot tell how many things went wrong.
  fix: |
    Log where the failure is handled, and let it travel untouched everywhere else.

- key: QG-CS-SML-0493
  name: A property nothing writes always answers with nothing
  languages: [cs]
  category: SML
  severity: major
  effort: 10min
  tags: [suspicious]
  summary: An auto-property of a private type is never assigned anywhere.
  why: |
    Every read gets the default value, whatever the code around it assumes. The type is private, so
    nothing outside can fill it either: the property was meant to be set and never is.
  fix: |
    Assign it where the value is known, or remove it.
