# Kotlin rules (KT): JVM, Android and coroutine specifics.

- key: QG-KT-SEC-0033
  name: Coroutines should not swallow cancellation
  languages: [kt]
  category: SEC
  severity: major
  effort: 20min
  tags: [coroutines, exception]
  message: Catching every throwable also catches cancellation and keeps the work running.
  summary: A coroutine body catches Throwable or Exception without rethrowing cancellation.
  why: |
    Cancellation is delivered as an exception; swallowing it means the coroutine keeps running after its
    scope was closed, holding resources and writing to objects that are already gone. Shutdown then hangs
    or corrupts state.
  fix: |
    Catch the specific exceptions you can handle, and rethrow CancellationException — or use the helper
    that runs the block only when the coroutine is still active.
  detect:
    - line: "catch\\s*\\(\\s*\\w+\\s*:\\s*(Throwable|Exception)\\s*\\)"
      requires: [suspend, launch, async]
      absent: [CancellationException]

- key: QG-KT-SEC-0034
  name: Android components should not export themselves implicitly
  languages: [kt, java]
  category: SEC
  severity: critical
  effort: 20min
  cwe: [926]
  tags: [android]
  message: An exported component with an intent filter is reachable by any application.
  summary: A component is declared exported without a permission.
  why: |
    Any application on the device can start it and pass whatever extras it likes, so the component
    becomes an entry point that never authenticates its caller. Deep links reach it from the browser too.
  fix: |
    Keep the component unexported unless it must be reachable, and protect the ones that must be with a
    signature-level permission plus validation of every extra.
  detect:
    - line: "android:exported\\s*=\\s*\"true\""
      absent: [android:permission]

- key: QG-KT-BUG-0009
  name: Nullable receivers should not be forced in chains
  languages: [kt]
  category: BUG
  severity: major
  effort: 15min
  tags: [null-safety]
  message: This chain throws as soon as one link is null.
  summary: A call chain mixes safe calls with a not-null assertion.
  why: |
    The safe call says the value may be absent and the assertion says it is not; only one of them can be
    right. The result is a crash that the type system was already warning about.
  fix: |
    Keep the chain safe end to end and provide a default with the elvis operator, or check once at the
    top and work with a non-nullable local afterwards.
  detect:
    - line: "\\?\\.[\\w.]*!!"

- key: QG-KT-SML-0020
  name: Data classes should not expose mutable collections
  languages: [kt]
  category: SML
  severity: major
  effort: 15min
  tags: [immutability]
  message: A mutable collection in a data class breaks the equality and hashing it promises.
  summary: A data class property holds a mutable list, set or map.
  why: |
    The generated equals and hashCode read the collection, so mutating it after the object was put in a
    set or used as a map key makes the entry unreachable. Copies also share the same instance.
  fix: |
    Declare the property with the read-only interface and pass a defensive copy in the constructor, or
    use an immutable collection type.
  detect:
    - line: "data\\s+class\\s+\\w+[^)]*:\\s*Mutable(List|Set|Map)<"


- key: QG-KT-SEC-0035
  name: Intents should name the component they target
  languages: [kt, java]
  category: SEC
  severity: major
  effort: 20min
  cwe: [927]
  tags: [android, intent]
  message: An implicit intent can be intercepted by any application that declares a matching filter.
  summary: An intent is sent without naming the component or the package that should receive it.
  why: |
    The system picks the receiver from whatever is installed, so a malicious application can register the
    same action and take the payload, or answer with data the caller then trusts. The user may not even
    see a chooser.
  fix: |
    Set the component or at least the package on the intent, and require a signature-level permission
    when the destination is another application you own.
  detect:
    - invocation: [startActivity, startService, bindService]
      argCount: 1
      absent: [setPackage, setComponent, setClass]

- key: QG-KT-SEC-0036
  name: Cryptographic keys should not live in the source
  languages: [kt]
  category: SEC
  severity: blocker
  effort: 30min
  cwe: [321]
  owasp: [A7]
  tags: [crypto, secret, android]
  message: This key material is embedded in the application.
  summary: A key or initialisation vector is built from a literal value in the code.
  why: |
    Anything shipped in the binary can be extracted with a decompiler in minutes, so the encryption it
    protects is decorative. On mobile the binary is in the hands of every user by definition.
  fix: |
    Generate the key on the device and store it in the platform key store, or derive it from a secret the
    user supplies. Never ship a fixed key with the application.
  detect:
    - creation: [SecretKeySpec, IvParameterSpec]
      literalValue: true

- key: QG-KT-BUG-0010
  name: Data classes should not hold arrays
  languages: [kt]
  category: BUG
  severity: major
  effort: 15min
  tags: [equality]
  message: Arrays compare by reference, so two instances with equal content are not equal.
  summary: A data class declares a property of array type.
  why: |
    The generated equality and hash functions call the array implementations, which compare identity.
    Two instances built from the same bytes therefore differ, and lookups in sets and maps miss.
  fix: |
    Use a list, or override the equality and hash functions with the content-based helpers for that
    property.
  status: superseded
  superseded_by: QG-KT-BUG-0027

- key: QG-KT-BUG-0011
  name: Ranges should not be built backwards
  languages: [kt]
  category: BUG
  severity: major
  effort: 10min
  tags: [suspicious, loop]
  message: A range whose start is above its end is empty, so the loop body never runs.
  summary: A descending range is written with the ascending operator.
  why: |
    The range operator only counts upwards; when the first bound is larger the range is empty and the
    loop silently does nothing. There is no error, so the missing work shows up as absent output.
  fix: |
    Use downTo for descending iteration, and add step where the increment is not one.
  bad: |
    for (i in items.size..0) { }
  good: |
    for (i in items.size downTo 0) { }
  detect:
    - line: "for\\s*\\(\\s*\\w+\\s+in\\s+[\\w.()]+\\s*\\.\\.\\s*0\\s*\\)"

- key: QG-KT-SML-0021
  name: Values coming from Java should be null-checked
  languages: [kt]
  category: SML
  severity: major
  effort: 15min
  tags: [null-safety, interop]
  message: Values returned by Java are not covered by the null checks of the compiler.
  summary: A value returned by Java interop is dereferenced without a null check.
  why: |
    A platform type is accepted as both nullable and non-nullable, so the compiler stays silent and the
    failure happens at run time inside generated code. The stack trace points at Kotlin while the cause
    is on the Java side.
  fix: |
    Assign the value to an explicitly nullable local and handle the absent case, or annotate the Java API
    so the compiler can enforce the contract.
  detect:
    - line: "System\\.getenv\\s*\\([^)]*\\)\\s*\\."
    - line: "getProperty\\s*\\([^)]*\\)\\s*\\."

- key: QG-KT-SML-0022
  name: Scope functions should not be nested
  languages: [kt]
  category: SML
  severity: minor
  effort: 15min
  tags: [readability]
  message: Nested scope functions make it unclear which object a bare property belongs to.
  summary: Two or more scope functions are nested in the same expression.
  why: |
    Each level rebinds the implicit receiver, so a reader has to track which object an unqualified
    property refers to. Mistakes here compile perfectly and modify the wrong object.
  fix: |
    Name the intermediate values with regular locals, or split the chain into statements so every
    receiver is explicit.
  detect:
    - line: "\\.(let|apply|run|also|with)\\s*\\{[^}]*\\.(let|apply|run|also|with)\\s*\\{"

- key: QG-KT-PRF-0001
  name: Long collection chains should use a sequence
  languages: [kt]
  category: PRF
  severity: minor
  effort: 10min
  tags: [performance, collections]
  message: Each operator in this chain allocates a new list.
  summary: Three or more collection operators are chained on a list.
  why: |
    Collection operators are eager: every step materialises an intermediate list, so a chain over a large
    collection allocates several copies of it. A sequence streams the elements through the whole chain
    once.
  fix: |
    Call asSequence before the chain and toList after it, so only the final result is materialised.
  detect:
    - line: "\\.(map|filter|flatMap)\\s*\\{[^}]*\\}\\s*\\.(map|filter|flatMap)\\s*\\{[^}]*\\}\\s*\\.(map|filter|flatMap|sorted|toList)"

- key: QG-KT-SML-0002
  name: Avoid the not-null assertion operator
  status: superseded
  superseded_by: QG-KT-SML-0113
  languages: [kt]
  category: SML
  severity: minor
  effort: 10min
  tags: [nullability]
  message: Avoid using the not-null assertion operator.
  summary: A nullable value is asserted to be present.
  why: |
    The operator is worth avoiding, but the reference catalogues do not carry the rule — it belongs to
    a separate linter whose results they merely read. Ours produced six hundred findings on one
    project, most of them in tests where the value is known to be there because the test put it there.
  fix: |
    Where the check matters, a linter configured by the team is the right place for it.

# Mobile platform rules implemented in Rules/Languages/KotlinAndroidRules.cs. They read the call on
# the tree: the argument that is missing, the one that is null, the builder step that was never
# added. The two about the release build read the Gradle script, and only where the module declares
# an application identifier — a library has no release package to harden.

- key: QG-KT-SEC-0041
  name: A broadcast should name the permission its receivers need
  languages: [kt]
  category: SEC
  severity: critical
  effort: 15min
  cwe: [927]
  tags: [android, permissions]
  summary: An intent is broadcast without naming a permission, or is sent as a sticky broadcast.
  why: |
    Every application on the device receives it and reads what the intent carries. A sticky broadcast
    is worse: the system keeps it and hands it to whoever asks afterwards, and no permission can be
    attached to it at all.
  fix: |
    Pass the permission a receiver must hold, or address the intent to a specific component — and
    replace sticky broadcasts, which the platform itself has retired.

- key: QG-KT-SEC-0042
  name: A registered receiver should require a permission
  languages: [kt]
  category: SEC
  severity: critical
  effort: 15min
  cwe: [925]
  tags: [android, permissions]
  summary: A receiver is registered at run time without the permission a sender must hold.
  why: |
    Any application on the device can then trigger it, with data of its choosing. The handler treats
    that input as its own, and the action it performs — refreshing a token, writing a file, starting
    work — happens whenever somebody else decides.
  fix: |
    Register the receiver with the permission senders must hold.

- key: QG-KT-SEC-0044
  name: A stored key should require the user to authenticate
  languages: [kt]
  category: SEC
  severity: critical
  effort: 20min
  cwe: [522]
  tags: [android, crypto]
  summary: A key is generated in the hardware store without requiring user authentication.
  why: |
    The key material is protected, but the operation it performs is not: anything running on the
    device can use the key, including while the screen is locked. The protection people believe they
    have from the secure hardware is only about theft of the key, not about its use.
  fix: |
    Require user authentication on the key when it protects something personal, and choose a validity
    window that matches the operation.

- key: QG-KT-SEC-0045
  name: Biometric authentication should be bound to a key operation
  languages: [kt]
  category: SEC
  severity: critical
  effort: 30min
  cwe: [287]
  tags: [android, authentication]
  summary: A biometric prompt is shown without a cryptographic object.
  why: |
    The result is then a boolean the application decides to trust. Nothing the user's fingerprint
    unlocks is actually needed afterwards, so somebody who can change what runs on the device only
    has to make that boolean true — and the fingerprint check becomes decoration.
  fix: |
    Pass the crypto object whose key the authentication unlocks, and use that key for the operation
    the prompt was protecting.

- key: QG-KT-SEC-0046
  name: A database encryption key should not be written in the source
  languages: [kt]
  category: SEC
  severity: critical
  effort: 15min
  cwe: [798]
  tags: [android, secrets, crypto]
  summary: The key that encrypts a local database is a literal in the code.
  why: |
    It ships inside the package, so anyone who takes the application apart — a short job with public
    tools — reads it, and then reads every copy of that database on every device. The encryption
    still passes review because the database is, technically, encrypted.
  fix: |
    Derive the key from something the user supplies, or keep it in the platform's key store and fetch
    it at run time.

- key: QG-KT-SEC-0048
  name: A web view should not be allowed to reach local files
  languages: [kt]
  category: SEC
  severity: critical
  effort: 15min
  cwe: [200]
  tags: [android, webview]
  summary: A web view is configured to allow file, content or universal access.
  why: |
    A page loaded into it — including one reached through a redirect nobody planned — can then read
    the application's own private storage and send it out. The setting is usually added to make one
    local page work and never taken back out.
  fix: |
    Leave file access off and serve what the page needs from the application itself.

- key: QG-KT-SEC-0049
  name: An authenticated cipher should not reuse its initialisation vector
  languages: [kt]
  category: SEC
  severity: critical
  effort: 20min
  cwe: [323]
  tags: [crypto]
  summary: A message is encrypted in an authenticated mode with a vector written in the source.
  why: |
    Every message then uses the same vector. In this mode that is not a weakness of degree: two
    messages under one key and one vector let anyone who sees both recover the plaintext and forge
    new messages that verify correctly.
  fix: |
    Generate a random vector for every message and transmit it alongside the ciphertext — it is not
    secret, it only has to be unique.

- key: QG-KT-SEC-0050
  name: Dependency verification should not be switched off
  languages: [kt]
  category: SEC
  severity: major
  effort: 15min
  cwe: [494]
  tags: [build, supply-chain]
  summary: The build disables the check that dependencies match what the project recorded.
  why: |
    Without it a compromised mirror, or a package republished under the same version, is compiled
    into the artefact and nothing anywhere notices. The build succeeds, the tests pass, and the
    change arrives in production signed by your own pipeline.
  fix: |
    Keep verification on and update the recorded metadata when a dependency legitimately changes.

- key: QG-KT-SEC-0051
  name: A release build should be obfuscated
  languages: [kt]
  category: SEC
  severity: major
  effort: 30min
  cwe: [656]
  tags: [android, build]
  summary: The release build of an application does not enable minification.
  why: |
    The shipped package then keeps every class, method and field name as written, together with the
    code that is never called. Working out how the application authenticates, or where it keeps its
    keys, becomes a matter of reading it.
  fix: |
    Enable minification on the release build type and keep what must survive in the rules file.

- key: QG-KT-SEC-0052
  name: Application code should not be exposed to a web view's page
  languages: [kt]
  category: SEC
  severity: critical
  effort: 30min
  cwe: [749]
  tags: [android, webview]
  summary: An object of the application is registered as a bridge for the loaded page.
  why: |
    The page decides when to call it. One redirect, or one injected script in a page you do not
    control, and code inside the application runs on request — with the application's own
    permissions.
  fix: |
    Expose nothing, or expose a single narrow method and check the page's origin before answering.

- key: QG-KT-SEC-0054
  name: A release build should not be debuggable
  languages: [kt]
  category: SEC
  severity: critical
  effort: 15min
  cwe: [489]
  tags: [android, build]
  summary: The release build type is marked debuggable.
  why: |
    Anyone holding the device can attach to the running process, read its memory and step through it.
    The platform also drops obfuscation for such a build, so everything the code was hiding is
    readable at the same time.
  fix: |
    Remove the setting from the release build type; the debug type already has it.

- key: QG-KT-SEC-0022
  name: WebView file access should be disabled
  status: superseded
  superseded_by: QG-KT-SEC-0048
  languages: [kt]
  category: SEC
  severity: major
  effort: 20min
  tags: [android, webview]
  message: Keep file access off unless the web view genuinely needs it.
  summary: A web view is configured to allow file access.
  why: |
    It read the file as a stream of tokens and reported anything called allowFileAccess with the word
    true within four tokens of it, which reports the check that turns the setting off as readily as
    the assignment that turns it on.
  fix: |
    QG-KT-SEC-0048 reads the call and the assignment on the tree, and covers the content and
    universal access settings as well.
