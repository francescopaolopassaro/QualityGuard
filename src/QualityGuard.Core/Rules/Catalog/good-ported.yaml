- key: QG-JS-SML-0432
  name: Test and suite titles should not be left empty
  languages: [js, ts]
  category: SML
  severity: minor
  effort: 2min
  tags: [empty, ported]
  message: This construct is empty, so it does nothing.
  summary: A construct is declared with no content.
  why: |
    An empty body reads as if the case is handled while nothing happens, which is exactly how ignored
    errors and unimplemented branches survive review. It is also indistinguishable from an accidental
    deletion.
  fix: |
    Implement the behaviour, or remove the construct. When doing nothing is deliberate, say so in a
    comment so the next reader does not treat it as a gap.
  status: planned

- key: QG-JS-BUG-0194
  name: Tests should assert something
  languages: [js, ts]
  category: BUG
  severity: major
  effort: 1min
  tags: [tests, ported]
  message: This test cannot fail, so it verifies nothing.
  summary: A test does not assert, is disabled, or cannot fail.
  why: |
    A test that cannot fail reports success forever while covering nothing, and the suite keeps its green
    status. That is worse than having no test at all, because it removes the incentive to write one.
  fix: |
    Assert the behaviour the test exists for, re-enable it, and make sure it fails when the behaviour is
    broken before trusting it again.
  detect:
    - invocation: [AwaitExpression, ChainExpression, ExpressionStatement, MemberExpression, debug, eslint, estree, logRoles]

