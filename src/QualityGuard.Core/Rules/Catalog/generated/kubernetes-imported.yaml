- key: QG-K8-SEC-0040
  name: Containers should not share the host operating system namespaces
  languages: [k8]
  category: SEC
  severity: major
  effort: 60min
  status: planned
  generated: true
  tags: [docker, cwe, former-hotspot]
  summary: A name does not follow the convention the rest of the code uses.
  why: |
    Conventions let a reader infer what something is from its shape alone. A deviation costs a
    lookup every time, and makes searches and automated refactoring less reliable.
  fix: |
    Rename it to match the convention used around it.

- key: QG-K8-SEC-0041
  name: Service account permissions should be restricted
  languages: [k8]
  category: SEC
  severity: major
  effort: 1h
  status: planned
  generated: true
  tags: []
  summary: Something is reachable by callers who should not reach it.
  why: |
    Access granted this broadly is never noticed afterwards: nothing fails, and the surface stays
    open for as long as the resource exists.
  fix: |
    Grant the access to the identities that need it and to nothing else.

- key: QG-K8-SEC-0042
  name: Kubernetes roles should not allow command execution in pods
  languages: [k8]
  category: SEC
  severity: minor
  cwe: [78]
  effort: 5min
  status: planned
  generated: true
  tags: [former-hotspot]
  summary: Input decides part of something the program then executes.
  why: |
    Whatever the caller sends becomes part of the instruction rather than part of the data. The code
    reads naturally, because the value sits exactly where it belongs in the sentence.
  fix: |
    Keep the instruction fixed and pass the values separately, so no input can change its shape.

