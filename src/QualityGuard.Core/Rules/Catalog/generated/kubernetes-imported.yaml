- key: QG-K8-SML-0071
  name: Specific version tag for image should be used
  languages: [k8]
  category: SML
  severity: major
  effort: 5min
  status: planned
  generated: true
  tags: []
  summary: An API is used where a better one exists.
  why: |
    The older form usually costs something the newer one does not, and it is on its way out: a
    conversion, an allocation, a case it handles wrongly.
  fix: |
    Use the current API, and keep the old one only behind a documented compatibility layer.

- key: QG-K8-SML-0072
  name: Ensure whitespace in-between braces in template directives
  languages: [k8]
  category: SML
  severity: major
  effort: 1min
  status: planned
  generated: true
  tags: []
  summary: Shared state is reached without the coordination that makes it safe.
  why: |
    It works every time it is tested and fails under load, on a machine with more cores, once. That
    is the hardest kind of defect to reproduce and the easiest to write.
  fix: |
    Guard the shared state, or give each caller its own copy.

