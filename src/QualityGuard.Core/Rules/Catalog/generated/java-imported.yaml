# Catalogue entries written in one pass, one per defect this language still lacks a check for.
# Every entry is documentation and carries no detection, so none of them reports anything: a
# detection is written by hand, against the shape the defect actually has, and measured before
# the entry stops being planned.

- key: QG-JV-SEC-0092
  name: JavaBean properties should not be populated from untrusted input
  languages: [java]
  category: SEC
  severity: critical
  effort: 15min
  status: planned
  generated: true
  tags: [cwe, cert, former-hotspot]
  summary: The code does not behave the way it reads.
  why: |
    Written this way it works by accident or fails on ordinary input, and the mistake survives
    review because the intent reads correctly.
  fix: |
    Make the intended behaviour explicit, and cover the case that used to fail with a test.

- key: QG-JV-SEC-0093
  name: A new session should be created during user authentication
  languages: [java]
  category: SEC
  severity: critical
  effort: 5min
  status: planned
  generated: true
  tags: [cwe, spring]
  summary: Something is reachable by callers who should not reach it.
  why: |
    Access granted this broadly is never noticed afterwards: nothing fails, and the surface stays
    open for as long as the resource exists.
  fix: |
    Grant the access to the identities that need it and to nothing else.

