- key: QG-GO-BUG-0047
  name: Useless "if(true) {...}" and "if(false){...}" blocks should be removed
  languages: [go]
  category: BUG
  severity: major
  effort: 2min
  status: planned
  generated: true
  tags: [cwe]
  summary: Shared state is reached without the coordination that makes it safe.
  why: |
    It works every time it is tested and fails under load, on a machine with more cores, once. That
    is the hardest kind of defect to reproduce and the easiest to write.
  fix: |
    Guard the shared state, or give each caller its own copy.
