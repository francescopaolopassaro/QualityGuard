- key: QG-GO-SML-0083
  name: Control flow statements "if", "for" and "switch" should not be nested too deeply
  languages: [go]
  category: SML
  severity: critical
  effort: 10min
  status: planned
  generated: true
  tags: [brain-overload]
  summary: The control flow does not do what it reads as doing.
  why: |
    A branch that cannot be taken, a loop that cannot end, a condition that is always the same: the
    code states an intent the machine does not carry out, and review reads the intent.
  fix: |
    Make the flow say what it does, and remove what cannot happen.

