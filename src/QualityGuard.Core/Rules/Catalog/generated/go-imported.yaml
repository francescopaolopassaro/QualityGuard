# Catalogue entries written in one pass, one per defect this language still lacks a check for.
# Every entry is documentation and carries no detection, so none of them reports anything: a
# detection is written by hand, against the shape the defect actually has, and measured before
# the entry stops being planned.

- key: QG-GO-SML-0081
  name: "if ... else if" constructs should end with "else" clauses
  languages: [go]
  category: SML
  severity: critical
  effort: 5min
  status: planned
  generated: true
  tags: []
  summary: The code does not behave the way it reads.
  why: |
    Written this way it works by accident or fails on ordinary input, and the mistake survives
    review because the intent reads correctly.
  fix: |
    Make the intended behaviour explicit, and cover the case that used to fail with a test.

