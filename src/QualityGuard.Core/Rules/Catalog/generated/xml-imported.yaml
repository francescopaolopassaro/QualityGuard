- key: QG-XML-BUG-0048
  name: Dependencies should not have "system" scope
  languages: [xml]
  category: BUG
  severity: critical
  effort: 5min
  status: planned
  generated: true
  tags: [maven, lock-in]
  summary: Shared state is reached without the coordination that makes it safe.
  why: |
    It works every time it is tested and fails under load, on a machine with more cores, once. That
    is the hardest kind of defect to reproduce and the easiest to write.
  fix: |
    Guard the shared state, or give each caller its own copy.

- key: QG-XML-BUG-0049
  name: Hibernate should not update database schemas
  languages: [xml]
  category: BUG
  severity: critical
  effort: 5min
  status: planned
  generated: true
  tags: [hibernate, sql]
  summary: Input decides part of something the program then executes.
  why: |
    Whatever the caller sends becomes part of the instruction rather than part of the data. The code
    reads naturally, because the value sits exactly where it belongs in the sentence.
  fix: |
    Keep the instruction fixed and pass the values separately, so no input can change its shape.

- key: QG-XML-BUG-0050
  name: "SingleConnectionFactory" instances should be set to "reconnectOnException"
  languages: [xml]
  category: BUG
  severity: major
  effort: 2min
  status: planned
  generated: true
  tags: [spring]
  summary: Something the runtime cannot reclaim on its own is not released.
  why: |
    Handles, sockets and connections are finite. The failure appears far from here, under load, as
    an exhaustion nobody can attribute to a single line.
  fix: |
    Release it on every path, including the exceptional one.

