- key: QG-KT-SEC-0040
  name: Debugging features should not be left on
  languages: [kt]
  category: SEC
  severity: critical
  effort: 15min
  tags: [sec, generated]
  generated: false
  status: ready
  message: This construct weakens the security of the application.
  summary: A debugging switch is turned on in code that ships.
  why: |
    The pattern either trusts data the program does not control, or relies on a mechanism that no longer
    offers the protection it appears to offer. Both keep working normally, which is why they survive
    until someone looks for them.
  fix: |
    Validate the incoming value against an allowed set, pass it as data rather than as code or command,
    and replace weakened mechanisms with the current recommended one.

- key: QG-KT-SML-0037
  name: Native features should be preferred to Guava
  languages: [kt]
  category: SML
  severity: minor
  effort: 15min
  tags: [guava]
  message: A Guava utility is imported where the standard library suffices.
  summary: Guava replaces standard-library features.
  why: |
    Lists, Sets, Maps, Charsets and friends predate features the JDK and Kotlin ship today. Each
    import also keeps a whole library on the classpath for utilities the platform provides.
  fix: |
    Use mutableListOf()/mutableSetOf()/mutableMapOf(), kotlin.text Charsets, String? extensions and
    require()/check() in place of the Guava helpers.
