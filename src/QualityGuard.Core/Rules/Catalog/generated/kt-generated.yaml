- key: QG-KT-SML-0077
  name: Null checks should be handled explicitly when absent
  languages: [kt]
  category: SML
  severity: minor
  effort: 15min
  tags: [nullability, generated]
  generated: true
  status: planned
  message: An absent value is not handled on this path.
  summary: A value that can be absent is used without checking, or a check is written that cannot work.
  why: |
    The failure surfaces as a null dereference at run time, in a place that often has nothing to do with
    where the value was produced. Checks that cannot succeed are worse, because they read as protection.
  fix: |
    Check the value where it enters the program, model absence in the type where the language allows it,
    and provide the default or the error at that point instead of deeper down.

