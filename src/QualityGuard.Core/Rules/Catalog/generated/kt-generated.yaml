# Generated catalog entries for kt. Texts come from the family templates in
# tools/generate_rules.py and are refined by hand as each family is reviewed.

- key: QG-KT-SML-0023
  name: Kotlin parser failure should be simplified
  languages: [kt]
  category: SML
  severity: minor
  effort: 15min
  tags: [sml, generated]
  generated: true
  status: planned
  message: This code is harder to read or change than the behaviour requires.
  summary: The code works but is harder to read or change than the behaviour requires.
  why: |
    The intent is buried, duplicated, or spread across places that must stay in sync, so every future
    change costs more than it should and carries a risk that has nothing to do with the change itself.
  fix: |
    Remove what is not used, name what is unclear, and keep one piece of behaviour in one place so the
    next change touches a single spot.

- key: QG-KT-SML-0029
  name: IP addresses should not be written into the source
  languages: [kt]
  category: SML
  severity: minor
  effort: 15min
  tags: [hardcoded_value, generated]
  generated: false
  status: ready
  message: This value is fixed in the source and cannot be changed without a rebuild.
  summary: An address is fixed in a string literal.
  why: |
    The value is right for exactly one environment. Every other environment needs a code change, so the
    same build cannot be promoted from test to production, and a value that has to be corrected under
    pressure gets corrected in the wrong place.
  fix: |
    Move the value to configuration, read it at start-up, and fail with a clear message when it is
    missing so a misconfigured deployment stops before it does anything.

- key: QG-KT-SML-0030
  name: Copyright and license headers should be resolved rather than left in the code
  languages: [kt]
  category: SML
  severity: minor
  effort: 15min
  tags: [marker, generated]
  generated: true
  status: planned
  message: This marker records work that was left open.
  summary: A marker in the source records work or a decision that was left open.
  why: |
    Markers are written for a future reader who never comes back to them. Nobody can tell whether the
    note is still relevant, who owns it, or whether the missing work has since become a defect.
  fix: |
    Do the work, or move it to the issue tracker and reference the ticket in the marker so the deadline
    lives somewhere that gets reviewed.

- key: QG-KT-SML-0031
  name: A multi-way branch should not grow past what a reader can hold
  languages: [kt]
  category: SML
  severity: minor
  effort: 15min
  tags: [threshold, generated]
  generated: false
  status: ready
  message: This construct is larger or more complex than the limit allows.
  summary: A when expression has more clauses than anyone reads at once.
  why: |
    Past a certain size, understanding one line means reconstructing everything around it, and testing
    the interesting case means going through the whole entry point. Growth is gradual, so the limit is
    the only thing that keeps the cost visible.
  fix: |
    Split along the responsibilities the code has accumulated: extract the sections that already have a
    name, and keep the original as the sequence of those steps.

- key: QG-KT-SML-0032
  name: Nested constructs should not be nested inside another one
  languages: [kt]
  category: SML
  severity: minor
  effort: 15min
  tags: [nesting, generated]
  generated: true
  status: planned
  message: This construct is nested inside another of the same kind.
  summary: A construct is nested inside another of the same kind.
  why: |
    The number of paths a reader has to consider becomes the product of the two, and the inner construct
    is easy to miss when scanning the outer one. Changes then land in the wrong level.
  fix: |
    Extract the inner construct into a function named after the decision it makes, and call it from the
    outer one.

- key: QG-KT-SML-0033
  name: Code annotated as deprecated should not be used
  languages: [kt]
  category: SML
  severity: minor
  effort: 10min
  tags: [kotlin]
  message: A @Deprecated declaration is called from this file.
  summary: A deprecated API is still referenced.
  why: |
    Deprecation is a scheduled removal: the replacement exists today, and the next version bump
    takes the old path out from under every remaining caller.
  fix: |
    Migrate to what the annotation names, or document why this site still needs it and add a
    suppression with a deadline.
- key: QG-KT-SML-0034
  name: A comparison should be written with the operator that means it
  languages: [kt]
  category: SML
  severity: minor
