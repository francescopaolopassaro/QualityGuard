  status: planned
  message: This construct weakens the security of the application.
  summary: A construct that attackers routinely target is used without the guard it needs.
  why: |
    The pattern either trusts data the program does not control, or relies on a mechanism that no longer
    offers the protection it appears to offer. Both keep working normally, which is why they survive
    until someone looks for them.
  fix: |
    Validate the incoming value against an allowed set, pass it as data rather than as code or command,
    and replace weakened mechanisms with the current recommended one.

- key: QG-KT-SML-0057
  name: Unit should be replaced by the recommended alternative
  languages: [kt]
  category: SML
  severity: minor
  effort: 15min
  tags: [prefer_api, generated]
  generated: true
  status: ready
  message: The platform offers a clearer or safer construct for this.
  summary: A construct is used where the platform offers one that is clearer or safer.
  why: |
    The alternative exists because it removes a class of mistake — a conversion, an allocation, an edge
    case — that the current form leaves to the caller. Using the older form means every reader has to
    check that the edge case was handled.
  fix: |
    Switch to the recommended construct; the behaviour is the same in the normal case and defined in the
    cases the old form got wrong.
  detect:
    - creation: [Unit]

- key: QG-KT-SML-0058
  name: A return should be lifted out of branches that all return
  languages: [kt]
  category: SML
  severity: minor
  effort: 5min
  tags: [kotlin]
  message: Both branches of an if end in return; the return can sit in front of it.
  summary: Branches duplicate a return statement.
  why: |
    When every branch returns, the if only chooses what comes back - so the return belongs before
    the branch, not inside each arm. The duplicated keyword hides the shape of the decision behind
    boilerplate.
  fix: |
    Lift the return: write return if (condition) a else b, or return when (x) { ... }.
- key: QG-KT-SML-0059
  name: Chained if statements over types should be a when
  languages: [kt]
  category: SML
  severity: minor
  effort: 10min
  tags: [kotlin]
  message: An else-if chain dispatches on types where a when expression fits.
  summary: Type dispatch is written as chained ifs.
  why: |
    A chain of if (x is A) ... else if (x is B) ... is a multi-way branch written vertically: each
    new case nests deeper, and the reader has to collect the arms back together to see the whole
    dispatch. That is exactly the shape when was designed for.
  fix: |
    Rewrite the chain as when (value) { is Foo -> ..., is Bar -> ..., else -> ... }, one case per
    line at the same level.
- key: QG-KT-SML-0060
  name: A getter or setter pattern should be a property
  languages: [kt]
  category: SML
  severity: minor
  effort: 5min
  tags: [kotlin]
  message: Java-style get/set methods wrap a property the language could declare.
  summary: A property is accessed through getX/setX methods.
  why: |
    Kotlin properties carry custom accessors natively. Writing getIndex()/setIndex(v) keeps the Java
    ceremony, forces parentheses on callers, and hides the field's role until the methods are
    opened.
  fix: |
    Declare `var index: Int` with custom get() and set(value) beside it; callers then write the name
    without parens.
- key: QG-KT-SML-0061
  name: A delegating class should use the by clause
  languages: [kt]
  category: SML
  severity: minor
  effort: 30min
  message: Every member forwards verbatim to one field.
  summary: Delegation is spelled as one wrapper per method.
  why: |
    Each wrapper is plumbing a reader has to step over, and a new interface method silently misses
    its forwarder until something breaks.
  fix: |
    Bind the implementation with `class X by field` - one line replaces them all.
- key: QG-KT-SML-0062
  name: The singleton pattern should use an object declaration
  languages: [kt]
  category: SML
  severity: minor
  effort: 10min
  tags: [kotlin]
  message: A private constructor plus a self-created INSTANCE field reimplements object.
  summary: The singleton pattern is hand-written.
  why: |
    Private constructor + static instance is how Java builds a singleton, complete with the laziness
    and thread-safety questions the writer had to answer by hand. Kotlin's object declaration gives
    both from the language.
  fix: |
    Replace the class with an `object Singleton` declaration and delete the plumbing.
- key: QG-KT-SML-0063
  name: A single-function instance should use SAM conversion
  languages: [kt]
  category: SML
  severity: minor
  effort: 5min
  tags: [kotlin]
  message: An anonymous object overrides exactly one function where a lambda converts.
  summary: An object expression wraps a single override.
  why: |
    object : Runnable { override fun run() { ... } } says how the value is wired before saying what
    it does. For functional interfaces Kotlin converts a lambda automatically, and the boilerplate
    disappears.
  fix: |
    Pass a lambda instead: Runnable { doIt() }, Comparator { a, b -> ... } and so on.
- key: QG-KT-SML-0064
  name: An interface with one function should be a functional interface
  languages: [kt]
  category: SML
  severity: minor
  effort: 5min
  tags: [kotlin]
  message: An interface with exactly one abstract member is not declared fun.
  summary: A single-method interface misses SAM conversion.
  why: |
    Without fun interface, passing the interface as a value requires spelling out an object with the
    method inside. With it, callers pass a lambda and the call site shows behaviour instead of
    wiring.
  fix: |
    Mark the interface `fun interface`; implementations stay unchanged.
- key: QG-KT-SML-0066
  name: Structural equality should be tested with == or !=
  languages: [kt]
  category: SML
  severity: minor
  effort: 2min
  tags: [kotlin]
  message: This call to equals() spells out what == already means.
  summary: A structural comparison is written as an equals() call.
  why: |
    In Kotlin == is structural equality: it calls equals() and tolerates null on either side.
    Calling equals() by hand is Java habit carried over, and it loses the null tolerance -
    a.equals(b) throws when a is null while a == b answers false.
  fix: |
    Replace a.equals(b) with a == b and !a.equals(b) with a != b.
- key: QG-KT-SML-0067
  name: A collection should be immutable if its contents never change
  languages: [kt]
  category: SML
  severity: minor
  effort: 10min
  message: A collection is declared mutable but nothing mutates it here.
  summary: Mutable types promise change that never happens.
  why: |
    Readers of a MutableList assume they must defend against concurrent change; an immutable type
    removes that doubt at the signature.
  fix: |
    Declare listOf/setOf/mapOf with val when the contents are fixed.
- key: QG-KT-SML-0068
  name: An abstract class without state should be an interface
  languages: [kt]
  category: SML
  severity: minor
  effort: 30min
  tags: [kotlin]
  message: An abstract class holds neither fields nor constructors.
  summary: A stateless abstract class plays the role of an interface.
  why: |
    Behaviour-only inheritance through a class spends the implementer's single base-class slot on
    nothing. An interface offers the same contract while leaving the base free.
  fix: |
    Convert the abstract class to an interface and update implementers.
- key: QG-KT-SML-0069
  name: A filter chain should be simplified
  languages: [kt]
  category: SML
  severity: minor
  effort: 5min
  message: filter { } feeds count, isEmpty, any or none.
  summary: filter materialises elements just to answer a question about them.
  why: |
    filter builds the matching list before the terminal counts it: one pass becomes two, with an
    intermediate allocation in between.
  fix: |
    count { predicate }, none { predicate } or any { predicate } walk once and name the question.
- key: QG-KT-SML-0070
  name: A find result compared to null should be any, none or contains
  languages: [kt]
  category: SML
  severity: minor
  effort: 5min
  tags: [kotlin]
  message: The result of find()/firstOrNull() is compared to null where a predicate would say it.
  summary: An existence test goes through find and a null comparison.
  why: |
    find { } != null asks whether any element matches. The standard library has words for that
    question, and they skip the null detour that readers have to unwind before understanding the
    intent.
  fix: |
    Write list.any { predicate } for != null, list.none { predicate } for == null, and
    contains(value) for a plain value lookup.
- key: QG-KT-SML-0071
  name: Emptiness should be asked with isEmpty or isNotEmpty
  languages: [kt]
  category: SML
  severity: minor
  effort: 2min
  tags: [kotlin]
  message: A size is read and compared to zero where isEmpty() would answer directly.
  summary: Emptiness is tested through size or count().
  why: |
    Reading a size to compare it to zero counts what isEmpty() answers without counting. The
    comparison also reads slower: every reader translates size == 0 back into 'is it empty' before
    moving on.
  fix: |
    Replace size == 0 / count() == 0 with isEmpty(), and size != 0 with isNotEmpty().
- key: QG-KT-SML-0074
  name: Argument checks should use require, check or their NotNull helpers
  languages: [kt]
  category: SML
  severity: minor
  effort: 5min
  tags: [kotlin]
  message: Argument validation is an if that throws, or require(x != null).
  summary: Preconditions are written by hand.
  why: |
    require(), check() and their NotNull helpers exist precisely for these guards: they throw the
    same exceptions, produce better messages, and put the contract on the first line instead of
    after a throw block.
  fix: |
    if (x == null) throw IllegalArgumentException() becomes requireNotNull(x); if (x < 0) throw
    IllegalArgumentException(...) becomes require(x >= 0); require(x != null) becomes
    requireNotNull(x).
- key: QG-KT-SML-0075
  name: A lambda parameter should not be named it
  languages: [kt]
  category: SML
  severity: minor
  effort: 2min
  tags: [kotlin]
  message: A lambda declares its parameter as it, shadowing the implicit one.
  summary: An explicit lambda parameter is named it.
  why: |
    Every Kotlin lambda already has the implicit it. Declaring { it -> } creates a second binding
    with the same name, and a reader stops to work out which one is used and whether they differ.
    They never do.
  fix: |
    Drop the declaration and use the implicit it, or give the parameter a descriptive name when the
    lambda has more than one trivial use of it.
- key: QG-KT-BUG-0029
  name: Map values should be accessed safely
  languages: [kt]
  category: BUG
  severity: major
  effort: 10min
  tags: [kotlin]
  message: map[key]!! asserts presence the map never gave.
  summary: A map lookup is forced open with !!.
  why: |
    !! promises the key exists. The first absent key pays with NullPointerException at a line that
    looked safe, far from whatever was supposed to insert the entry.
  fix: |
    Use getValue(key) to name the failure, read[key] ?: default for a fallback, or getOrPut(key) {
    ... } to build the missing value once.
- key: QG-KT-SML-0076
  name: Variables assigned values should be simplified
  languages: [kt]
  category: SML
  severity: minor
  effort: 15min
  tags: [sml, generated]
  generated: true
  status: planned
  message: This code is harder to read or change than the behaviour requires.
  summary: The code works but is harder to read or change than the behaviour requires.
  why: |
    The intent is buried, duplicated, or spread across places that must stay in sync, so every future
    change costs more than it should and carries a risk that has nothing to do with the change itself.
  fix: |
    Remove what is not used, name what is unclear, and keep one piece of behaviour in one place so the
    next change touches a single spot.

- key: QG-KT-SML-0077
  name: Null checks should be useful
  languages: [kt]
  category: SML
  severity: minor
  effort: 5min
  tags: [kotlin]
  message: A non-null value is compared against null.
  summary: A null test runs on a non-null type.
  why: |
    The type system already promised the value cannot be null, so the comparison is decided before
    it executes - always false for == null, always true for != null. The dead branch suggests null
    is possible, sending readers hunting for a case that cannot happen.
  fix: |
    Delete the check, or widen the declaration to a nullable type when null really can arrive.
- key: QG-KT-SML-0078
  name: Tasks.register() should be replaced by the recommended alternative
  languages: [kt]
  category: SML
  scope: main
  severity: minor
  effort: 15min
  tags: [prefer_api, generated]
  generated: true
  status: ready
  message: The platform offers a clearer or safer construct for this.
  summary: A construct is used where the platform offers one that is clearer or safer.
  why: |
    The alternative exists because it removes a class of mistake — a conversion, an allocation, an edge
    case — that the current form leaves to the caller. Using the older form means every reader has to
    check that the edge case was handled.
  fix: |
    Switch to the recommended construct; the behaviour is the same in the normal case and defined in the
    cases the old form got wrong.
  detect:
    - member: [tasks.register]
    - invocation: [register]
      receiver: [tasks]
    - member: [tasks.create]
    - invocation: [create]
      receiver: [tasks]

- key: QG-KT-SML-0079
  name: Dependency versions should not be hard-coded
  languages: [kt]
  category: SML
  severity: minor
  effort: 5min
  tags: [gradle]
  message: group:artifact:version is written inline in a build script.
  summary: A version literal pins a dependency inline.
  why: |
    Inline versions mean one upgrade edits every module repeating the string, and drifts between
    modules go unnoticed until the build breaks.
  fix: |
    Move coordinates into a version catalog, gradle.properties key, or platform BOM and reference
    the alias here.
- key: QG-KT-SML-0080
  name: rootProject.name should always be present in Gradle settings
  languages: [kt]
  category: SML
  severity: minor
  effort: 2min
  message: settings.gradle sets no rootProject.name.
  summary: The project inherits the checkout directory's name.
  why: |
    That name changes with the folder someone clones into, and artifacts and references move with it
    - a rename nobody intended.
  fix: |
    Set rootProject.name = "..." explicitly in the settings file.
- key: QG-KT-SML-0081
  name: Tasks should define description and group
  languages: [kt]
  category: SML
  severity: minor
  effort: 2min
  message: A registered task declares neither description nor group.
  summary: A task is invisible in gradle tasks output.
  why: |
    Without metadata the task lands under 'other tasks' and readers cannot tell what running it will
    do.
  fix: |
    Two lines in the configuration set description and group.
- key: QG-KT-SML-0082
  name: Dependencies should be grouped by destination
  languages: [kt]
  category: SML
  severity: minor
  effort: 5min
  message: Configurations appear out of order in the dependencies block.
  summary: Dependency declarations are scattered across configurations.
  why: |
    The block reads as one wall instead of compile-time, runtime and test layers, so where a
    dependency reaches has to be checked line by line.
  fix: |
    Group declarations by configuration - implementation together, testImplementation together.
- key: QG-KT-SML-0083
  name: Gradle settings file should be simplified
  languages: [kt]
  category: SML
  severity: minor
  effort: 15min
  tags: [sml, generated]
  generated: true
  status: planned
  message: This code is harder to read or change than the behaviour requires.
  summary: The code works but is harder to read or change than the behaviour requires.
  why: |
    The intent is buried, duplicated, or spread across places that must stay in sync, so every future
    change costs more than it should and carries a risk that has nothing to do with the change itself.
  fix: |
    Remove what is not used, name what is unclear, and keep one piece of behaviour in one place so the
    next change touches a single spot.

- key: QG-KT-SML-0084
  name: Core plugin ids should use their shortcuts
  languages: [kt]
  category: SML
  severity: minor
  effort: 2min
  tags: [gradle]
  message: id("org.jetbrains.kotlin...") is used where the DSL has a shortcut.
  summary: A Kotlin plugin is applied by its long id.
  why: |
    The Kotlin Gradle DSL names its own plugins: id("org.jetbrains.kotlin.jvm") is the long spelling
    of kotlin("jvm"). The shortcut says which ecosystem is being configured.
  fix: |
    Replace id("org.jetbrains.kotlin.X") with the matching kotlin("...") form.
- key: QG-KT-BUG-0030
  name: An operation status should not be ignored
  languages: [kt]
  category: BUG
  severity: major
  effort: 10min
  tags: [kotlin]
  message: delete/mkdir/tryLock-style results are dropped.
  summary: A status-returning operation is called as a statement.
  why: |
    These operations report whether anything happened. Dropping the answer turns a failed delete
    into a file that reappears later and a failed mkdir into an exception pages away from its cause.
  fix: |
    Check the result and handle failure explicitly, or switch to the throwing variant when failure
    should stop the caller.
