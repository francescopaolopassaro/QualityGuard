- key: QG-KT-SML-0045
  name: A redundant constructor should be removed
  languages: [kt]
  category: SML
  severity: minor
  effort: 5min
  tags: [kotlin]
  message: A secondary constructor mirrors the primary and forwards everything.
  summary: A secondary constructor duplicates the primary signature.
  why: |
    Two constructors taking identical parameters offer two spellings of one creation. Readers and
    tools now track both, and they drift apart silently when the class changes.
  fix: |
    Delete the secondary constructor; the primary already accepts those arguments.
- key: QG-KT-BUG-0027
  name: A data class with array fields should override equals and hashCode
  languages: [kt]
  category: BUG
  severity: major
  effort: 20min
  tags: [kotlin]
  message: Generated equals compares array fields by reference.
  summary: A data class holds array fields without overriding equals/hashCode.
  why: |
    Data classes generate equals() member-by-member. Arrays compare by reference there, so two
    instances holding identical content are unequal - and vanish from sets and map lookups for no
    visible reason.
  fix: |
    Override equals() with contentEquals() and hashCode() with contentHashCode(), or store List
    instead of Array so the generated members are correct.
- key: QG-KT-SML-0046
  name: MutableStateFlow and MutableSharedFlow should stay encapsulated
  languages: [kt]
  category: SML
  severity: minor
  effort: 15min
  tags: [kotlin]
  message: A public property exposes a mutable flow.
  summary: A mutable flow is published outside its owner.
  why: |
    Anyone who can reach the flow can emit values into the state machine and race its owner. The
    updates still arrive - which is why the bug looks like flakiness rather than a break in.
  fix: |
    Keep the MutableStateFlow/MutableSharedFlow private and expose it as StateFlow/SharedFlow; only
    the owning class emits.
- key: QG-KT-SML-0048
  name: Suspending functions should be main-safe
  languages: [kt]
  category: SML
  severity: minor
  effort: 30min
  message: A suspend function calls blocking APIs directly.
  summary: Suspending code blocks its thread.
  why: |
    The suspend modifier promises cooperative waiting; a blocking call inside parks the thread -
    freezing the interface on Main or starving the pool elsewhere.
  fix: |
    Wrap the blocking work in withContext(Dispatchers.IO) or use the library's suspend API.
- key: QG-KT-SML-0049
  name: A function returning Flow or Channel should not be suspending
  languages: [kt]
  category: SML
  severity: minor
  effort: 30min
  tags: [kotlin]
  message: A suspend function returns a cold flow or channel.
  summary: Building a flow is made suspendable.
  why: |
    Creating a flow does no work - the work happens at collection. The suspend modifier makes call
    sites wait in turn for something that finishes immediately, serialising access for no benefit.
  fix: |
    Drop suspend and return the flow directly; move the suspending work inside flow { } so it runs
    per collector.
- key: QG-KT-SML-0050
  name: Dispatchers should be injectable
  languages: [kt]
  category: SML
  severity: minor
  effort: 15min
  message: A dispatcher constant is written into the call site.
  summary: A hard-coded dispatcher cannot be swapped in tests.
  why: |
    Tests must then run on the real dispatcher and wait for real queues, which makes timing flaky
    and slow.
  fix: |
    Take CoroutineDispatcher as a constructor parameter, or inject a scope that carries it.
- key: QG-KT-SML-0051
  name: Suspending functions should not be called on a different dispatcher
  languages: [kt]
  category: SML
  severity: minor
  effort: 15min
  message: withContext wraps a call to another suspend function.
  summary: One function dictates another's dispatcher.
  why: |
    Every caller pays for this dispatcher whether it fits their work or not, and reasoning about
    where code runs needs both files open.
  fix: |
    Keep withContext around plain blocking work; let suspend callees choose their own context.
- key: QG-KT-SML-0052
  name: An extension on CoroutineScope should not be suspending
  languages: [kt]
  category: SML
  severity: minor
  effort: 30min
  tags: [kotlin]
  message: An extension function on CoroutineScope is declared suspend.
  summary: A CoroutineScope extension is suspending.
  why: |
    Suspending inside a scope extension mixes two ideas: being inside a scope and waiting for a
    result. Callers inherit whatever dispatcher owns the receiver and structured concurrency stops
    being obvious.
  fix: |
    Take the scope as a plain parameter and launch explicitly, or drop suspend so callers decide how
    the work runs.
- key: QG-KT-SML-0053
  status: superseded
  superseded_by: QG-KT-SML-0019
  name: A ViewModel should start coroutines in its own scope
  languages: [kt]
  category: SML
  severity: minor
  effort: 15min
  tags: [coroutines, android]
  message: A coroutine started here outlives the screen that started it.
  summary: Work is launched on GlobalScope inside a ViewModel.
  why: |
    A coroutine on GlobalScope keeps running after the user leaves the screen: it holds resources,
    writes into state nobody observes any more, and its failure reaches nothing that could handle it.
  fix: |
    Launch in viewModelScope instead - the framework cancels it when the ViewModel clears. The shared
    detector for GlobalScope launches reports this line.
- key: QG-KT-BUG-0028
  name: The result of Flow operations should be collected
  languages: [kt]
  category: BUG
  severity: major
  effort: 10min
  tags: [kotlin]
  message: A flow pipeline ends without a collector.
  summary: No terminal collection follows the flow operators.
  why: |
    Flows do no work until something collects them. A pipeline that stops after map/onEach starts
    nothing: no values flow, no side effects run, and the code sits there pretending to be active.
  fix: |
    Collect the flow, launchIn(scope) it, or remove the dead pipeline.
