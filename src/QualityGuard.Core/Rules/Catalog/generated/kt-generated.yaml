- key: QG-KT-BUG-0022
  name: The result of intermediate Sequence operations should be used
  languages: [kt]
  category: BUG
  severity: major
  effort: 10min
  tags: [kotlin]
  message: A sequence pipeline is built and its result dropped.
  summary: Intermediate sequence operations run to nothing.
  why: |
    Sequences are lazy: a chain ending in map/filter has processed nothing and allocated nothing but
    the pipe itself. As a bare statement the line computes no value and reads as one that does.
  fix: |
    Assign the result, feed it to a terminal operation (toList, first, forEach...), or delete the
    line.
- key: QG-KT-SML-0035
  name: Two methods should not share the same implementation
  languages: [kt]
  category: SML
  severity: minor
  effort: 15min
  tags: [duplication, generated]
  generated: false
  status: ready
  message: This code or value is duplicated.
  summary: Two methods of the same type have identical bodies.
  why: |
    Copies drift apart the first time one of them is fixed, and nothing links them, so the bug is fixed
    in one place and stays in the other. Readers also cannot tell which copy is authoritative.
  fix: |
    Keep one definition and reference it from the other places, or extract the shared part into a named
    function or constant.

