- key: QG-KT-BUG-0020
  name: Inappropriate collection calls should not be made
  languages: [kt]
  category: BUG
  severity: major
  effort: 10min
  message: A mutator runs on a collection built immutable.
  summary: An immutable factory is asked to mutate.
  why: |
    listOf/setOf/mapOf build read-only collections: add(), put() and friends throw
    UnsupportedOperationException the first time the line executes.
  fix: |
    Build mutable when mutation is real - mutableListOf() - or derive new collections instead of
    mutating.
- key: QG-KT-BUG-0021
  name: PreparedStatement and ResultSet methods should get valid indices
  languages: [kt]
  category: BUG
  severity: major
  effort: 5min
  tags: [jdbc]
  message: Index 0 reaches a JDBC parameter accessor.
  summary: A JDBC parameter index starts at zero.
  why: |
    JDBC numbers parameters and columns from 1. Index 0 compiles and fails only when the statement
    runs, turning a typo into a runtime SQLException on the first real request.
  fix: |
    Use index 1 for the first placeholder/column.
