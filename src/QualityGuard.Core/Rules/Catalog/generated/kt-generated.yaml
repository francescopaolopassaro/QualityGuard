- key: QG-KT-SEC-0037
  name: The salt of a password hash has to be unpredictable
  languages: [kt]
  asvs: [V2]
  category: SEC
  severity: critical
  effort: 15min
  tags: [crypto, generated]
  generated: false
  status: ready
  message: This cryptographic choice no longer provides the protection it suggests.
  summary: A password hash is derived with a salt written into the source.
  why: |
    Broken primitives keep producing output that looks correct, so nothing fails while the protection is
    already gone. Data encrypted today is often kept for years, which means an algorithm that is merely
    weak now will be readable later.
  fix: |
    Use the algorithms the platform recommends today — authenticated encryption, a modern hash, a key
    size at or above the current guidance — and keep the choice in one place so it can be raised.

- key: QG-KT-BUG-0014
  name: Equality should test the type of what it was given
  languages: [kt]
  category: BUG
  severity: major
  effort: 15min
  tags: [tests, generated]
  generated: false
  status: ready
  message: This test cannot fail, so it verifies nothing.
  summary: An equality implementation never checks the type of its argument.
  why: |
    A test that cannot fail reports success forever while covering nothing, and the suite keeps its green
    status. That is worse than having no test at all, because it removes the incentive to write one.
  fix: |
    Assert the behaviour the test exists for, re-enable it, and make sure it fails when the behaviour is
    broken before trusting it again.

- key: QG-KT-BUG-0016
  name: The identity of an array is not the value of its contents
  languages: [kt]
  category: BUG
  severity: major
  effort: 15min
  tags: [avoid_api, generated]
  generated: false
  status: ready
  message: This API should be replaced by the current alternative.
  summary: hashCode or toString is called on an array.
  why: |
    The API stays available for compatibility, so nothing fails at build time, but it carries behaviour
    the platform now considers a defect — unchecked input, a weak guarantee, or a cost the replacement
    avoids. Its presence also spreads: new code copies what it finds nearby.
  fix: |
    Replace the call with the current API, and keep the old one only behind a compatibility layer that is
    documented and dated.

- key: QG-KT-BUG-0017
  name: ScheduledThreadPoolExecutor should be accessed in a thread-safe way
  languages: [kt]
  category: BUG
  scope: main
  severity: major
  effort: 15min
  tags: [concurrency, generated]
  generated: true
  status: ready
  message: Shared state is accessed without correct coordination.
  summary: Shared state is accessed with locking that is missing, too wide, or on the wrong object.
  why: |
    Concurrency defects depend on timing, so they pass every test and appear under load in production.
    Locking on a shared or public object also lets unrelated code block or deadlock this one.
  fix: |
    Lock a private object dedicated to the state it protects, keep the critical section short, and prefer
    the concurrent collections and higher-level primitives the platform provides.
  detect:
    - creation: [ScheduledThreadPoolExecutor]

- key: QG-KT-BUG-0019
  name: RunFinalizersOnExit should not be used
  languages: [kt]
  category: BUG
  scope: main
  severity: major
  effort: 15min
  tags: [avoid_api, generated]
