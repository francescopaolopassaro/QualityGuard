- key: QG-KT-BUG-0022
  name: Intermediate Sequence and Stream functions should be removed once nothing uses it
  languages: [kt]
  category: BUG
  severity: major
  effort: 15min
  tags: [dead_code, generated]
  generated: true
  status: planned
  message: Nothing references this; remove it.
  summary: Code that nothing references is kept in the file.
  why: |
    Unused code still has to be read, compiled and maintained, and it misleads: a reader assumes it runs.
    It is also where stale assumptions survive, so reviving it later reintroduces behaviour that no
    longer matches the rest of the program.
  fix: |
    Delete it. Version control keeps the history, so nothing is lost, and the file becomes an accurate
    description of what the program does.

- key: QG-KT-SML-0035
  name: Functions should not be duplicated
  languages: [kt]
  category: SML
  severity: minor
  effort: 15min
  tags: [duplication, generated]
  generated: true
  status: planned
  message: This code or value is duplicated.
  summary: The same code or value appears more than once.
  why: |
    Copies drift apart the first time one of them is fixed, and nothing links them, so the bug is fixed
    in one place and stays in the other. Readers also cannot tell which copy is authoritative.
  fix: |
    Keep one definition and reference it from the other places, or extract the shared part into a named
    function or constant.

