- key: QG-KT-BUG-0024
  name: Repeated patterns in regular expressions should not be left empty
  languages: [kt]
  category: BUG
  severity: major
  effort: 15min
  tags: [empty, generated]
  generated: true
  status: planned
  message: This construct is empty, so it does nothing.
  summary: A construct is declared with no content.
  why: |
    An empty body reads as if the case is handled while nothing happens, which is exactly how ignored
    errors and unimplemented branches survive review. It is also indistinguishable from an accidental
    deletion.
  fix: |
    Implement the behaviour, or remove the construct. When doing nothing is deliberate, say so in a
    comment so the next reader does not treat it as a gap.

- key: QG-KT-SML-0040
  name: Empty lines should not be tested with the MULTILINE flag
  languages: [kt]
  category: SML
  severity: minor
  effort: 10min
  tags: [kotlin]
  message: Anchors-only regex relies on MULTILINE to mean empty line.
  summary: Empty lines are matched through ^$ plus MULTILINE.
  why: |
    ^$ under MULTILINE matches between every pair of lines in the text, blank or not. The flag
    changes the meaning of the anchors everywhere, and the 'empty line' question gets answered
    several times per paragraph.
  fix: |
    Test the structure directly: split on newlines and check for empties, or match \n\n when two
    consecutive breaks are the real question.
- key: QG-KT-SML-0042
  name: Unicode-aware versions of character classes should be replaced by the recommended alternative
  languages: [kt]
  category: SML
  severity: minor
  effort: 15min
  tags: [prefer_api, generated]
  generated: true
  status: planned
  message: The platform offers a clearer or safer construct for this.
  summary: A construct is used where the platform offers one that is clearer or safer.
  why: |
    The alternative exists because it removes a class of mistake — a conversion, an allocation, an edge
    case — that the current form leaves to the caller. Using the older form means every reader has to
    check that the edge case was handled.
  fix: |
    Switch to the recommended construct; the behaviour is the same in the normal case and defined in the
    cases the old form got wrong.

