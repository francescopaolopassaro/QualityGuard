  why: |
    It has to be read, understood and kept compiling by everyone who passes through, and it gives
    nothing back. Worse, it suggests a purpose that no longer exists.
  fix: |
    Remove it: the history keeps it if it is ever needed again.

- key: QG-CSS-SML-0080
  name: CSS should not restrict page orientation using transform properties
  languages: [css]
  category: SML
  severity: minor
  effort: 30 min
  status: planned
  generated: true
  tags: [accessibility, wcag, css, responsive-design]
  summary: Something is reachable by callers who should not reach it.
  why: |
    Access granted this broadly is never noticed afterwards: nothing fails, and the surface stays
    open for as long as the resource exists.
  fix: |
    Grant the access to the identities that need it and to nothing else.

