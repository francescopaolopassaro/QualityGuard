# Catalogue entries written in one pass, one per defect this language still lacks a check for.
# Every entry is documentation and carries no detection, so none of them reports anything: a
# detection is written by hand, against the shape the defect actually has, and measured before
# the entry stops being planned.

- key: QG-SEC-SEC-0050
  name: Discord Webhook URLs should not be disclosed
  languages: [secrets]
  category: SEC
  severity: blocker
  effort: 30min
  status: planned
  generated: true
  tags: [cwe, secret]
  summary: A value that has to stay private is written where the code is kept.
  why: |
    Anyone with a copy of the repository has the value, and that includes every clone, every fork
    and every build artefact. Changing it means shipping, so in practice it is never changed.
  fix: |
    Read the value from configuration the deployment supplies, and rotate the one already committed.

