- key: QG-RB-SML-0014
  name: Secrets should not be written into IP addresses
  languages: [rb]
  category: SML
  severity: minor
  effort: 15min
  tags: [secret, generated]
  generated: true
  status: planned
  message: This value looks like a credential committed with the source.
  summary: A credential, key or token appears directly in the source instead of coming from a secret store.
  why: |
    Anything committed with the code is readable by everyone who can clone the repository, and it
    survives in the history even after being deleted. Scanners find these values within minutes of a
    repository becoming reachable, and rotating them means editing and redeploying every copy.
  fix: |
    Read the value at run time from the platform secret store or the environment, fail fast when it is
    missing, and treat the committed value as compromised: rotate it before removing it.

- key: QG-RB-SML-0015
  name: The Octal values API should not be used
  languages: [rb]
  category: SML
  severity: minor
  effort: 15min
  tags: [avoid_api, generated]
  generated: true
  status: planned
  message: This API should be replaced by the current alternative.
  summary: Code calls an API that is unsafe, obsolete or superseded by a better alternative.
  why: |
    The API stays available for compatibility, so nothing fails at build time, but it carries behaviour
    the platform now considers a defect — unchecked input, a weak guarantee, or a cost the replacement
    avoids. Its presence also spreads: new code copies what it finds nearby.
  fix: |
    Replace the call with the current API, and keep the old one only behind a compatibility layer that is
    documented and dated.

- key: QG-RB-SML-0016
  name: Uses of Lack of copyright and license headers should be reviewed
  languages: [rb]
  category: SML
  severity: minor
  effort: 15min
  tags: [marker, generated]
  generated: true
  status: planned
  message: This marker records work that was left open.
  summary: A marker in the source records work or a decision that was left open.
  why: |
    Markers are written for a future reader who never comes back to them. Nobody can tell whether the
    note is still relevant, who owns it, or whether the missing work has since become a defect.
  fix: |
    Do the work, or move it to the issue tracker and reference the ticket in the marker so the deadline
    lives somewhere that gets reviewed.

- key: QG-RB-SML-0017
  name: Case statements should stay within a size that can be reviewed
  languages: [rb]
  category: SML
  severity: minor
  effort: 15min
  tags: [threshold, generated]
  generated: true
  status: planned
  message: This construct is larger or more complex than the limit allows.
  summary: A construct exceeds the size or complexity a reader can follow at once.
  why: |
    Past a certain size, understanding one line means reconstructing everything around it, and testing
    the interesting case means going through the whole entry point. Growth is gradual, so the limit is
    the only thing that keeps the cost visible.
  fix: |
    Split along the responsibilities the code has accumulated: extract the sections that already have a
    name, and keep the original as the sequence of those steps.

- key: QG-RB-SML-0018
  name: Case statements should not be nested inside another one
  languages: [rb]
  category: SML
  severity: minor
  effort: 15min
  tags: [nesting, generated]
  generated: true
  status: planned
  message: This construct is nested inside another of the same kind.
  summary: A construct is nested inside another of the same kind.
  why: |
    The number of paths a reader has to consider becomes the product of the two, and the inner construct
    is easy to miss when scanning the outer one. Changes then land in the wrong level.
  fix: |
    Extract the inner construct into a function named after the decision it makes, and call it from the
    outer one.

