- key: QG-JV-BUG-0090
  name: JEE applications should use current cryptographic parameters
  languages: [java]
  category: BUG
  severity: major
  effort: 15min
  tags: [crypto, generated]
  generated: true
  status: ready
  message: This cryptographic choice no longer provides the protection it suggests.
  summary: A cryptographic primitive, mode or key size that is no longer considered safe is used.
  why: |
    Broken primitives keep producing output that looks correct, so nothing fails while the protection is
    already gone. Data encrypted today is often kept for years, which means an algorithm that is merely
    weak now will be readable later.
  fix: |
    Use the algorithms the platform recommends today — authenticated encryption, a modern hash, a key
    size at or above the current guidance — and keep the choice in one place so it can be raised.
  detect:
    - invocation: [getClassLoader]

