- key: QG-JV-SEC-0052
  name: Encryption algorithms should use current cryptographic parameters
  languages: [java]
  category: SEC
  severity: critical
  effort: 15min
  tags: [crypto, generated]
  generated: true
  status: planned
  message: This cryptographic choice no longer provides the protection it suggests.
  summary: A cryptographic primitive, mode or key size that is no longer considered safe is used.
  why: |
    Broken primitives keep producing output that looks correct, so nothing fails while the protection is
    already gone. Data encrypted today is often kept for years, which means an algorithm that is merely
    weak now will be readable later.
  fix: |
    Use the algorithms the platform recommends today — authenticated encryption, a modern hash, a key
    size at or above the current guidance — and keep the choice in one place so it can be raised.

- key: QG-JV-SML-0294
  name: Lambdas should stay within a size that can be reviewed
  languages: [java]
  category: SML
  severity: minor
  effort: 15min
  tags: [threshold, generated]
  generated: true
  status: planned
  message: This construct is larger or more complex than the limit allows.
  summary: A construct exceeds the size or complexity a reader can follow at once.
  why: |
    Past a certain size, understanding one line means reconstructing everything around it, and testing
    the interesting case means going through the whole entry point. Growth is gradual, so the limit is
    the only thing that keeps the cost visible.
  fix: |
    Split along the responsibilities the code has accumulated: extract the sections that already have a
    name, and keep the original as the sequence of those steps.

