  why: |
    The alternative exists because it removes a class of mistake — a conversion, an allocation, an edge
    case — that the current form leaves to the caller. Using the older form means every reader has to
    check that the edge case was handled.
  fix: |
    Switch to the recommended construct; the behaviour is the same in the normal case and defined in the
    cases the old form got wrong.

- key: QG-JV-SML-0148
  name: Exception handling around Main should be explicit
  languages: [java]
  category: SML
  severity: minor
  effort: 15min
  tags: [exception, generated]
  generated: true
  status: planned
  message: This handling hides the failure instead of dealing with it.
  summary: An exception is thrown, caught or propagated in a way that hides the failure.
  why: |
    Handlers that are too broad, empty, or that replace the original error remove the information needed
    to diagnose the incident, and let the program continue in a state nobody designed for. The symptom
    then appears far from the cause.
  fix: |
    Catch the specific failures this code can recover from, keep the original exception as the cause when
    wrapping, and let everything else reach the boundary handler.

- key: QG-JV-BUG-0036
  name: Tests around Equals(Object obj) should verify something
  languages: [java]
  category: BUG
  severity: major
  effort: 15min
  tags: [tests, generated]
  generated: true
  status: planned
  message: This test cannot fail, so it verifies nothing.
  summary: A test does not assert, is disabled, or cannot fail.
  why: |
    A test that cannot fail reports success forever while covering nothing, and the suite keeps its green
    status. That is worse than having no test at all, because it removes the incentive to write one.
  fix: |
    Assert the behaviour the test exists for, re-enable it, and make sure it fails when the behaviour is
    broken before trusting it again.

- key: QG-JV-BUG-0037
