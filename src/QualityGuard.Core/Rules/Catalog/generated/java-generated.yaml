- key: QG-JV-SML-0272
  name: Absent values around Equals method parameters should be handled explicitly
  languages: [java]
  category: SML
  severity: minor
  effort: 15min
  tags: [nullability, generated]
  generated: true
  status: planned
  message: An absent value is not handled on this path.
  summary: A value that can be absent is used without checking, or a check is written that cannot work.
  why: |
    The failure surfaces as a null dereference at run time, in a place that often has nothing to do with
    where the value was produced. Checks that cannot succeed are worse, because they read as protection.
  fix: |
    Check the value where it enters the program, model absence in the type where the language allows it,
    and provide the default or the error at that point instead of deeper down.

- key: QG-JV-SML-0273
  name: Composed @RequestMapping variants should be replaced by the recommended alternative
  languages: [java]
  category: SML
  severity: minor
  effort: 15min
  tags: [prefer_api, generated]
  generated: true
  status: planned
  message: The platform offers a clearer or safer construct for this.
  summary: A construct is used where the platform offers one that is clearer or safer.
  why: |
    The alternative exists because it removes a class of mistake — a conversion, an allocation, an edge
    case — that the current form leaves to the caller. Using the older form means every reader has to
    check that the edge case was handled.
  fix: |
    Switch to the recommended construct; the behaviour is the same in the normal case and defined in the
    cases the old form got wrong.

- key: QG-JV-SEC-0046
  name: Debugging features should not weaken the security of the application
  languages: [java]
  category: SEC
  severity: critical
  effort: 15min
  tags: [sec, generated]
  generated: true
  status: planned
  message: This construct weakens the security of the application.
  summary: A construct that attackers routinely target is used without the guard it needs.
  why: |
    The pattern either trusts data the program does not control, or relies on a mechanism that no longer
    offers the protection it appears to offer. Both keep working normally, which is why they survive
    until someone looks for them.
  fix: |
    Validate the incoming value against an allowed set, pass it as data rather than as code or command,
    and replace weakened mechanisms with the current recommended one.

