    The pattern either trusts data the program does not control, or relies on a mechanism that no longer
    offers the protection it appears to offer. Both keep working normally, which is why they survive
    until someone looks for them.
  fix: |
    Validate the incoming value against an allowed set, pass it as data rather than as code or command,
    and replace weakened mechanisms with the current recommended one.
- key: QG-JV-SEC-0061
  name: Biometric authentication should use current cryptographic parameters
  languages: [java]
  category: SEC
  severity: critical
  effort: 15min
  tags: [crypto, generated]
  generated: true
  status: planned
  message: This cryptographic choice no longer provides the protection it suggests.
  summary: A cryptographic primitive, mode or key size that is no longer considered safe is used.
  why: |
    Broken primitives keep producing output that looks correct, so nothing fails while the protection is
    already gone. Data encrypted today is often kept for years, which means an algorithm that is merely
    weak now will be readable later.
  fix: |
    Use the algorithms the platform recommends today — authenticated encryption, a modern hash, a key
    size at or above the current guidance — and keep the choice in one place so it can be raised.

- key: QG-JV-SEC-0062
  name: Mobile database encryption keys should not be committed with the source
  languages: [java]
  category: SEC
  severity: critical
  effort: 15min
  tags: [secret, generated]
  generated: true
  status: planned
  message: This value looks like a credential committed with the source.
  summary: A credential, key or token appears directly in the source instead of coming from a secret store.
  why: |
    Anything committed with the code is readable by everyone who can clone the repository, and it
    survives in the history even after being deleted. Scanners find these values within minutes of a
    repository becoming reachable, and rotating them means editing and redeploying every copy.
  fix: |
    Read the value at run time from the platform secret store or the environment, fail fast when it is
    missing, and treat the committed value as compromised: rotate it before removing it.

- key: QG-JV-SML-0350
  name: Regular expressions should not be left empty
  languages: [java]
  category: SML
  severity: minor
  effort: 15min
  tags: [empty, generated]
  generated: true
  status: planned
  message: This construct is empty, so it does nothing.
  summary: A construct is declared with no content.
  why: |
    An empty body reads as if the case is handled while nothing happens, which is exactly how ignored
    errors and unimplemented branches survive review. It is also indistinguishable from an accidental
    deletion.
  fix: |
    Implement the behaviour, or remove the construct. When doing nothing is deliberate, say so in a
    comment so the next reader does not treat it as a gap.

