- key: QG-JV-BUG-0145
  name: Nullable injected fields and parameters should be handled explicitly when absent
  languages: [java]
  category: BUG
  severity: major
  effort: 15min
  tags: [nullability, generated]
  generated: true
  status: planned
  message: An absent value is not handled on this path.
  summary: A value that can be absent is used without checking, or a check is written that cannot work.
  why: |
    The failure surfaces as a null dereference at run time, in a place that often has nothing to do with
    where the value was produced. Checks that cannot succeed are worse, because they read as protection.
  fix: |
    Check the value where it enters the program, model absence in the type where the language allows it,
    and provide the default or the error at that point instead of deeper down.

- key: QG-JV-BUG-0146
  name: Markers left in the code should be resolved rather than left in the code
  languages: [java]
  category: BUG
  severity: major
  effort: 15min
  tags: [marker, generated]
  generated: true
  status: planned
  message: This marker records work that was left open.
  summary: A marker in the source records work or a decision that was left open.
  why: |
    Markers are written for a future reader who never comes back to them. Nobody can tell whether the
    note is still relevant, who owns it, or whether the missing work has since become a defect.
  fix: |
    Do the work, or move it to the issue tracker and reference the ticket in the marker so the deadline
    lives somewhere that gets reviewed.

