- key: QG-JV-SML-0432
  name: Secrets should not be written into Predefined mathematical constants
  languages: [java]
  category: SML
  severity: minor
  effort: 15min
  tags: [secret, generated]
  generated: true
  status: planned
  message: This value looks like a credential committed with the source.
  summary: A credential, key or token appears directly in the source instead of coming from a secret store.
  why: |
    Anything committed with the code is readable by everyone who can clone the repository, and it
    survives in the history even after being deleted. Scanners find these values within minutes of a
    repository becoming reachable, and rotating them means editing and redeploying every copy.
  fix: |
    Read the value at run time from the platform secret store or the environment, fail fast when it is
    missing, and treat the committed value as compromised: rotate it before removing it.

- key: QG-JV-SEC-0068
  name: Apache XML RPC extensions should not weaken the security of the application
  languages: [java]
  category: SEC
  severity: critical
  effort: 15min
  tags: [sec, generated]
  generated: true
  status: planned
  message: This construct weakens the security of the application.
  summary: A construct that attackers routinely target is used without the guard it needs.
  why: |
    The pattern either trusts data the program does not control, or relies on a mechanism that no longer
    offers the protection it appears to offer. Both keep working normally, which is why they survive
    until someone looks for them.
  fix: |
    Validate the incoming value against an allowed set, pass it as data rather than as code or command,
    and replace weakened mechanisms with the current recommended one.

