- key: QG-JV-SML-0099
  name: Methods should stay within a size that can be reviewed
  languages: [java]
  category: SML
  severity: minor
  effort: 15min
  tags: [threshold, generated]
  generated: true
  status: planned
  message: This construct is larger or more complex than the limit allows.
  summary: A construct exceeds the size or complexity a reader can follow at once.
  why: |
    Past a certain size, understanding one line means reconstructing everything around it, and testing
    the interesting case means going through the whole entry point. Growth is gradual, so the limit is
    the only thing that keeps the cost visible.
  fix: |
    Split along the responsibilities the code has accumulated: extract the sections that already have a
    name, and keep the original as the sequence of those steps.

