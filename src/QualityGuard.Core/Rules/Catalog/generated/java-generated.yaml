- key: QG-JV-SML-0053
  name: Collection.isEmpty() should be replaced by the recommended alternative
  languages: [java]
  category: SML
  severity: minor
  effort: 15min
  tags: [prefer_api, generated]
  generated: true
  status: ready
  message: The platform offers a clearer or safer construct for this.
  summary: A construct is used where the platform offers one that is clearer or safer.
  why: |
    The alternative exists because it removes a class of mistake — a conversion, an allocation, an edge
    case — that the current form leaves to the caller. Using the older form means every reader has to
    check that the edge case was handled.
  fix: |
    Switch to the recommended construct; the behaviour is the same in the normal case and defined in the
    cases the old form got wrong.
  detect:
    - member: [Collection.isEmpty]
    - invocation: [isEmpty]
      receiver: [Collection]

