  generated: true
  status: ready
  message: Shared state is accessed without correct coordination.
  summary: Shared state is accessed with locking that is missing, too wide, or on the wrong object.
  why: |
    Concurrency defects depend on timing, so they pass every test and appear under load in production.
    Locking on a shared or public object also lets unrelated code block or deadlock this one.
  fix: |
    Lock a private object dedicated to the state it protects, keep the critical section short, and prefer
    the concurrent collections and higher-level primitives the platform provides.
  detect:
    - member: [Object.wait]
    - invocation: [wait]
      receiver: [Object]
    - member: [Object.notify]
    - invocation: [notify]
      receiver: [Object]
    - member: [Object.notifyAll]
    - invocation: [notifyAll]
      receiver: [Object]

- key: QG-JV-BUG-0075
  name: Wait(...) should be replaced by the recommended alternative
  languages: [java]
  category: BUG
  severity: major
  effort: 15min
  tags: [prefer_api, generated]
  generated: true
  status: planned
  message: The platform offers a clearer or safer construct for this.
  summary: A construct is used where the platform offers one that is clearer or safer.
  why: |
    The alternative exists because it removes a class of mistake — a conversion, an allocation, an edge
    case — that the current form leaves to the caller. Using the older form means every reader has to
    check that the edge case was handled.
  fix: |
    Switch to the recommended construct; the behaviour is the same in the normal case and defined in the
    cases the old form got wrong.

