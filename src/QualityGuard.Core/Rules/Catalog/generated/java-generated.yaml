- key: QG-JV-SML-0045
  name: Exception handling around Exceptions in throws clauses should be explicit
  languages: [java]
  category: SML
  severity: minor
  effort: 15min
  tags: [exception, generated]
  generated: true
  status: planned
  message: This handling hides the failure instead of dealing with it.
  summary: An exception is thrown, caught or propagated in a way that hides the failure.
  why: |
    Handlers that are too broad, empty, or that replace the original error remove the information needed
    to diagnose the incident, and let the program continue in a state nobody designed for. The symptom
    then appears far from the cause.
  fix: |
    Catch the specific failures this code can recover from, keep the original exception as the cause when
    wrapping, and let everything else reach the boundary handler.

