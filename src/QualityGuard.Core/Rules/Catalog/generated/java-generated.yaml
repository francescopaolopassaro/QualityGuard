# Generated catalog entries for java. Texts come from the family templates in
# tools/generate_rules.py and are refined by hand as each family is reviewed.

- key: QG-JV-SML-0028
  name: Suppression comments should be resolved rather than left in the code
  languages: [java]
  category: SML
  severity: minor
  effort: 15min
  tags: [marker, generated]
  generated: true
  status: planned
  message: This marker records work that was left open.
  summary: A marker in the source records work or a decision that was left open.
  why: |
    Markers are written for a future reader who never comes back to them. Nobody can tell whether the
    note is still relevant, who owns it, or whether the missing work has since become a defect.
  fix: |
    Do the work, or move it to the issue tracker and reference the ticket in the marker so the deadline
    lives somewhere that gets reviewed.

- key: QG-JV-SML-0032
  name: URIs should not be hardcoded in the source
  languages: [java]
  category: SML
  scope: main
  severity: minor
  effort: 15min
  tags: [hardcoded_value, generated]
  generated: true

  message: This value is fixed in the source and cannot be changed without a rebuild.
  summary: An address, path or other deployment-specific value is written into the code.
  why: |
    The value is right for exactly one environment. Every other environment needs a code change, so the
    same build cannot be promoted from test to production, and a value that has to be corrected under
    pressure gets corrected in the wrong place.
  fix: |
    Move the value to configuration, read it at start-up, and fail with a clear message when it is
    missing so a misconfigured deployment stops before it does anything.
  detect:
    - invocation: [String]
      receiver: [lang]

- key: QG-JV-BUG-0022
  name: Object.finalize() method should not be used
  languages: [java]
  category: BUG
  scope: main
  severity: major
  effort: 15min
  tags: [avoid_api, generated]
  generated: true
  status: ready
  message: This API should be replaced by the current alternative.
  summary: Code calls an API that is unsafe, obsolete or superseded by a better alternative.
  why: |
    The API stays available for compatibility, so nothing fails at build time, but it carries behaviour
    the platform now considers a defect — unchecked input, a weak guarantee, or a cost the replacement
    avoids. Its presence also spreads: new code copies what it finds nearby.
  fix: |
    Replace the call with the current API, and keep the old one only behind a compatibility layer that is
    documented and dated.
  detect:
    - member: [Object.finalize]
    - invocation: [finalize]
      receiver: [Object]

- key: QG-JV-BUG-0023
  name: Super.finalize() should match the behaviour the code describes
  languages: [java]
  category: BUG
  scope: main
  severity: major
  effort: 15min
  tags: [bug, generated]
  generated: true

  message: This code does not behave the way it reads.
  summary: The code does not do what its shape suggests, or fails on ordinary input.
  why: |
    Written this way the code works by accident or breaks on values that are perfectly normal, and the
    mistake is easy to miss in review because the intent reads correctly.
  fix: |
    Make the intended behaviour explicit — fix the condition, the operator or the order of operations —
    and cover the case that used to fail with a test.
  detect:
    - invocation: [Object, finalize, squid, super]
      receiver: [lang]

- key: QG-JV-SML-0038
  name: Source code should be simplified
  languages: [java]
  category: SML
  scope: main
  severity: minor
  effort: 15min
  tags: [sml, generated]
  generated: true

  message: This code is harder to read or change than the behaviour requires.
  summary: The code works but is harder to read or change than the behaviour requires.
  why: |
    The intent is buried, duplicated, or spread across places that must stay in sync, so every future
    change costs more than it should and carries a risk that has nothing to do with the change itself.
  fix: |
    Remove what is not used, name what is unclear, and keep one piece of behaviour in one place so the
    next change touches a single spot.
  detect:
    - invocation: [IndentationCheck, indentationLevel, squid]

