- key: QG-PP-SEC-0093
  name: Cryptographic RSA algorithms should always incorporate OAEP (Optimal Asymmetric Encryption Padding)
  languages: [php]
  category: SEC
  severity: critical
  effort: 20min
  status: planned
  generated: true
  tags: [cwe]
  summary: Cryptography is used in a way that does not give the protection it appears to.
  why: |
    The code still runs and the data still looks protected, which is what makes this expensive to
    find: nothing fails until somebody who should not be able to read the data reads it.
  fix: |
    Use the current recommended algorithm and parameters, and let the platform choose what it can.

