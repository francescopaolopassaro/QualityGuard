- key: QG-DK-SEC-0028
  name: Containers should not share the host operating system namespaces
  languages: [docker]
  category: SEC
  severity: major
  effort: 60min
  status: planned
  generated: true
  tags: [docker, cwe, former-hotspot]
  summary: A name does not follow the convention the rest of the code uses.
  why: |
    Conventions let a reader infer what something is from its shape alone. A deviation costs a
    lookup every time, and makes searches and automated refactoring less reliable.
  fix: |
    Rename it to match the convention used around it.

- key: QG-DK-SEC-0029
  name: Sensitive resources copied to Docker images should not be owned or writable by non-root users
  languages: [docker]
  category: SEC
  severity: minor
  effort: 20min
  status: planned
  generated: true
  tags: [dockerfile, cwe, former-hotspot]
  summary: Something the runtime cannot reclaim on its own is not released.
  why: |
    Handles, sockets and connections are finite. The failure appears far from here, under load, as
    an exhaustion nobody can attribute to a single line.
  fix: |
    Release it on every path, including the exceptional one.

