- key: QG-PY-SML-0111
  name: Regular expressions around Character classes in regular expressions should be safe and correct
  languages: [py]
  category: SML
  severity: minor
  effort: 15min
  tags: [regex, generated]
  generated: true
  status: planned
  message: This pattern is unsafe or incorrect as written.
  summary: A regular expression is malformed, ambiguous, or able to backtrack catastrophically.
  why: |
    A pattern is only validated when it first runs, so a mistake surfaces on the path that uses it —
    often an error path. Patterns with nested quantifiers can also take exponential time on crafted
    input, which turns one request into a stalled CPU core.
  fix: |
    Simplify the pattern so no quantifier can match the same text in several ways, add a matching timeout
    for input that comes from outside, and cover the pattern with a test.

- key: QG-PY-SEC-0076
  name: Security groups should not weaken the security of the application
  languages: [py]
  category: SEC
  severity: critical
  effort: 15min
  tags: [sec, generated]
  generated: true
  status: planned
  message: This construct weakens the security of the application.
  summary: A construct that attackers routinely target is used without the guard it needs.
  why: |
    The pattern either trusts data the program does not control, or relies on a mechanism that no longer
    offers the protection it appears to offer. Both keep working normally, which is why they survive
    until someone looks for them.
  fix: |
    Validate the incoming value against an allowed set, pass it as data rather than as code or command,
    and replace weakened mechanisms with the current recommended one.

