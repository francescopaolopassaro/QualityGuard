- key: QG-PY-SML-0066
  name: Two methods should not share the same implementation
  languages: [py]
  category: SML
  status: ready
  severity: minor
  effort: 15min
  tags: [duplication, generated]
  generated: false
  message: This code or value is duplicated.
  summary: Two methods of the same type have identical bodies.
  why: |
    Copies drift apart the first time one of them is fixed, and nothing links them, so the bug is fixed
    in one place and stays in the other. Readers also cannot tell which copy is authoritative.
  fix: |
    Keep one definition and reference it from the other places, or extract the shared part into a named
    function or constant.
- key: QG-PY-SML-0068
  name: OS process signal parameters should be verified before use
  languages: [py]
  category: SML
  severity: minor
  effort: 15min
  tags: [verification, generated]
  generated: true
  status: planned
  message: This value is accepted without the check that proves it is legitimate.
  summary: A value or a peer is accepted without the check that proves it is legitimate.
  why: |
    Without verification the program trusts whatever it received, so an attacker who can supply or
    intercept the value decides what happens next. The code keeps working in normal conditions, which is
    why the missing check is rarely noticed before it is exploited.
  fix: |
    Perform the check with the platform API — signature, certificate chain, hostname or token validation
    — and reject the value when it fails, instead of logging and continuing.

