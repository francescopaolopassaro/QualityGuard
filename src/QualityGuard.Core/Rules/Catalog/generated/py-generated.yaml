- key: QG-PY-SML-0042
  name: Tests around A reason should verify something
  languages: [py]
  category: SML
  severity: minor
  effort: 15min
  tags: [tests, generated]
  generated: true
  status: planned
  message: This test cannot fail, so it verifies nothing.
  summary: A test does not assert, is disabled, or cannot fail.
  why: |
    A test that cannot fail reports success forever while covering nothing, and the suite keeps its green
    status. That is worse than having no test at all, because it removes the incentive to write one.
  fix: |
    Assert the behaviour the test exists for, re-enable it, and make sure it fails when the behaviour is
    broken before trusting it again.

- key: QG-PY-SML-0043
  name: A field should not be duplicated
  languages: [py]
  category: SML
  severity: minor
  effort: 15min
  tags: [duplication, generated]
  generated: true
  status: planned
  message: This code or value is duplicated.
  summary: The same code or value appears more than once.
  why: |
    Copies drift apart the first time one of them is fixed, and nothing links them, so the bug is fixed
    in one place and stays in the other. Readers also cannot tell which copy is authoritative.
  fix: |
    Keep one definition and reference it from the other places, or extract the shared part into a named
    function or constant.

