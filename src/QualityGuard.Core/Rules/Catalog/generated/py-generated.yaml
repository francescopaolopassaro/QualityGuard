- key: QG-PY-SML-0104
  name: Reusable resources should be simplified
  languages: [py]
  category: SML
  severity: minor
  effort: 15min
  tags: [sml, generated]
  generated: true
  status: planned
  message: This code is harder to read or change than the behaviour requires.
  summary: The code works but is harder to read or change than the behaviour requires.
  why: |
    The intent is buried, duplicated, or spread across places that must stay in sync, so every future
    change costs more than it should and carries a risk that has nothing to do with the change itself.
  fix: |
    Remove what is not used, name what is unclear, and keep one piece of behaviour in one place so the
    next change touches a single spot.

- key: QG-PY-SML-0105
  name: Concurrent access around Lambdas should be coordinated correctly
  languages: [py]
  category: SML
  severity: minor
  effort: 15min
  tags: [concurrency, generated]
  generated: true
  status: planned
  message: Shared state is accessed without correct coordination.
  summary: Shared state is accessed with locking that is missing, too wide, or on the wrong object.
  why: |
    Concurrency defects depend on timing, so they pass every test and appear under load in production.
    Locking on a shared or public object also lets unrelated code block or deadlock this one.
  fix: |
    Lock a private object dedicated to the state it protects, keep the critical section short, and prefer
    the concurrent collections and higher-level primitives the platform provides.

- key: QG-PY-SEC-0057
  name: S3 buckets should not be granted more access than it needs
  languages: [py]
  category: SEC
  severity: critical
  effort: 15min
  tags: [permissions, generated]
  generated: true
  status: planned
  message: This grants wider access than the operation needs.
  summary: A resource is created or shared with permissions wider than the task requires.
  why: |
    Every account that can reach the resource can also change it, so a single compromised process is
    enough to alter data or code the application later trusts. Wide permissions are also invisible at the
    call site: nothing in the reading code says who else can write.
  fix: |
    Grant the narrowest right that works, to the specific identity that needs it, and rely on inherited
    permissions from a properly secured parent instead of widening the resource itself.

- key: QG-PY-SEC-0058
  name: Amazon S3 buckets should not weaken the security of the application
  languages: [py]
  category: SEC
  severity: critical
  effort: 15min
  tags: [sec, generated]
  generated: true
  status: planned
  message: This construct weakens the security of the application.
  summary: A construct that attackers routinely target is used without the guard it needs.
  why: |
    The pattern either trusts data the program does not control, or relies on a mechanism that no longer
    offers the protection it appears to offer. Both keep working normally, which is why they survive
    until someone looks for them.
  fix: |
    Validate the incoming value against an allowed set, pass it as data rather than as code or command,
    and replace weakened mechanisms with the current recommended one.

- key: QG-PY-SML-0106
  name: Secrets should not be written into AWS region
  languages: [py]
  category: SML
  severity: minor
  effort: 15min
  tags: [secret, generated]
  generated: true
  status: planned
  message: This value looks like a credential committed with the source.
  summary: A credential, key or token appears directly in the source instead of coming from a secret store.
  why: |
    Anything committed with the code is readable by everyone who can clone the repository, and it
    survives in the history even after being deleted. Scanners find these values within minutes of a
    repository becoming reachable, and rotating them means editing and redeploying every copy.
  fix: |
    Read the value at run time from the platform secret store or the environment, fail fast when it is
    missing, and treat the committed value as compromised: rotate it before removing it.

