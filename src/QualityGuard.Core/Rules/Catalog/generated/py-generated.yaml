- key: QG-PY-SEC-0081
  name: Models should not weaken the security of the application
  languages: [py]
  category: SEC
  severity: critical
  effort: 15min
  tags: [sec, generated]
  generated: true
  status: ready
  message: This construct weakens the security of the application.
  summary: A construct that attackers routinely target is used without the guard it needs.
  why: |
    The pattern either trusts data the program does not control, or relies on a mechanism that no longer
    offers the protection it appears to offer. Both keep working normally, which is why they survive
    until someone looks for them.
  fix: |
    Validate the incoming value against an allowed set, pass it as data rather than as code or command,
    and replace weakened mechanisms with the current recommended one.
  detect:
    - member: [torch.load]
    - invocation: [load]
      receiver: [torch]

- key: QG-PY-SML-0160
  name: Asynchronous functions should be accessed in a thread-safe way
  languages: [py]
  category: SML
  severity: minor
  effort: 15min
  tags: [concurrency, generated]
  generated: true

  message: Shared state is accessed without correct coordination.
  summary: Shared state is accessed with locking that is missing, too wide, or on the wrong object.
  why: |
    Concurrency defects depend on timing, so they pass every test and appear under load in production.
    Locking on a shared or public object also lets unrelated code block or deadlock this one.
  fix: |
    Lock a private object dedicated to the state it protects, keep the critical section short, and prefer
    the concurrent collections and higher-level primitives the platform provides.
  detect:
    - invocation: [timeout]

