- key: QG-PY-SML-0115
  name: Any should not be used
  languages: [py]
  category: SML
  severity: minor
  effort: 15min
  tags: [avoid_api, generated]
  generated: true
  status: planned
  message: This API should be replaced by the current alternative.
  summary: Code calls an API that is unsafe, obsolete or superseded by a better alternative.
  why: |
    The API stays available for compatibility, so nothing fails at build time, but it carries behaviour
    the platform now considers a defect — unchecked input, a weak guarantee, or a cost the replacement
    avoids. Its presence also spreads: new code copies what it finds nearby.
  fix: |
    Replace the call with the current API, and keep the old one only behind a compatibility layer that is
    documented and dated.

