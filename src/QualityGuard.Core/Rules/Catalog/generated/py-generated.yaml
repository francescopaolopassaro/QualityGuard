# Generated catalog entries for py. Texts come from the family templates in
# tools/generate_rules.py and are refined by hand as each family is reviewed.

- key: QG-PY-SML-0022
  name: Backticks should not be used
  languages: [py]
  category: SML
  severity: minor
  effort: 15min
  tags: [avoid_api, generated]
  generated: true

  message: This API should be replaced by the current alternative.
  summary: Code calls an API that is unsafe, obsolete or superseded by a better alternative.
  why: |
    The API stays available for compatibility, so nothing fails at build time, but it carries behaviour
    the platform now considers a defect — unchecked input, a weak guarantee, or a cost the replacement
    avoids. Its presence also spreads: new code copies what it finds nearby.
  fix: |
    Replace the call with the current API, and keep the old one only behind a compatibility layer that is
    documented and dated.
  detect:
    - invocation: [BackticksUsage]

- key: QG-PY-SML-0023
  name: Regular expressions should be safe and correct
  languages: [py]
  category: SML
  severity: minor
  effort: 15min
  tags: [regex, generated]
  generated: true

  message: This pattern is unsafe or incorrect as written.
  summary: A regular expression is malformed, ambiguous, or able to backtrack catastrophically.
  why: |
    A pattern is only validated when it first runs, so a mistake surfaces on the path that uses it —
    often an error path. Patterns with nested quantifiers can also take exponential time on crafted
    input, which turns one request into a stalled CPU core.
  fix: |
    Simplify the pattern so no quantifier can match the same text in several ways, add a matching timeout
    for input that comes from outside, and cover the pattern with a test.
  detect:
    - invocation: [CommentRegularExpression, regularExpression]

