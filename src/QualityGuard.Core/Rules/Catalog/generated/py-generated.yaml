- key: QG-PY-SML-0073
  name: Bare raise statements should not be used
  languages: [py]
  category: SML
  severity: minor
  effort: 15min
  tags: [avoid_api, generated]
  generated: true
  status: ready
  message: This API should be replaced by the current alternative.
  summary: Code calls an API that is unsafe, obsolete or superseded by a better alternative.
  why: |
    The API stays available for compatibility, so nothing fails at build time, but it carries behaviour
    the platform now considers a defect — unchecked input, a weak guarantee, or a cost the replacement
    avoids. Its presence also spreads: new code copies what it finds nearby.
  fix: |
    Replace the call with the current API, and keep the old one only behind a compatibility layer that is
    documented and dated.
  detect:
    - invocation: [raise]

- key: QG-PY-BUG-0050
  name: Exceptions __cause__ should make failure handling explicit
  languages: [py]
  category: BUG
  severity: major
  effort: 15min
  tags: [exception, generated]
  generated: true

  message: This handling hides the failure instead of dealing with it.
  summary: An exception is thrown, caught or propagated in a way that hides the failure.
  why: |
    Handlers that are too broad, empty, or that replace the original error remove the information needed
    to diagnose the incident, and let the program continue in a state nobody designed for. The symptom
    then appears far from the cause.
  fix: |
    Catch the specific failures this code can recover from, keep the original exception as the cause when
    wrapping, and let everything else reach the boundary handler.
  detect:
    - invocation: [BaseException, NoneType, __cause__]

