- key: QG-PY-SML-0059
  name: Conditional expressions should not be nested inside another one
  languages: [py]
  category: SML
  severity: minor
  effort: 15min
  tags: [nesting, generated]
  generated: true
  status: planned
  message: This construct is nested inside another of the same kind.
  summary: A construct is nested inside another of the same kind.
  why: |
    The number of paths a reader has to consider becomes the product of the two, and the inner construct
    is easy to miss when scanning the outer one. Changes then land in the wrong level.
  fix: |
    Extract the inner construct into a function named after the decision it makes, and call it from the
    outer one.

- key: QG-PY-SML-0060
  name: Tests around Assertion argument order should verify something
  languages: [py]
  category: SML
  severity: minor
  effort: 15min
  tags: [tests, generated]
  generated: true
  status: planned
  message: This test cannot fail, so it verifies nothing.
  summary: A test does not assert, is disabled, or cannot fail.
  why: |
    A test that cannot fail reports success forever while covering nothing, and the suite keeps its green
    status. That is worse than having no test at all, because it removes the incentive to write one.
  fix: |
    Assert the behaviour the test exists for, re-enable it, and make sure it fails when the behaviour is
    broken before trusting it again.

