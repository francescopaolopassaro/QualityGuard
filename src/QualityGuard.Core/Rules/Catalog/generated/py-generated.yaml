- key: QG-PY-SML-0045
  name: Docstrings should be declared the way the language intends
  languages: [py]
  category: SML
  scope: main
  severity: minor
  effort: 15min
  tags: [declaration, generated]
  generated: true

  message: This declaration exposes more than it should.
  summary: A declaration uses modifiers, order or visibility that do not match its purpose.
  why: |
    Declarations are the contract other code relies on. A wider visibility than needed makes an internal
    detail part of the public surface, and unusual modifier combinations hide the intent from readers and
    tools alike.
  fix: |
    Declare the narrowest visibility that works, in the conventional modifier order, and mark as final or
    read-only whatever is not meant to change.
  detect:
    - invocation: [function, method, module]

- key: QG-PY-SML-0047
  name: New-style classes should be replaced by the recommended alternative
  languages: [py]
  category: SML
  severity: minor
  effort: 15min
  tags: [prefer_api, generated]
  generated: true
  status: planned
  message: The platform offers a clearer or safer construct for this.
  summary: A construct is used where the platform offers one that is clearer or safer.
  why: |
    The alternative exists because it removes a class of mistake — a conversion, an allocation, an edge
    case — that the current form leaves to the caller. Using the older form means every reader has to
    check that the edge case was handled.
  fix: |
    Switch to the recommended construct; the behaviour is the same in the normal case and defined in the
    cases the old form got wrong.

