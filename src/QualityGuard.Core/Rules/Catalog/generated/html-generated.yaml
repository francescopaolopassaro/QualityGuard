# Generated catalog entries for html. Texts come from the family templates in
# tools/generate_rules.py and are refined by hand as each family is reviewed.

- key: QG-HTML-SML-0009
  name: HTML comments should be removed once nothing uses it
  languages: [html]
  category: SML
  severity: minor
  effort: 15min
  tags: [dead_code, generated]
  generated: true
  status: planned
  message: Nothing references this; remove it.
  summary: Code that nothing references is kept in the file.
  why: |
    Unused code still has to be read, compiled and maintained, and it misleads: a reader assumes it runs.
    It is also where stale assumptions survive, so reviving it later reintroduces behaviour that no
    longer matches the rest of the program.
  fix: |
    Delete it. Version control keeps the history, so nothing is lost, and the file becomes an accurate
    description of what the program does.

- key: QG-HTML-BUG-0002
  name: <strong> and <em> tags should be replaced by the recommended alternative
  languages: [html]
  category: BUG
  severity: major
  effort: 15min
  tags: [prefer_api, generated]
  generated: true
  status: planned
  message: The platform offers a clearer or safer construct for this.
  summary: A construct is used where the platform offers one that is clearer or safer.
  why: |
    The alternative exists because it removes a class of mistake — a conversion, an allocation, an edge
    case — that the current form leaves to the caller. Using the older form means every reader has to
    check that the edge case was handled.
  fix: |
    Switch to the recommended construct; the behaviour is the same in the normal case and defined in the
    cases the old form got wrong.

- key: QG-HTML-SML-0010
  name: Disallowed child elements should be resolved rather than left in the code
  languages: [html]
  category: SML
  severity: minor
  effort: 15min
  tags: [marker, generated]
  generated: true
  status: planned
  message: This marker records work that was left open.
  summary: A marker in the source records work or a decision that was left open.
  why: |
    Markers are written for a future reader who never comes back to them. Nobody can tell whether the
    note is still relevant, who owns it, or whether the missing work has since become a defect.
  fix: |
    Do the work, or move it to the issue tracker and reference the ticket in the marker so the deadline
    lives somewhere that gets reviewed.

