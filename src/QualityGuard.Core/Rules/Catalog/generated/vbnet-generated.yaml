- key: QG-CS-SML-0378
  name: The & operator should be replaced by the recommended alternative
  languages: [vb]
  category: SML
  severity: minor
  effort: 15min
  tags: [prefer_api, generated]
  generated: true
  status: planned
  message: The platform offers a clearer or safer construct for this.
  summary: A construct is used where the platform offers one that is clearer or safer.
  why: |
    The alternative exists because it removes a class of mistake — a conversion, an allocation, an edge
    case — that the current form leaves to the caller. Using the older form means every reader has to
    check that the edge case was handled.
  fix: |
    Switch to the recommended construct; the behaviour is the same in the normal case and defined in the
    cases the old form got wrong.

- key: QG-CS-BUG-0109
  name: Loops with at most one iteration should behave the way it reads
  languages: [vb]
  category: BUG
  severity: major
  effort: 15min
  tags: [bug, generated]
  generated: true
  status: planned
  message: This code does not behave the way it reads.
  summary: The code does not do what its shape suggests, or fails on ordinary input.
  why: |
    Written this way the code works by accident or breaks on values that are perfectly normal, and the
    mistake is easy to miss in review because the intent reads correctly.
  fix: |
    Make the intended behaviour explicit — fix the condition, the operator or the order of operations —
    and cover the case that used to fail with a test.

- key: QG-CS-SML-0380
  name: Select Case statements should not be nested inside another one
  languages: [vb]
  category: SML
  severity: minor
  effort: 15min
  tags: [nesting, generated]
  generated: true
  status: planned
  message: This construct is nested inside another of the same kind.
  summary: A construct is nested inside another of the same kind.
  why: |
    The number of paths a reader has to consider becomes the product of the two, and the inner construct
    is easy to miss when scanning the outer one. Changes then land in the wrong level.
  fix: |
    Extract the inner construct into a function named after the decision it makes, and call it from the
    outer one.

