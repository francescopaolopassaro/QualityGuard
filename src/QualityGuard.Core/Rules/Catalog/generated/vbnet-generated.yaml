- key: QG-CS-SML-0423
  name: Arguments of public methods should be verified before it is trusted
  languages: [vb]
  category: SML
  severity: minor
  effort: 15min
  tags: [verification, generated]
  generated: true
  status: planned
  message: This value is accepted without the check that proves it is legitimate.
  summary: A value or a peer is accepted without the check that proves it is legitimate.
  why: |
    Without verification the program trusts whatever it received, so an attacker who can supply or
    intercept the value decides what happens next. The code keeps working in normal conditions, which is
    why the missing check is rarely noticed before it is exploited.
  fix: |
    Perform the check with the platform API — signature, certificate chain, hostname or token validation
    — and reject the value when it fails, instead of logging and continuing.

- key: QG-CS-BUG-0125
  name: Types should be declared the way the language intends
  languages: [vb]
  category: BUG
  severity: major
  effort: 15min
  tags: [declaration, generated]
  generated: true
  status: planned
  message: This declaration exposes more than it should.
  summary: A declaration uses modifiers, order or visibility that do not match its purpose.
  why: |
    Declarations are the contract other code relies on. A wider visibility than needed makes an internal
    detail part of the public surface, and unusual modifier combinations hide the intent from readers and
    tools alike.
  fix: |
    Declare the narrowest visibility that works, in the conventional modifier order, and mark as final or
    read-only whatever is not meant to change.

