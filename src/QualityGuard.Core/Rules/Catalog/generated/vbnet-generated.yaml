- key: QG-CS-SEC-0083
  name: Password hashing functions should use current cryptographic parameters
  languages: [vb]
  category: SEC
  severity: critical
  effort: 15min
  tags: [crypto, generated]
  generated: true
  status: planned
  message: This cryptographic choice no longer provides the protection it suggests.
  summary: A cryptographic primitive, mode or key size that is no longer considered safe is used.
  why: |
    Broken primitives keep producing output that looks correct, so nothing fails while the protection is
    already gone. Data encrypted today is often kept for years, which means an algorithm that is merely
    weak now will be readable later.
  fix: |
    Use the algorithms the platform recommends today — authenticated encryption, a modern hash, a key
    size at or above the current guidance — and keep the choice in one place so it can be raised.

- key: QG-CS-BUG-0111
  name: ToString() method should match the behaviour the code describes
  languages: [vb]
  category: BUG
  severity: major
  effort: 15min
  tags: [bug, generated]
  generated: true
  status: planned
  message: This code does not behave the way it reads.
  summary: The code does not do what its shape suggests, or fails on ordinary input.
  why: |
    Written this way the code works by accident or breaks on values that are perfectly normal, and the
    mistake is easy to miss in review because the intent reads correctly.
  fix: |
    Make the intended behaviour explicit — fix the condition, the operator or the order of operations —
    and cover the case that used to fail with a test.

