- key: QG-CS-SEC-0085
  name: Cipher Block Chaining IVs should use current cryptographic parameters
  languages: [vb]
  category: SEC
  severity: critical
  effort: 15min
  tags: [crypto, generated]
  generated: true
  status: planned
  message: This cryptographic choice no longer provides the protection it suggests.
  summary: A cryptographic primitive, mode or key size that is no longer considered safe is used.
  why: |
    Broken primitives keep producing output that looks correct, so nothing fails while the protection is
    already gone. Data encrypted today is often kept for years, which means an algorithm that is merely
    weak now will be readable later.
  fix: |
    Use the algorithms the platform recommends today — authenticated encryption, a modern hash, a key
    size at or above the current guidance — and keep the choice in one place so it can be raised.

- key: QG-CS-SML-0415
  name: If operators should not be nested inside another one
  languages: [vb]
  category: SML
  severity: minor
  effort: 15min
  tags: [nesting, generated]
  generated: true
  status: planned
  message: This construct is nested inside another of the same kind.
  summary: A construct is nested inside another of the same kind.
  why: |
    The number of paths a reader has to consider becomes the product of the two, and the inner construct
    is easy to miss when scanning the outer one. Changes then land in the wrong level.
  fix: |
    Extract the inner construct into a function named after the decision it makes, and call it from the
    outer one.

