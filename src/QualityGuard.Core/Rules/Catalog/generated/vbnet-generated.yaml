- key: QG-CS-SML-0432
  name: Methods should not be duplicated
  languages: [vb]
  category: SML
  severity: minor
  effort: 15min
  tags: [duplication, generated]
  generated: true
  status: planned
  message: This code or value is duplicated.
  summary: The same code or value appears more than once.
  why: |
    Copies drift apart the first time one of them is fixed, and nothing links them, so the bug is fixed
    in one place and stays in the other. Readers also cannot tell which copy is authoritative.
  fix: |
    Keep one definition and reference it from the other places, or extract the shared part into a named
    function or constant.

- key: QG-CS-BUG-0130
  name: Empty collections should not be left empty
  languages: [vb]
  category: BUG
  severity: major
  effort: 15min
  tags: [empty, generated]
  generated: true
  status: planned
  message: This construct is empty, so it does nothing.
  summary: A construct is declared with no content.
  why: |
    An empty body reads as if the case is handled while nothing happens, which is exactly how ignored
    errors and unimplemented branches survive review. It is also indistinguishable from an accidental
    deletion.
  fix: |
    Implement the behaviour, or remove the construct. When doing nothing is deliberate, say so in a
    comment so the next reader does not treat it as a gap.

