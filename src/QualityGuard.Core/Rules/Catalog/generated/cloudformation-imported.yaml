- key: QG-CF-SEC-0047
  name: Cloud resources logging should not be disabled
  languages: [cf]
  category: SEC
  severity: major
  effort: 30min
  status: planned
  generated: true
  tags: [aws, cwe, former-hotspot]
  summary: Something the runtime cannot reclaim on its own is not released.
  why: |
    Handles, sockets and connections are finite. The failure appears far from here, under load, as
    an exhaustion nobody can attribute to a single line.
  fix: |
    Release it on every path, including the exceptional one.

