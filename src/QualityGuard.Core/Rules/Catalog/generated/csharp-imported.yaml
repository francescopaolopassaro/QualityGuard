# Catalogue entries written in one pass, one per defect this language still lacks a check for.
# Every entry is documentation and carries no detection, so none of them reports anything: a
# detection is written by hand, against the shape the defect actually has, and measured before
# the entry stops being planned.

- key: QG-CS-SEC-0102
  name: Custom cryptographic algorithms should not be used
  languages: [cs]
  category: SEC
  severity: critical
  effort: 1d
  status: planned
  generated: true
  tags: [cwe, former-hotspot]
  summary: Cryptography is used in a way that does not give the protection it appears to.
  why: |
    The code still runs and the data still looks protected, which is what makes this expensive to
    find: nothing fails until somebody who should not be able to read the data reads it.
  fix: |
    Use the current recommended algorithm and parameters, and let the platform choose what it can.

