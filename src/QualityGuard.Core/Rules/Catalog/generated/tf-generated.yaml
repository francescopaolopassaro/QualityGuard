- key: QG-TF-SEC-0046
  name: Cloud storage encryption should keep the platform protection enabled
  languages: [tf]
  category: SEC
  severity: critical
  effort: 15min
  tags: [protection_off, generated]
  generated: true
  status: superseded
  superseded_by: QG-TF-SEC-0071
  message: A protection provided by the platform is switched off here.
  summary: A safety mechanism the platform provides is switched off.
  why: |
    The setting exists because the default behaviour blocks a known class of attack. Turning it off is
    usually done to make one case work and then applies everywhere, so the whole application loses the
    protection while nothing in the code says so.
  fix: |
    Restore the default and solve the original problem in a narrower way — scope the exception to the
    single endpoint or value that needs it, and document why it is safe there.

