# Catalogue entries written in one pass, one per defect this language still lacks a check for.
# Every entry is documentation and carries no detection, so none of them reports anything: a
# detection is written by hand, against the shape the defect actually has, and measured before
# the entry stops being planned.

- key: QG-PY-SEC-0120
  name: Policies should not grant all privileges
  languages: [py]
  category: SEC
  severity: blocker
  effort: 5min
  status: planned
  generated: true
  tags: [cwe, aws, gcp, former-hotspot]
  summary: Something is reachable by callers who should not reach it.
  why: |
    Access granted this broadly is never noticed afterwards: nothing fails, and the surface stays
    open for as long as the resource exists.
  fix: |
    Grant the access to the identities that need it and to nothing else.

