  languages: [py]
  category: SML
  severity: critical
  effort: 2min
  status: planned
  generated: true
  tags: [regex, performance]
  summary: An API is used where a better one exists.
  why: |
    The older form usually costs something the newer one does not, and it is on its way out: a
    conversion, an allocation, a case it handles wrongly.
  fix: |
    Use the current API, and keep the old one only behind a documented compatibility layer.

