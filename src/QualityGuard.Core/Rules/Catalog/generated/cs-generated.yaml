- key: QG-CS-SML-0311
  name: Calls to async methods should not block in Azure Functions
  languages: [cs, vb]
  category: SML
  severity: major
  effort: 30min
  message: .Result or Wait() blocks inside an async function.
  summary: Async Azure Functions block on awaited work.
  why: |
    Blocking holds a hosting thread hostage while I/O completes: under load the thread pool starves
    and requests queue behind waits that own no CPU work.
  fix: |
    Await the task instead and let the thread return to the pool.
