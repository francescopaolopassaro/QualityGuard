- key: QG-CS-SML-0215
  name: Composite format strings should match their arguments
  languages: [cs, vb]
  category: SML
  severity: minor
  effort: 5min
  message: A format hole indexes past the arguments that follow.
  summary: Format placeholders outnumber the arguments.
  why: |
    At run time the extra hole stays unfilled - or the call throws FormatException, depending on the
    API. Both surface only when the line actually executes with those arguments.
  fix: |
    Renumber placeholders from zero without gaps and pass exactly one argument per hole.
- key: QG-CS-SML-0216
  name: Empty constructs should not be left empty
  languages: [cs]
  category: SML
  severity: minor
  effort: 15min
  tags: [empty, generated]
  generated: true
  status: planned
  message: This construct is empty, so it does nothing.
  summary: A construct is declared with no content.
  why: |
    An empty body reads as if the case is handled while nothing happens, which is exactly how ignored
    errors and unimplemented branches survive review. It is also indistinguishable from an accidental
    deletion.
  fix: |
    Implement the behaviour, or remove the construct. When doing nothing is deliberate, say so in a
    comment so the next reader does not treat it as a gap.

