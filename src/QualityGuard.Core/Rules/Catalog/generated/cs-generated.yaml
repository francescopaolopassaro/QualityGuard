- key: QG-CS-SEC-0080
  name: The protection around ASP.NET Request Validation should stay enabled
  languages: [cs]
  category: SEC
  severity: critical
  effort: 15min
  tags: [protection_off, generated]
  generated: true
  status: planned
  message: A protection provided by the platform is switched off here.
  summary: A safety mechanism the platform provides is switched off.
  why: |
    The setting exists because the default behaviour blocks a known class of attack. Turning it off is
    usually done to make one case work and then applies everywhere, so the whole application loses the
    protection while nothing in the code says so.
  fix: |
    Restore the default and solve the original problem in a narrower way — scope the exception to the
    single endpoint or value that needs it, and document why it is safe there.

- key: QG-CS-SML-0307
  name: Tests around Use a testable date/time provider should verify something
  languages: [cs]
  category: SML
  severity: minor
  effort: 15min
  tags: [tests, generated]
  generated: true
  status: planned
  message: This test cannot fail, so it verifies nothing.
  summary: A test does not assert, is disabled, or cannot fail.
  why: |
    A test that cannot fail reports success forever while covering nothing, and the suite keeps its green
    status. That is worse than having no test at all, because it removes the incentive to write one.
  fix: |
    Assert the behaviour the test exists for, re-enable it, and make sure it fails when the behaviour is
    broken before trusting it again.

- key: QG-CS-SEC-0081
  name: XML signatures should be verified before it is trusted
  languages: [cs]
  category: SEC
  severity: critical
  effort: 15min
  tags: [verification, generated]
  generated: true
  status: planned
  message: This value is accepted without the check that proves it is legitimate.
  summary: A value or a peer is accepted without the check that proves it is legitimate.
  why: |
    Without verification the program trusts whatever it received, so an attacker who can supply or
    intercept the value decides what happens next. The code keeps working in normal conditions, which is
    why the missing check is rarely noticed before it is exploited.
  fix: |
    Perform the check with the platform API — signature, certificate chain, hostname or token validation
    — and reject the value when it fails, instead of logging and continuing.

