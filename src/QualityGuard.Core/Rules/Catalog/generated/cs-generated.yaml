- key: QG-CS-SML-0326
  name: The collection should be filtered before sorting
  languages: [cs, vb]
  category: SML
  severity: minor
  effort: 5min
  message: OrderBy runs before Where in the same chain.
  summary: Sorting happens before filtering.
  why: |
    Elements that fail the predicate were compared anyway: the ordering work on discarded rows was
    pure cost, and it grows with the unfiltered size.
  fix: |
    Swap the order to .Where(...).OrderBy(...) - same result, less work when most rows fail.
