- key: QG-CS-BUG-0077
  name: Absent values around Nullable type comparison should be handled explicitly
  languages: [cs]
  category: BUG
  severity: major
  effort: 15min
  tags: [nullability, generated]
  generated: true
  status: planned
  message: An absent value is not handled on this path.
  summary: A value that can be absent is used without checking, or a check is written that cannot work.
  why: |
    The failure surfaces as a null dereference at run time, in a place that often has nothing to do with
    where the value was produced. Checks that cannot succeed are worse, because they read as protection.
  fix: |
    Check the value where it enters the program, model absence in the type where the language allows it,
    and provide the default or the error at that point instead of deeper down.

- key: QG-CS-BUG-0078
  name: Empty nullable value should not be left empty
  languages: [cs]
  category: BUG
  severity: major
  effort: 15min
  tags: [empty, generated]
  generated: true
  status: planned
  message: This construct is empty, so it does nothing.
  summary: A construct is declared with no content.
  why: |
    An empty body reads as if the case is handled while nothing happens, which is exactly how ignored
    errors and unimplemented branches survive review. It is also indistinguishable from an accidental
    deletion.
  fix: |
    Implement the behaviour, or remove the construct. When doing nothing is deliberate, say so in a
    comment so the next reader does not treat it as a gap.

- key: QG-CS-SML-0222
  name: Exception handling around NotImplementedException should be explicit
  languages: [cs]
  category: SML
  severity: minor
  effort: 15min
  tags: [exception, generated]
  generated: true
  status: ready
  message: This handling hides the failure instead of dealing with it.
  summary: An exception is thrown, caught or propagated in a way that hides the failure.
  why: |
    Handlers that are too broad, empty, or that replace the original error remove the information needed
    to diagnose the incident, and let the program continue in a state nobody designed for. The symptom
    then appears far from the cause.
  fix: |
    Catch the specific failures this code can recover from, keep the original exception as the cause when
    wrapping, and let everything else reach the boundary handler.
  detect:
    - creation: [NotImplementedException]

