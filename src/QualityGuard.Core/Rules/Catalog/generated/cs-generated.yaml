- key: QG-CS-SML-0081
  name: URIs should not be hardcoded in the source
  languages: [cs]
  category: SML
  severity: minor
  effort: 15min
  tags: [hardcoded_value, generated]
  generated: true
  status: planned
  message: This value is fixed in the source and cannot be changed without a rebuild.
  summary: An address, path or other deployment-specific value is written into the code.
  why: |
    The value is right for exactly one environment. Every other environment needs a code change, so the
    same build cannot be promoted from test to production, and a value that has to be corrected under
    pressure gets corrected in the wrong place.
  fix: |
    Move the value to configuration, read it at start-up, and fail with a clear message when it is
    missing so a misconfigured deployment stops before it does anything.

- key: QG-CS-SML-0088
  name: Unnecessary using should be removed once nothing uses it
  languages: [cs]
  category: SML
  scope: main
  severity: minor
  effort: 15min
  tags: [dead_code, generated]
  generated: true

  message: Nothing references this; remove it.
  summary: Code that nothing references is kept in the file.
  why: |
    Unused code still has to be read, compiled and maintained, and it misleads: a reader assumes it runs.
    It is also where stale assumptions survive, so reviving it later reintroduces behaviour that no
    longer matches the rest of the program.
  fix: |
    Delete it. Version control keeps the history, so nothing is lost, and the file becomes an accurate
    description of what the program does.
  detect:
    - invocation: [cshtml, razor]
      receiver: [System, _Imports, _ViewImports]

