- key: QG-CS-BUG-0063
  name: Anonymous delegates should not be used to unsubscribe
  languages: [cs, vb]
  category: BUG
  severity: major
  effort: 10min
  message: A handler is removed with -= over a lambda written inline.
  summary: Unsubscribing through a fresh lambda removes nothing.
  why: |
    -= matches handlers by identity. A lambda written at the unsubscribe site is a new object every
    time, so the original subscription survives - with everything it captures.
  fix: |
    Keep the delegate in a field or long-lived local and pass that same reference to both += and -=.
