- key: QG-CS-SML-0169
  name: is should not be used with this
  languages: [cs, vb]
  category: SML
  severity: minor
  effort: 2min
  message: `this` is tested with the is operator.
  summary: An is test on this answers a settled question.
  why: |
    `this` is never null and its type is fixed where it is written, so `this is X` either always
    succeeds or is decided by the compiler. The check suggests the type could vary when it cannot.
  fix: |
    Drop the check when the type is guaranteed, or move the test to the value that actually arrives
    from outside.
