# Generated catalog entries for cs. Texts come from the family templates in
# tools/generate_rules.py and are refined by hand as each family is reviewed.

- key: QG-CS-SML-0077
  name: Methods and properties should follow the naming convention of the codebase
  languages: [cs]
  category: SML
  severity: minor
  effort: 15min
  tags: [naming, generated]
  generated: true
  status: planned
  message: This identifier does not follow the naming convention of the codebase.
  summary: An identifier does not follow the convention used by the rest of the code.
  why: |
    Conventions let a reader infer the kind of an identifier from its shape alone. A deviation costs a
    lookup every time, and makes automated searches and refactorings less reliable.
  fix: |
    Rename the identifier to match the convention, and let the editor propagate the change so callers
    stay in sync.

- key: QG-CS-SML-0078
  name: Method overrides should be simplified
  languages: [cs]
  category: SML
  severity: minor
  effort: 15min
  tags: [sml, generated]
  generated: true
  status: planned
  message: This code is harder to read or change than the behaviour requires.
  summary: The code works but is harder to read or change than the behaviour requires.
  why: |
    The intent is buried, duplicated, or spread across places that must stay in sync, so every future
    change costs more than it should and carries a risk that has nothing to do with the change itself.
  fix: |
    Remove what is not used, name what is unclear, and keep one piece of behaviour in one place so the
    next change touches a single spot.

