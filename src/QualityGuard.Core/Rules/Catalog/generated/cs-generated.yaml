- key: QG-CS-SEC-0076
  name: Cryptographic keys should use current cryptographic parameters
  languages: [cs]
  category: SEC
  severity: critical
  effort: 15min
  tags: [crypto, generated]
  generated: true
  status: planned
  message: This cryptographic choice no longer provides the protection it suggests.
  summary: A cryptographic primitive, mode or key size that is no longer considered safe is used.
  why: |
    Broken primitives keep producing output that looks correct, so nothing fails while the protection is
    already gone. Data encrypted today is often kept for years, which means an algorithm that is merely
    weak now will be readable later.
  fix: |
    Use the algorithms the platform recommends today — authenticated encryption, a modern hash, a key
    size at or above the current guidance — and keep the choice in one place so it can be raised.

- key: QG-CS-BUG-0091
  name: PartCreationPolicyAttribute should be replaced by the recommended alternative
  languages: [cs]
  category: BUG
  severity: major
  effort: 15min
  tags: [prefer_api, generated]
  generated: true
  status: ready
  message: The platform offers a clearer or safer construct for this.
  summary: A construct is used where the platform offers one that is clearer or safer.
  why: |
    The alternative exists because it removes a class of mistake — a conversion, an allocation, an edge
    case — that the current form leaves to the caller. Using the older form means every reader has to
    check that the edge case was handled.
  fix: |
    Switch to the recommended construct; the behaviour is the same in the normal case and defined in the
    cases the old form got wrong.
  detect:
    - creation: [PartCreationPolicyAttribute]
    - creation: [ExportAttribute]

