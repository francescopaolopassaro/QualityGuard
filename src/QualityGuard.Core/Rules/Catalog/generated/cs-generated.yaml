- key: QG-CS-BUG-0084
  name: A collection entry should not be written twice in a row
  languages: [cs]
  category: BUG
  severity: major
  effort: 15min
  tags: [bug, generated]
  generated: false
  status: ready
  message: This code does not behave the way it reads.
  summary: The same key or index is assigned twice with nothing reading it in between.
  why: |
    Written this way the code works by accident or breaks on values that are perfectly normal, and the
    mistake is easy to miss in review because the intent reads correctly.
  fix: |
    Make the intended behaviour explicit — fix the condition, the operator or the order of operations —
    and cover the case that used to fail with a test.

- key: QG-CS-SML-0291
  name: Two methods should not share the same implementation
  languages: [cs]
  category: SML
  severity: minor
  effort: 15min
  tags: [duplication, generated]
  generated: false
  status: ready
  message: This code or value is duplicated.
  summary: Two methods of the same type have identical bodies.
  why: |
    Copies drift apart the first time one of them is fixed, and nothing links them, so the bug is fixed
    in one place and stays in the other. Readers also cannot tell which copy is authoritative.
  fix: |
    Keep one definition and reference it from the other places, or extract the shared part into a named
    function or constant.

- key: QG-CS-BUG-0085
  name: Empty collections should not be accessed or iterated
  languages: [cs, vb]
  category: BUG
  severity: major
  effort: 5min
  message: A collection created empty on the spot is read or iterated.
  summary: Operations run against a freshly created empty collection.
  why: |
    The result is decided before the line executes: First throws, Any returns false, Count returns
    zero, a loop body never runs. Either scaffolding survived or real data was meant to arrive here.
  fix: |
    Iterate or query the actual source of data, or delete the dead operation.
