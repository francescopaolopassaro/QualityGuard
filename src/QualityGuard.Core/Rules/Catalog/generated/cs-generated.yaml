- key: QG-CS-SML-0202
  name: Loggers should follow the naming convention of the codebase
  languages: [cs]
  category: SML
  scope: main
  severity: minor
  effort: 15min
  tags: [naming, generated]
  generated: true

  message: This identifier does not follow the naming convention of the codebase.
  summary: An identifier does not follow the convention used by the rest of the code.
  why: |
    Conventions let a reader infer the kind of an identifier from its shape alone. A deviation costs a
    lookup every time, and makes automated searches and refactorings less reliable.
  fix: |
    Rename the identifier to match the convention, and let the editor propagate the change so callers
    stay in sync.
  detect:
    - invocation: [AssemblyQualifiedName, CreateLogger, FullName, GetLogger, nameof]
      receiver: [ILog, ILogger, ILoggerBase, ILoggerFactory, LogFactory, LogManager]

