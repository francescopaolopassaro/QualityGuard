- key: QG-CS-SML-0080
  name: The Standard outputs API should not be used
  languages: [cs]
  category: SML
  severity: minor
  effort: 15min
  tags: [avoid_api, generated]
  generated: true
  status: planned
  message: This API should be replaced by the current alternative.
  summary: Code calls an API that is unsafe, obsolete or superseded by a better alternative.
  why: |
    The API stays available for compatibility, so nothing fails at build time, but it carries behaviour
    the platform now considers a defect — unchecked input, a weak guarantee, or a cost the replacement
    avoids. Its presence also spreads: new code copies what it finds nearby.
  fix: |
    Replace the call with the current API, and keep the old one only behind a compatibility layer that is
    documented and dated.

- key: QG-CS-SML-0081
  name: Secrets should not be written into URIs
  languages: [cs]
  category: SML
  severity: minor
  effort: 15min
  tags: [secret, generated]
  generated: true
  status: planned
  message: This value looks like a credential committed with the source.
  summary: A credential, key or token appears directly in the source instead of coming from a secret store.
  why: |
    Anything committed with the code is readable by everyone who can clone the repository, and it
    survives in the history even after being deleted. Scanners find these values within minutes of a
    repository becoming reachable, and rotating them means editing and redeploying every copy.
  fix: |
    Read the value at run time from the platform secret store or the environment, fail fast when it is
    missing, and treat the committed value as compromised: rotate it before removing it.

