- key: QG-CS-SML-0209
  name: Type should not be examined on System.Type instances
  languages: [cs, vb]
  category: SML
  severity: minor
  effort: 5min
  message: GetType() is called on a value already known to be a Type.
  summary: GetType() runs on a Type instance.
  why: |
    It returns typeof(Type), which says nothing about the type the value describes - the comparison
    or lookup built on it silently answers the wrong question.
  fix: |
    Compare against another Type directly (`someType == typeof(string)`), or read the properties
    such as Name and IsClass.
