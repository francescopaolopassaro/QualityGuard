- key: QG-CS-SML-0104
  name: In-source issue suppressions should be resolved rather than left in the code
  languages: [cs]
  category: SML
  severity: minor
  effort: 15min
  tags: [marker, generated]
  generated: true
  status: planned
  message: This marker records work that was left open.
  summary: A marker in the source records work or a decision that was left open.
  why: |
    Markers are written for a future reader who never comes back to them. Nobody can tell whether the
    note is still relevant, who owns it, or whether the missing work has since become a defect.
  fix: |
    Do the work, or move it to the issue tracker and reference the ticket in the marker so the deadline
    lives somewhere that gets reviewed.

