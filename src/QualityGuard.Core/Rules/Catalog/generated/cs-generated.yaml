- key: QG-CS-SML-0334
  name: Logger field or property name should follow the naming convention of the codebase
  languages: [cs]
  category: SML
  scope: main
  severity: minor
  effort: 15min
  tags: [naming, generated]
  generated: true

  message: This identifier does not follow the naming convention of the codebase.
  summary: An identifier does not follow the convention used by the rest of the code.
  why: |
    Conventions let a reader infer the kind of an identifier from its shape alone. A deviation costs a
    lookup every time, and makes automated searches and refactorings less reliable.
  fix: |
    Rename the identifier to match the convention, and let the editor propagate the change so callers
    stay in sync.
  detect:
    - invocation: [Instance, Logger, _Logger, _logger, field, format, instance, logger]
      receiver: [ILog, ILogger, ILoggerBase, Logger, TCategoryName]

- key: QG-CS-SML-0335
  name: Trace.Write and Trace.WriteLine should not be used
  languages: [cs]
  category: SML
  scope: main
  severity: minor
  effort: 15min
  tags: [avoid_api, generated]
  generated: true
  status: ready
  message: This API should be replaced by the current alternative.
  summary: Code calls an API that is unsafe, obsolete or superseded by a better alternative.
  why: |
    The API stays available for compatibility, so nothing fails at build time, but it carries behaviour
    the platform now considers a defect — unchecked input, a weak guarantee, or a cost the replacement
    avoids. Its presence also spreads: new code copies what it finds nearby.
  fix: |
    Replace the call with the current API, and keep the old one only behind a compatibility layer that is
    documented and dated.
  detect:
    - member: [Trace.Write]
    - invocation: [Write]
      receiver: [Trace]
    - member: [Trace.WriteLine]
    - invocation: [WriteLine]
      receiver: [Trace]

