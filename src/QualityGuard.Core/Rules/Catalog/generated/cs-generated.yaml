- key: QG-CS-BUG-0059
  name: ThreadStatic fields should be accessed in a thread-safe way
  languages: [cs]
  category: BUG
  severity: major
  effort: 15min
  tags: [concurrency, generated]
  generated: true
  status: ready
  message: Shared state is accessed without correct coordination.
  summary: Shared state is accessed with locking that is missing, too wide, or on the wrong object.
  why: |
    Concurrency defects depend on timing, so they pass every test and appear under load in production.
    Locking on a shared or public object also lets unrelated code block or deadlock this one.
  fix: |
    Lock a private object dedicated to the state it protects, keep the critical section short, and prefer
    the concurrent collections and higher-level primitives the platform provides.
  detect:
    - creation: [ThreadStatic]

