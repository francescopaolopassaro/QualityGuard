- key: QG-CS-SML-0253
  name: Custom attributes should be marked with AttributeUsage
  languages: [cs, vb]
  category: SML
  severity: minor
  effort: 10min
  message: An attribute class declares no AttributeUsage.
  summary: An attribute applies everywhere by default.
  why: |
    Without AttributeUsage the compiler allows it on every target - classes, parameters, return
    values - whether that makes sense or not, and misuse surfaces nowhere until the attribute is
    read.
  fix: |
    Add [AttributeUsage(AttributeTargets.X)] naming where it legitimately applies, and decide
    AllowMultiple while you are there.
