- key: QG-CS-SML-0158
  name: Instance members should not write to static fields
  languages: [cs, vb]
  category: SML
  severity: minor
  effort: 10min
  message: An instance method writes a static field by bare name.
  summary: Per-object code mutates shared storage.
  why: |
    Two instances calling the method race on the same storage: the last writer wins for everyone,
    and tests pass while production interleaves differently.
  fix: |
    Make the field instance state, make the method static, or guard the field explicitly.
