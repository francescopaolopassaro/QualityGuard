- key: QG-CS-SML-0095
  name: A method that returns a collection should return an empty one, not nothing
  languages: [cs]
  category: SML
  severity: minor
  effort: 15min
  tags: [prefer_api, generated]
  generated: false
  status: ready
  message: The platform offers a clearer or safer construct for this.
  summary: A method whose type is a collection returns nothing on some path.
  why: |
    The alternative exists because it removes a class of mistake — a conversion, an allocation, an edge
    case — that the current form leaves to the caller. Using the older form means every reader has to
    check that the edge case was handled.
  fix: |
    Switch to the recommended construct; the behaviour is the same in the normal case and defined in the
    cases the old form got wrong.

- key: QG-CS-SML-0097
  name: Classes should stay within a size that can be reviewed
  languages: [cs]
  category: SML
  severity: minor
  effort: 15min
  tags: [threshold, generated]
  generated: true
  status: planned
  message: This construct is larger or more complex than the limit allows.
  summary: A construct exceeds the size or complexity a reader can follow at once.
  why: |
    Past a certain size, understanding one line means reconstructing everything around it, and testing
    the interesting case means going through the whole entry point. Growth is gradual, so the limit is
    the only thing that keeps the cost visible.
  fix: |
    Split along the responsibilities the code has accumulated: extract the sections that already have a
    name, and keep the original as the sequence of those steps.

- key: QG-CS-SML-0098
  name: Equals and operators should agree with IComparable
  languages: [cs, vb]
  category: SML
  severity: minor
  effort: 15min
  message: A class implements IComparable without overriding Equals.
  summary: Ordering and equality answer different questions.
  why: |
    Sorted collections treat two equal-valued objects as equal while Contains and dictionary lookups
    treat them as different - the same pair both belongs and does not belong, depending on which
    container holds it.
  fix: |
    Override Equals and GetHashCode, then align == and != with CompareTo's notion of sameness.
- key: QG-CS-SML-0099
  name: GC.Collect should not be used
  languages: [cs]
  category: SML
  scope: main
  severity: minor
  effort: 15min
  tags: [avoid_api, generated]
  generated: true
  status: ready
  message: This API should be replaced by the current alternative.
  summary: Code calls an API that is unsafe, obsolete or superseded by a better alternative.
  why: |
    The API stays available for compatibility, so nothing fails at build time, but it carries behaviour
    the platform now considers a defect — unchecked input, a weak guarantee, or a cost the replacement
    avoids. Its presence also spreads: new code copies what it finds nearby.
  fix: |
    Replace the call with the current API, and keep the old one only behind a compatibility layer that is
    documented and dated.
  detect:
    - member: [GC.Collect]
    - invocation: [Collect]
      receiver: [GC]

