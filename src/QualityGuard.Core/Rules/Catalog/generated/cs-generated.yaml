- key: QG-CS-BUG-0095
  name: Message template placeholders should be unique
  languages: [cs, vb]
  category: BUG
  severity: major
  effort: 5min
  message: A log template repeats a placeholder name.
  summary: Duplicate placeholders in a structured log template.
  why: |
    Structured logging binds placeholders positionally: the duplicate reads the first argument twice
    and the second argument never reaches the sink.
  fix: |
    Rename the second occurrence and pass both values.
- key: QG-CS-SML-0338
  name: Use PascalCase for named placeholders
  languages: [cs, vb]
  category: SML
  severity: minor
  effort: 2min
  message: A log placeholder starts lowercase.
  summary: Placeholder casing splits one field into two.
  why: |
    Template names become property names on the structured event; mixed casing makes `{user}` and
    `{User}` two different fields downstream, splitting dashboards and alerts.
  fix: |
    Write placeholders in PascalCase, matching the convention sinks and dashboards expect.
- key: QG-CS-SEC-0082
  name: The key that signs a token should not be in the source
  languages: [cs]
  category: SEC
  severity: critical
  effort: 15min
  tags: [secret, generated]
  generated: false
  status: ready
  message: This value looks like a credential committed with the source.
  summary: The secret used to sign or verify tokens is written into the code.
  why: |
    Anything committed with the code is readable by everyone who can clone the repository, and it
    survives in the history even after being deleted. Scanners find these values within minutes of a
    repository becoming reachable, and rotating them means editing and redeploying every copy.
  fix: |
    Read the value at run time from the platform secret store or the environment, fail fast when it is
    missing, and treat the committed value as compromised: rotate it before removing it.

