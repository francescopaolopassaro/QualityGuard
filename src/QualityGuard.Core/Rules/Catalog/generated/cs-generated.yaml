  languages: [cs, vb]
  category: SML
  severity: minor
  effort: 2min
  message: A raw tab or control character sits inside an ordinary string literal.
  summary: Invisible characters hide inside literals.
  why: |
    A raw tab renders as ordinary whitespace in the editor and travels into comparisons and output
    unchanged - the reader cannot see what the program actually holds.
  fix: |
    Replace the raw character with its escape sequence (\t, \r, \n) so source and meaning agree.
