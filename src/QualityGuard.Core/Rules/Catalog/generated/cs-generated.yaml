- key: QG-CS-SML-0280
  name: Types should not extend outdated base types
  languages: [cs, vb]
  category: SML
  severity: minor
  effort: 30min
  message: A public type inherits a concrete collection directly.
  summary: Storage decisions freeze into the public contract.
  why: |
    Every mutator the collection carries becomes part of the type forever: callers can mutate
    internals, and swapping the implementation later is a breaking change.
  fix: |
    Compose instead - hold the collection privately and expose the operations callers actually need.
