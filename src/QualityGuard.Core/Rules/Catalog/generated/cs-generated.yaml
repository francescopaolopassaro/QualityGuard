- key: QG-CS-SEC-0071
  name: An initialisation vector has to be unpredictable
  languages: [cs]
  category: SEC
  severity: critical
  effort: 15min
  tags: [crypto, generated]
  generated: false
  status: ready
  message: This cryptographic choice no longer provides the protection it suggests.
  summary: A cipher is initialised with a vector fixed in the source.
  why: |
    Broken primitives keep producing output that looks correct, so nothing fails while the protection is
    already gone. Data encrypted today is often kept for years, which means an algorithm that is merely
    weak now will be readable later.
  fix: |
    Use the algorithms the platform recommends today — authenticated encryption, a modern hash, a key
    size at or above the current guidance — and keep the choice in one place so it can be raised.

- key: QG-CS-SEC-0072
  name: Cookies should not weaken the security of the application
  languages: [cs]
  category: SEC
  scope: main
  severity: critical
  effort: 15min
  tags: [sec, generated]
  generated: true
  status: ready
  message: This construct weakens the security of the application.
  summary: A construct that attackers routinely target is used without the guard it needs.
  why: |
    The pattern either trusts data the program does not control, or relies on a mechanism that no longer
    offers the protection it appears to offer. Both keep working normally, which is why they survive
    until someone looks for them.
  fix: |
    Validate the incoming value against an allowed set, pass it as data rather than as code or command,
    and replace weakened mechanisms with the current recommended one.
  detect:
    - creation: [HttpOnly]

