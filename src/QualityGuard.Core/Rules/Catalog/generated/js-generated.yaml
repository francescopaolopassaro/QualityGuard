- key: QG-JS-SML-0323
  name: Generic Error should make failure handling explicit
  languages: [js, ts]
  category: SML
  severity: minor
  effort: 15min
  tags: [exception, generated]
  generated: true
  status: ready
  message: This handling hides the failure instead of dealing with it.
  summary: An exception is thrown, caught or propagated in a way that hides the failure.
  why: |
    Handlers that are too broad, empty, or that replace the original error remove the information needed
    to diagnose the incident, and let the program continue in a state nobody designed for. The symptom
    then appears far from the cause.
  fix: |
    Catch the specific failures this code can recover from, keep the original exception as the cause when
    wrapping, and let everything else reach the boundary handler.
  detect:
    - creation: [TypeError]

- key: QG-JS-SML-0324
  name: Import and export statements should not be left empty
  languages: [js, ts]
  category: SML
  severity: minor
  effort: 15min
  tags: [empty, generated]
  generated: true
  status: planned
  message: This construct is empty, so it does nothing.
  summary: A construct is declared with no content.
  why: |
    An empty body reads as if the case is handled while nothing happens, which is exactly how ignored
    errors and unimplemented branches survive review. It is also indistinguishable from an accidental
    deletion.
  fix: |
    Implement the behaviour, or remove the construct. When doing nothing is deliberate, say so in a
    comment so the next reader does not treat it as a gap.

- key: QG-JS-SEC-0077
  name: Templates should not weaken the security of the application
  languages: [js, ts]
  category: SEC
  severity: critical
  effort: 15min
  tags: [sec, generated]
  generated: true
  status: planned
  message: This construct weakens the security of the application.
  summary: A construct that attackers routinely target is used without the guard it needs.
  why: |
    The pattern either trusts data the program does not control, or relies on a mechanism that no longer
    offers the protection it appears to offer. Both keep working normally, which is why they survive
    until someone looks for them.
  fix: |
    Validate the incoming value against an allowed set, pass it as data rather than as code or command,
    and replace weakened mechanisms with the current recommended one.

