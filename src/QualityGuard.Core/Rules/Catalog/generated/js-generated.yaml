- key: QG-JS-SML-0033
  name: Regular expressions should be safe and correct
  languages: [js, ts]
  category: SML
  severity: minor
  effort: 15min
  tags: [regex, generated]
  generated: true
  status: planned
  message: This pattern is unsafe or incorrect as written.
  summary: A regular expression is malformed, ambiguous, or able to backtrack catastrophically.
  why: |
    A pattern is only validated when it first runs, so a mistake surfaces on the path that uses it —
    often an error path. Patterns with nested quantifiers can also take exponential time on crafted
    input, which turns one request into a stalled CPU core.
  fix: |
    Simplify the pattern so no quantifier can match the same text in several ways, add a matching timeout
    for input that comes from outside, and cover the pattern with a test.

- key: QG-JS-SML-0034
  name: While loop should be replaced by the recommended alternative
  languages: [js, ts]
  category: SML
  severity: minor
  effort: 15min
  tags: [prefer_api, generated]
  generated: true
  status: planned
  message: The platform offers a clearer or safer construct for this.
  summary: A construct is used where the platform offers one that is clearer or safer.
  why: |
    The alternative exists because it removes a class of mistake — a conversion, an allocation, an edge
    case — that the current form leaves to the caller. Using the older form means every reader has to
    check that the edge case was handled.
  fix: |
    Switch to the recommended construct; the behaviour is the same in the normal case and defined in the
    cases the old form got wrong.

