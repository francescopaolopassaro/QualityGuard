- key: QG-JS-BUG-0068
  name: Replacement strings should be safe and correct
  languages: [js, ts]
  category: BUG
  severity: major
  effort: 15min
  tags: [regex, generated]
  generated: true
  status: planned
  message: This pattern is unsafe or incorrect as written.
  summary: A regular expression is malformed, ambiguous, or able to backtrack catastrophically.
  why: |
    A pattern is only validated when it first runs, so a mistake surfaces on the path that uses it —
    often an error path. Patterns with nested quantifiers can also take exponential time on crafted
    input, which turns one request into a stalled CPU core.
  fix: |
    Simplify the pattern so no quantifier can match the same text in several ways, add a matching timeout
    for input that comes from outside, and cover the pattern with a test.

