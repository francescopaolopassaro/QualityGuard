- key: QG-JS-SEC-0042
  name: Server certificates should be verified before use
  languages: [js, ts]
  category: SEC
  severity: critical
  effort: 15min
  tags: [verification, generated]
  generated: true
  status: ready
  message: Skipping certificate validation turns TLS into plain text with extra steps: anyone on the path can present their own certificate.
  summary: A value or a peer is accepted without the check that proves it is legitimate.
  why: |
    Without verification the program trusts whatever it received, so an attacker who can supply or
    intercept the value decides what happens next. The code keeps working in normal conditions, which is
    why the missing check is rarely noticed before it is exploited.
  fix: |
    Perform the check with the platform API — signature, certificate chain, hostname or token validation
    — and reject the value when it fails, instead of logging and continuing.
  detect:
    - assignTo: [rejectUnauthorized]
      contains: [false]
    - assignTo: [NODE_TLS_REJECT_UNAUTHORIZED]
      contains: [0]

