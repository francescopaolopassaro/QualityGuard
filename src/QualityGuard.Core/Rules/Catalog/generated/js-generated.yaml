- key: QG-JS-BUG-0070
  name: Tests should assert something
  languages: [js, ts]
  category: BUG
  severity: major
  effort: 15min
  tags: [tests, generated]
  generated: true
  status: planned
  message: This test cannot fail, so it verifies nothing.
  summary: A test does not assert, is disabled, or cannot fail.
  why: |
    A test that cannot fail reports success forever while covering nothing, and the suite keeps its green
    status. That is worse than having no test at all, because it removes the incentive to write one.
  fix: |
    Assert the behaviour the test exists for, re-enable it, and make sure it fails when the behaviour is
    broken before trusting it again.

- key: QG-JS-BUG-0071
  name: React render functions should match the behaviour the code describes
  languages: [js, ts]
  category: BUG
  severity: major
  effort: 15min
  tags: [bug, generated]
  generated: true
  status: planned
  message: This code does not behave the way it reads.
  summary: The code does not do what its shape suggests, or fails on ordinary input.
  why: |
    Written this way the code works by accident or breaks on values that are perfectly normal, and the
    mistake is easy to miss in review because the intent reads correctly.
  fix: |
    Make the intended behaviour explicit — fix the condition, the operator or the order of operations —
    and cover the case that used to fail with a test.

