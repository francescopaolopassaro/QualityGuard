- key: QG-JS-BUG-0108
  name: Vue component field names should not be duplicated
  languages: [js, ts]
  category: BUG
  severity: major
  effort: 15min
  tags: [duplication, generated]
  generated: true
  status: planned
  message: This code or value is duplicated.
  summary: The same code or value appears more than once.
  why: |
    Copies drift apart the first time one of them is fixed, and nothing links them, so the bug is fixed
    in one place and stays in the other. Readers also cannot tell which copy is authoritative.
  fix: |
    Keep one definition and reference it from the other places, or extract the shared part into a named
    function or constant.

- key: QG-JS-SML-0352
  name: Hard-to-read code should be simplified
  languages: [js, ts]
  category: SML
  severity: minor
  effort: 15min
  tags: [sml, generated]
  generated: true
  status: planned
  message: This code is harder to read or change than the behaviour requires.
  summary: The code works but is harder to read or change than the behaviour requires.
  why: |
    The intent is buried, duplicated, or spread across places that must stay in sync, so every future
    change costs more than it should and carries a risk that has nothing to do with the change itself.
  fix: |
    Remove what is not used, name what is unclear, and keep one piece of behaviour in one place so the
    next change touches a single spot.

- key: QG-JS-SML-0353
  name: Native APIs should be replaced by the recommended alternative
  languages: [js, ts]
  category: SML
  severity: minor
  effort: 15min
  tags: [prefer_api, generated]
  generated: true
  status: planned
  message: The platform offers a clearer or safer construct for this.
  summary: A construct is used where the platform offers one that is clearer or safer.
  why: |
    The alternative exists because it removes a class of mistake — a conversion, an allocation, an edge
    case — that the current form leaves to the caller. Using the older form means every reader has to
    check that the edge case was handled.
  fix: |
    Switch to the recommended construct; the behaviour is the same in the normal case and defined in the
    cases the old form got wrong.

- key: QG-JS-SML-0354
  name: Vue components should be retired
  languages: [js, ts]
  category: SML
  severity: minor
  effort: 15min
  tags: [deprecation, generated]
  generated: true
  status: planned
  message: This deprecated element still needs to be retired.
  summary: A deprecated member is declared, used, or marked without an alternative.
  why: |
    A deprecation is a promise to remove something; left unattended it becomes permanent, and callers
    keep appearing because the member still works. Without a documented replacement nobody can migrate
    even if they want to.
  fix: |
    Document the replacement next to the marker, migrate the callers, and delete the member in a planned
    release rather than leaving the warning in place.

