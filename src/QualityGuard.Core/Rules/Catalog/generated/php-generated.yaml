- key: QG-PP-SML-0041
  name: Reason should assert something
  languages: [php]
  category: SML
  severity: minor
  effort: 15min
  tags: [tests, generated]
  generated: true
  status: planned
  message: This test cannot fail, so it verifies nothing.
  summary: A test does not assert, is disabled, or cannot fail.
  why: |
    A test that cannot fail reports success forever while covering nothing, and the suite keeps its green
    status. That is worse than having no test at all, because it removes the incentive to write one.
  fix: |
    Assert the behaviour the test exists for, re-enable it, and make sure it fails when the behaviour is
    broken before trusting it again.

