  effort: 15min
  tags: [sec, generated]
  generated: true
  status: planned
  message: This construct weakens the security of the application.
  summary: A construct that attackers routinely target is used without the guard it needs.
  why: |
    The pattern either trusts data the program does not control, or relies on a mechanism that no longer
    offers the protection it appears to offer. Both keep working normally, which is why they survive
    until someone looks for them.
  fix: |
    Validate the incoming value against an allowed set, pass it as data rather than as code or command,
    and replace weakened mechanisms with the current recommended one.

- key: QG-PP-SML-0104
  name: WordPress option names should be simplified
  languages: [php]
  category: SML
  severity: minor
  effort: 15min
  tags: [sml, generated]
  generated: true

  message: This code is harder to read or change than the behaviour requires.
  summary: The code works but is harder to read or change than the behaviour requires.
  why: |
    The intent is buried, duplicated, or spread across places that must stay in sync, so every future
    change costs more than it should and carries a risk that has nothing to do with the change itself.
  fix: |
    Remove what is not used, name what is unclear, and keep one piece of behaviour in one place so the
    next change touches a single spot.
  detect:
    - invocation: [customOptions]

- key: QG-PP-SML-0105
  name: Regular expression quantifiers and character classes should be replaced by the recommended alternative
  languages: [php]
  category: SML
  severity: minor
  effort: 15min
  tags: [prefer_api, generated]
  generated: true
  status: planned
  message: The platform offers a clearer or safer construct for this.
  summary: A construct is used where the platform offers one that is clearer or safer.
  why: |
    The alternative exists because it removes a class of mistake — a conversion, an allocation, an edge
    case — that the current form leaves to the caller. Using the older form means every reader has to
    check that the edge case was handled.
  fix: |
    Switch to the recommended construct; the behaviour is the same in the normal case and defined in the
    cases the old form got wrong.

- key: QG-PP-SML-0106
  name: Non-capturing groups without quantifier should not be used
  languages: [php]
  category: SML
  severity: minor
  effort: 15min
  tags: [avoid_api, generated]
  generated: true
  status: planned
  message: This API should be replaced by the current alternative.
  summary: Code calls an API that is unsafe, obsolete or superseded by a better alternative.
  why: |
    The API stays available for compatibility, so nothing fails at build time, but it carries behaviour
    the platform now considers a defect — unchecked input, a weak guarantee, or a cost the replacement
    avoids. Its presence also spreads: new code copies what it finds nearby.
  fix: |
    Replace the call with the current API, and keep the old one only behind a compatibility layer that is
    documented and dated.

