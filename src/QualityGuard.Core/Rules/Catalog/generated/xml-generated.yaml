- key: QG-XML-SEC-0005
  name: Default EJB interceptors should be declared the way the language intends
  languages: [xml]
  category: SEC
  severity: critical
  effort: 15min
  tags: [declaration, generated]
  generated: true
  status: planned
  message: This declaration exposes more than it should.
  summary: A declaration uses modifiers, order or visibility that do not match its purpose.
  why: |
    Declarations are the contract other code relies on. A wider visibility than needed makes an internal
    detail part of the public surface, and unusual modifier combinations hide the intent from readers and
    tools alike.
  fix: |
    Declare the narrowest visibility that works, in the conventional modifier order, and mark as final or
    read-only whatever is not meant to change.

