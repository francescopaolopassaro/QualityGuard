# Catalogue entries written in one pass, one per defect this language still lacks a check for.
# Every entry is documentation and carries no detection, so none of them reports anything: a
# detection is written by hand, against the shape the defect actually has, and measured before
# the entry stops being planned.

- key: QG-SC-SML-0024
  name: Methods should not be empty
  languages: [scala]
  category: SML
  severity: critical
  effort: 5min
  status: planned
  generated: true
  tags: [suspicious]
  summary: Code that no longer takes part in anything is still here.
  why: |
    It has to be read, understood and kept compiling by everyone who passes through, and it gives
    nothing back. Worse, it suggests a purpose that no longer exists.
  fix: |
    Remove it: the history keeps it if it is ever needed again.

