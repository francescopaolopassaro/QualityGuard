# Descriptions for the Java rules implemented in Rules/Languages/JavaAstRules.cs. The detection
# reads the syntax tree; this file carries the reasoning and the fix shown in the report.

- key: QG-JV-BUG-0179
  name: finalize should not be overridden
  languages: [java]
  category: BUG
  severity: critical
  effort: 30min
  tags: [resource-management]
  summary: A class overrides Object.finalize.
  why: |
    Nothing says when finalize runs, on which thread, or whether it runs at all. An exception thrown
    inside it is discarded without a trace, and the object survives an extra collection cycle just to
    be given the chance. Releasing a resource this way means releasing it at an unknown time.
  fix: |
    Release the resource in close, implement AutoCloseable, and let the caller use try-with-resources.

- key: QG-JV-BUG-0180
  name: Case-insensitive comparison should not go through case conversion
  languages: [java]
  category: BUG
  severity: major
  effort: 10min
  tags: [suspicious, performance]
  summary: Both sides of a comparison are upper-cased or lower-cased first.
  why: |
    Two strings are allocated on every call, and the answer is wrong in the locales where changing
    case changes the length of the text — Turkish dotted i is the classic one, and it turns a login
    check into a rejection.
  fix: |
    Use equalsIgnoreCase or compareToIgnoreCase.

- key: QG-JV-BUG-0181
  name: Error should not be extended
  languages: [java]
  category: BUG
  severity: critical
  effort: 30min
  tags: [error-handling]
  summary: A class extends java.lang.Error.
  why: |
    Error is reserved for failures no application can recover from. Code that catches Exception —
    which is every handler anyone writes — never sees it, so the failure travels straight through the
    application and out.
  fix: |
    Extend RuntimeException, or a checked exception when callers are meant to handle it.

- key: QG-JV-BUG-0182
  name: A switch should not contain a label of its own
  languages: [java]
  category: BUG
  severity: critical
  effort: 10min
  tags: [suspicious]
  summary: A jump label appears among the cases of a switch.
  why: |
    It reads exactly like a case but is a jump target, so the code beneath it runs as part of the
    section before it and never on its own. A misspelled "default" becomes a label like this, and the
    compiler accepts it without a word.
  fix: |
    Write the case keyword, or remove the label.

- key: QG-JV-BUG-0183
  name: A method should not almost override Object
  languages: [java]
  category: BUG
  severity: major
  effort: 10min
  tags: [suspicious]
  summary: A method is named tostring, hashcode or equal with the signature of the real one.
  why: |
    The method overrides nothing. Everything that prints, compares or hashes the object keeps using
    the default from Object, and the code written here is never reached.
  fix: |
    Correct the name and add @Override so the compiler checks the next one.

- key: QG-JV-BUG-0184
  name: A method should not be named after its class
  languages: [java]
  category: BUG
  severity: major
  effort: 10min
  tags: [suspicious]
  summary: A method has the same name as the class that declares it.
  why: |
    It has a return type, so it is a method — but every reader sees a constructor. A call to new runs
    the real constructor, and this code sits there unreached.
  fix: |
    Rename the method, or make it the constructor it was meant to be.

- key: QG-JV-BUG-0185
  name: A public static field should be final
  languages: [java]
  category: BUG
  severity: major
  effort: 15min
  tags: [suspicious, concurrency]
  summary: A field is public and static but not final.
  why: |
    Any code in the process can replace it at any moment, from any thread, and every reader of it
    sees the change. That is a global variable with a class name in front of it.
  fix: |
    Make the field final, or hide it behind accessors that control who changes it and when.

- key: QG-JV-BUG-0186
  name: hasNext should not consume the iterator
  languages: [java]
  category: BUG
  severity: blocker
  effort: 30min
  tags: [suspicious]
  summary: An implementation of hasNext calls next.
  why: |
    hasNext is a question, and this one answers it by advancing. Every caller that checks before
    reading skips an element, and a loop that checks twice skips two.
  fix: |
    Look ahead into a field and return it from next, so the check itself changes nothing.

- key: QG-JV-BUG-0187
  name: BigDecimal should not be built from a double
  languages: [java]
  category: BUG
  severity: critical
  effort: 15min
  tags: [suspicious]
  summary: A BigDecimal is constructed from a decimal literal of type double.
  why: |
    The double is not exactly the number that was typed, and this constructor copies the binary
    approximation faithfully — every one of its digits. The BigDecimal then holds a value nobody
    intended, which is the opposite of the reason for using one.
  fix: |
    Pass the number as a string, or use BigDecimal.valueOf.

- key: QG-JV-SML-0435
  name: String.valueOf should not be concatenated to a string
  languages: [java]
  category: SML
  severity: minor
  effort: 5min
  tags: [readability]
  summary: String.valueOf is called on a value that is then concatenated.
  why: |
    Concatenating with a string already converts the value, so the call does the same work twice and
    hides what is being appended.
  fix: |
    Append the value directly.

- key: QG-JV-SML-0436
  name: A wrapper should not be created just to convert a primitive
  languages: [java]
  category: SML
  severity: major
  effort: 5min
  tags: [performance]
  summary: A wrapper object is allocated only to call toString or compareTo on it.
  why: |
    The object exists for the length of one call and is then discarded. The static form does the same
    work without allocating anything.
  fix: |
    Use Integer.toString(value), Integer.compare(a, b) and the equivalents on the other wrappers.

- key: QG-JV-SML-0437
  name: A rethrown exception should carry the original
  languages: [java]
  category: SML
  severity: major
  effort: 15min
  tags: [error-handling]
  summary: A catch throws a new exception without using the one it caught.
  why: |
    The stack trace stops at this line. Whoever reads the log sees the symptom and nothing about what
    actually failed, which is the part that would have told them where to look.
  fix: |
    Pass the caught exception as the cause of the new one.

- key: QG-JV-SML-0438
  name: Internal JDK packages should not be used
  languages: [java]
  category: SML
  severity: critical
  effort: 1h
  tags: [portability]
  summary: A class from sun.*, com.sun.* or jdk.internal.* is imported.
  why: |
    These packages carry no compatibility promise, the module system blocks them by default since
    Java 9, and an upgrade can remove them without notice — so the build breaks on a version bump
    that changed nothing in your own code.
  fix: |
    Use the public API that replaced it.

- key: QG-JV-SML-0439
  name: A catch should not sort exceptions with instanceof
  languages: [java]
  category: SML
  severity: major
  effort: 15min
  tags: [error-handling]
  summary: A catch clause tests the type of the exception it caught.
  why: |
    The language already dispatches on the type of an exception — that is what the catch clauses are
    for. Doing it again by hand means this handler catches everything, including the exceptions it
    has nothing to say about, and swallows them by falling off the end of the chain.
  fix: |
    Write one catch per exception the code really handles, and let the rest travel up.

- key: QG-JV-SML-0440
  name: toString should not be called on a string
  languages: [java]
  category: SML
  severity: minor
  effort: 5min
  tags: [readability]
  summary: toString is called on a value that is already a string.
  why: |
    The call returns the same object. It only makes the reader look for a conversion that is not
    happening.
  fix: |
    Remove the call.

- key: QG-JV-SML-0441
  name: A comparison should not be negated
  languages: [java]
  category: SML
  severity: minor
  effort: 5min
  tags: [readability]
  summary: A relational or equality comparison is wrapped in a negation.
  why: |
    Every operator here has an opposite, and using it says the same thing without asking the reader
    to invert a condition in their head.
  fix: |
    Use the opposite operator.

- key: QG-JV-SML-0442
  name: main should not let exceptions escape
  languages: [java]
  category: SML
  severity: major
  effort: 15min
  tags: [error-handling]
  summary: The main method declares a throws clause.
  why: |
    An exception that leaves main reaches the default handler, which prints a stack trace at the user
    and exits with a status nobody chose. Neither is a message, and neither is a decision.
  fix: |
    Catch it, report what went wrong in a sentence, and exit with a status the caller can act on.

- key: QG-JV-SML-0443
  name: A one-statement lambda should not need a block
  languages: [java]
  category: SML
  severity: minor
  effort: 5min
  tags: [readability]
  summary: A lambda body is a block holding a single short statement.
  why: |
    The braces, the semicolon and the return add three pieces of syntax around something that fits on
    the arrow.
  fix: |
    Write the expression directly after the arrow.
