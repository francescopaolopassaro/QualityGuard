name: android
language: kt
aliases: [kotlin-android, androidx]
description: Android framework (AndroidX, Jetpack Compose)

types:
  - name: Context
    methods: [getSystemService, getContentResolver, getSharedPreferences,
              getPackageManager, startActivity, startService, bindService,
              sendBroadcast, getString, getDrawable, getAssets, getCacheDir,
              getFilesDir, getDatabasePath, openOrCreateDatabase]
  - name: Activity
    extends: [Context]
    methods: [setContentView, findViewById, getIntent, setResult, finish,
              onCreate, onResume, onPause, onDestroy, onStart, onStop,
              onSaveInstanceState, onRestoreInstanceState]
  - name: AppCompatActivity
    extends: [Activity]
    methods: [setSupportActionBar, supportActionBar, setSupportActionBar]
  - name: Fragment
    extends: [Context]
    methods: [getActivity, getContext, requireContext, getView, getArguments,
              setArguments, onViewCreated, onAttach, onDetach, onDestroyView]
  - name: ViewModel
    methods: [getViewModelScope]
  - name: LiveData
    methods: [observe, setValue, postValue, getValue, removeObserver]
  - name: MutableLiveData
    extends: [LiveData]
  - name: Repository
  methods: []
  - name: SharedPreferences
    methods: [getString, getInt, getBoolean, getFloat, getLong, getStringSet,
              edit, contains, registerOnSharedPreferenceChangeListener]
  - name: SharedPreferencesEditor
    methods: [putString, putInt, putBoolean, putFloat, putLong, putStringSet,
              remove, clear, apply, commit]
  - name: ContentResolver
    methods: [query, insert, update, delete, getType, openInputStream,
              openOutputStream, openFileDescriptor]
  - name: SQLiteDatabase
    methods: [rawQuery, execSQL, insert, update, delete, beginTransaction,
              setTransactionSuccessful, endTransaction, close]
  - name: Intent
    methods: [putExtra, getStringExtra, getIntExtra, getBooleanExtra,
              getSerializableExtra, getParcelableExtra, setAction, setData,
              setClass, addFlags, setComponent, setPackage]
  - name: Notification
    methods: [build]
  - name: NotificationCompat
    methods: [Builder]
  - name: SecurityManager
    methods: [getInstalledPackages, checkPermission]
  - name: BiometricPrompt
    methods: [authenticate, createDialog, createFragmentActivity]
  - name: KeyStore
    methods: [getInstance, load, getKey, setKeyEntry, getCertificateChain]
  - name: WebView
    methods: [loadUrl, loadData, evaluateJavascript, setJavaScriptEnabled,
              addJavascriptInterface, setWebViewClient, getSettings]

