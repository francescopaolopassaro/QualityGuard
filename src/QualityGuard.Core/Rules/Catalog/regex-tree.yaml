- key: QG-JV-BUG-0136
  name: A look-ahead should not contradict what follows it
  languages: [java]
  category: BUG
  scope: main
  severity: critical
  effort: 10min
  tags: [regex, suspicious]
  summary: A look-ahead asserts one character while the element after it requires a different one.
  why: |
    A look-ahead reads without consuming, so whatever follows has to satisfy the assertion and
    itself at the same position. '(?=a)b' asks for a position that is both an 'a' and a 'b', which
    no input can be. The pattern compiles, runs and never matches.
  fix: |
    Decide which of the two the position should hold. Usually the assertion belongs after the
    element it describes ('a(?=b)'), or it should be a look-behind ('(?<=a)b').

