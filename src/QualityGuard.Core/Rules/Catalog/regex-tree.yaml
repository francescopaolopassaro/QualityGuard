- key: QG-JV-BUG-0137
  name: A control-character escape should name a character in range
  languages: [java]
  category: BUG
  scope: main
  severity: major
  effort: 10min
  tags: [regex, suspicious]
  summary: A '\cX' escape names a character outside the range the escape is defined for.
  why: |
    The escape takes the character 64 positions below the one that follows it. That only lands on a
    control character for '@', an upper-case letter, '[', '\', ']', '^' or '_'. For anything else the
    engine performs the subtraction anyway and matches a character nobody intended, without a
    warning at compile time or at run time.
  fix: |
    Write the escape with the upper-case letter of the control character you mean, as in '\cA' for the
    start-of-heading character, or write the character with a hexadecimal escape.

- key: QG-PY-SML-0112
  name: A pattern should not use an octal escape
  languages: [py]
  category: SML
  scope: main
  severity: minor
  effort: 5min
  tags: [regex, readability]
  summary: A backslash followed by digits stands for a character code rather than a group.
  why: |
    A backslash and digits is how a reference to a captured group is written. When no such group
    exists the engine reads the digits as an octal character code instead, so the same text means
    two different things depending on how many groups the pattern happens to declare. A group
    added later changes what the escape matches.
  fix: |
    Write the character as a hexadecimal escape ('\x41') or put it in the pattern directly, so it
    cannot be confused with a reference.

- key: QG-JV-BUG-0126
  name: Case-insensitive matching of non-ASCII letters should say so
  languages: [java]
  category: BUG
  scope: main
  severity: major
  effort: 10min
  tags: [regex, unicode]
  summary: A pattern with non-ASCII letters asks for case insensitivity without asking for Unicode folding.
  why: |
    By default, ignoring case only folds letters in the ASCII range. A pattern that contains accented
    or non-Latin letters therefore keeps comparing exactly those letters case sensitively — the very
    ones the flag was turned on for. The pattern matches the lower-case input it was tested with and
    misses the upper-case one in production.
  fix: |
    Add the Unicode case option next to the case-insensitive one, or write the 'u' flag inside the
    pattern. The Unicode character-class option implies it as well.

- key: QG-JV-SML-0310
  name: A regular expression should not be too complicated
  languages: [java]
  category: SML
  scope: main
  severity: major
  effort: 30min
  tags: [regex, brain-overload]
  summary: The pattern nests alternatives, quantifiers and assertions past what a reader can follow.
  why: |
    Complexity in a pattern is nesting: every alternative, quantifier, assertion and flag group costs
    as much as the depth it sits at. Past a point nobody can say what the pattern accepts without
    running it, which is how a pattern keeps a bug through several reviews — and how a change made
    for one input quietly breaks another.
  fix: |
    Split the pattern into named parts and match them in turn, or do part of the work in code. When
    the pattern has to stay whole, write it in the extended form with comments on each part.

