- key: QG-JV-SML-0353
  name: A non-capturing group should group something
  languages: [java]
  category: SML
  scope: main
  severity: minor
  effort: 5min
  tags: [regex, readability]
  summary: A non-capturing group holds no alternatives and carries no quantifier.
  why: |
    Parentheses in a pattern are there to hold alternatives together, to give a quantifier something
    to repeat, or to capture. A non-capturing group that does none of the three costs the reader a
    moment to check and gives nothing back.
  fix: |
    Drop the parentheses and leave their content in place. Keep them when a quantifier is about to be
    added, and add it in the same change.

