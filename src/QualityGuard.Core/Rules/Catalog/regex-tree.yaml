# Descriptions for the regular-expression rules that read the pattern as a tree, implemented in
# Rules/RegexTreeRules.cs on top of Analysis/RegexSyntax.cs.

- key: QG-JV-BUG-0123
  name: Alternatives should be grouped when the pattern is anchored
  languages: [java]
  category: BUG
  scope: main
  severity: major
  effort: 10min
  tags: [regex, suspicious]
  summary: An anchor sits next to a bar, so it binds to one alternative instead of all of them.
  why: |
    An anchor binds tighter than a bar, so '^a|b|c$' means "starts with a", "contains b" or
    "ends with c" — three different questions, only one of them anchored at each end. The pattern
    then accepts input the author meant to reject, and the mistake never shows in a test that only
    feeds it the strings it should match.
  fix: |
    Put the alternatives in a non-capturing group so the anchors apply to the whole pattern:
    '^(?:a|b|c)$'. When the anchors really belong to one branch each, group that branch instead so
    the intent is on the page.

