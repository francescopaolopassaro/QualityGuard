- key: QG-JV-BUG-0127
  name: A character class should not list a combined character
  languages: [java]
  category: BUG
  scope: main
  severity: major
  effort: 10min
  tags: [regex, unicode]
  summary: A character written with a separate combining mark appears inside a character class.
  why: |
    A class lists code points, not the characters a reader sees. A letter carrying its accent as a
    separate mark therefore enters the class as two independent members, and the class starts
    matching the bare letter and the bare accent — never the accented letter as a whole. The text
    looks right in the editor, which is what makes this one expensive to find.
  fix: |
    Write the combined characters as alternatives, as in 'c̈|d̈', or normalise the input and the
    pattern to the single-code-point form before matching.

