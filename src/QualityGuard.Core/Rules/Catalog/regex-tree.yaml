- key: QG-JV-SML-0291
  name: Plain text should be replaced without the regex engine
  languages: [java]
  category: SML
  scope: main
  severity: major
  effort: 5min
  tags: [regex, performance]
  summary: A replacement goes through the regex engine although the pattern holds no regex feature.
  why: |
    The call compiles a pattern every time it runs, and a pattern that is only literal characters
    buys nothing for that cost. It also invites a defect later: the day someone puts a dot or a
    plus in the text, it stops being literal and starts matching more than it should.
  fix: |
    Call the plain text replacement instead. Keep the regex form only when the argument really is a
    pattern, and then make that visible — a character class or a quantifier in it says so.

