- key: QG-JV-SML-0350
  name: A pattern should not contain an empty group
  languages: [java]
  category: SML
  scope: main
  severity: major
  effort: 10min
  tags: [regex, suspicious]
  summary: A pair of parentheses in the pattern encloses nothing.
  why: |
    An empty group matches the empty string and changes nothing about what the pattern accepts. It
    is either what a refactoring left behind, or a pair of parentheses that was meant to be matched
    literally and was never escaped. In the second case the pattern silently accepts text without
    the parentheses it was supposed to require.
  fix: |
    Remove the group, or escape the parentheses when the text really contains them. When the group
    was supposed to capture something, put back what it lost.

