- key: QG-JV-SML-0351
  name: A pattern should use the shorthand for what it spells out
  languages: [java]
  category: SML
  scope: main
  severity: minor
  effort: 5min
  tags: [regex, readability]
  summary: A class or a quantifier is written the long way when a shorthand says the same thing.
  why: |
    Every flavour understands '\d' for '[0-9]', '\w' for '[A-Za-z0-9_]', '?' for '{0,1}' and '{2}' for
    '{2,2}'. The long form gives the reader more to verify for the same behaviour, and a range
    written out by hand is where a missing character hides.
  fix: |
    Use the shorthand. Keep the long form only when the class deliberately differs from it, and then
    it is worth a comment saying how.

