- key: QG-JV-SML-0315
  name: A named group reference should point at a group that exists
  languages: [java]
  category: SML
  scope: main
  severity: major
  effort: 10min
  tags: [regex, suspicious]
  summary: The pattern refers to a group by a name it never declares.
  why: |
    A reference to a name no group carries either stops the pattern from compiling or is read as
    plain text, depending on the engine. Both outcomes surface far from the pattern: one as an
    exception on the path that uses it, the other as a match that quietly never happens.
  fix: |
