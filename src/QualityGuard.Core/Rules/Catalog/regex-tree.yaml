- key: QG-JV-BUG-0132
  name: A possessive quantifier should leave something for what follows
  languages: [java]
  category: BUG
  scope: main
  severity: critical
  effort: 10min
  tags: [regex, suspicious]
  summary: What follows a possessive quantifier can only match characters the quantifier already took.
  why: |
    A possessive quantifier never backtracks: once it has read as much as it can, it gives nothing
    back. When the element after it accepts only characters the quantifier accepts too, there is
    never anything left for it and the pattern fails on every input. The call still compiles and
    still runs, so the failure looks like data that does not match.
  fix: |
    Move the element in front of the possessive quantifier ('aa++bc' instead of 'a++abc'), or make
    the quantifier greedy so it can give characters back, or assert the tail with a look-behind.

