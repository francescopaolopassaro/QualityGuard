<svg viewBox="0 0 800 500" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>

    <!-- Shield & Tech Gradient -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>

  <!-- LOGOMARK -->
  <g transform="translate(400, 195)">
    <!-- Outer Shield Outline (Security) -->
    <path d="M 0,-105 
             L 75,-70 
             C 75,20 45,75 0,105 
             C -45,75 -75,20 -75,-70 
             Z" 
          fill="none" 
          stroke="url(#primary-grad)" 
          stroke-width="5" 
          stroke-linejoin="round"
          filter="url(#glow)"/>

    <!-- Inner Shield Layer -->
    <path d="M 0,-85 
             L 58,-57 
             C 58,12 35,58 0,82 
             C -35,58 -58,12 -58,-57 
             Z" 
          fill="none" 
          stroke="#1e293b" 
          stroke-width="3" 
          stroke-dasharray="6 4"/>

    <!-- API Nodes & Connections (API) -->
    <!-- Left Connection Line -->
    <path d="M -35,-20 L -15,10 L 0,-10" fill="none" stroke="url(#accent-grad)" stroke-width="4" stroke-linecap="round"/>
    <!-- Right Connection Line -->
    <path d="M 35,-20 L 15,10 L 0,-10" fill="none" stroke="url(#accent-grad)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- API Node Circles -->
    <circle cx="-35" cy="-20" r="5" fill="#00F2FE"/>
    <circle cx="35" cy="-20" r="5" fill="#00F2FE"/>
    <circle cx="0" cy="-10" r="6" fill="#00E676" filter="url(#glow)"/>

    <!-- Code Brackets </ > (Code Quality) -->
    <!-- Left Bracket < -->
    <path d="M -22,25 L -35,38 L -22,51" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Slash / -->
    <path d="M -5,56 L 5,20" fill="none" stroke="url(#primary-grad)" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Right Bracket > -->
    <path d="M 22,25 L 35,38 L 22,51" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Quality Checkmark Dot -->
    <circle cx="0" cy="70" r="4" fill="#00E676"/>
  </g>

  <!-- TYPOGRAPHY -->
  <!-- Brand Name: QUALITYGUARD -->
  <text x="400" y="360" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-weight="800" 
        font-size="42" 
        letter-spacing="6" 
        fill="#FFFFFF">
    QUALITY<tspan fill="url(#primary-grad)">GUARD</tspan>
  </text>

  <!-- Subtitle: CODE • API • SECURITY -->
  <text x="400" y="400" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-weight="600" 
        font-size="13" 
        letter-spacing="8" 
        fill="#64748B">
    CODE <tspan fill="#00F2FE">•</tspan> API <tspan fill="#00E676">•</tspan> SECURITY
  </text>
</svg>
